<path id="p12signsstoryform" d="M270,794 C510,794 690,822 930,822" fill="none" stroke="#f2a600" stroke-width="2" stroke-opacity="0.8"/>
<circle cx="270" cy="794" r="3" fill="#f2a600"/><path d="M922,818 L930,822 L922,826" fill="none" stroke="#f2a600" stroke-width="2"/>
<circle cx="672.6" cy="812.7" r="10" fill="#ffffff" stroke="#f2a600" stroke-width="2"/><text x="672.6" y="816.7" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">14</text>
<line x1="40" x2="1160" y1="878" y2="878" stroke="#d8d4ca"/>
<circle cx="50" cy="896" r="10" fill="#ffffff" stroke="#257de0" stroke-width="2"/><text x="50" y="900" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">1</text>
<text x="68" y="900" font-size="11.5" fill="#333">“I will confess his name before my Father”</text>
<text x="585" y="900" font-size="10.5" fill="#777" text-anchor="end">3:5 → 10:32</text>
<circle cx="50" cy="926" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="50" y="930" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">2</text>
<text x="68" y="930" font-size="11.5" fill="#333">“I will keep you from the hour of trial” becomes “bring us not into trial”</text>
<text x="585" y="930" font-size="10.5" fill="#777" text-anchor="end">3:10 → 6:13</text>
<circle cx="50" cy="956" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="50" y="960" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">3</text>
<text x="68" y="960" font-size="11.5" fill="#333">“as many as I love”: said by the betrayer, of the teacher</text>
<text x="585" y="960" font-size="10.5" fill="#777" text-anchor="end">3:19 → 26:48</text>
<circle cx="50" cy="986" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="50" y="990" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">4</text>
<text x="68" y="990" font-size="11.5" fill="#333">the Lamb buys with blood; the priests buy a field with the price of blood</text>
<text x="585" y="990" font-size="10.5" fill="#777" text-anchor="end">5:9 → 27:6–7</text>
<circle cx="50" cy="1016" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="50" y="1020" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">5</text>
<text x="68" y="1015" font-size="11.5" fill="#333">the balance in the rider’s hand: “take my yoke”; the crown given: a crown of</text>
<text x="68" y="1028" font-size="11.5" fill="#333">thorns</text>
<text x="585" y="1020" font-size="10.5" fill="#777" text-anchor="end">6:5 → 11:29; 6:2 → 27:29</text>
<circle cx="50" cy="1046" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="50" y="1050" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">6</text>
<text x="68" y="1050" font-size="11.5" fill="#333">the dragon seized, bound, sealed over: the teacher seized, bound, sealed in</text>
<text x="585" y="1050" font-size="10.5" fill="#777" text-anchor="end">20:1–3 → 26:50; 27:66</text>
<circle cx="50" cy="1076" r="10" fill="#ffffff" stroke="#00b894" stroke-width="2"/><text x="50" y="1080" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">7</text>
<text x="68" y="1080" font-size="11.5" fill="#333">no one buys or sells without the mark: sellers and buyers cast out</text>
<text x="585" y="1080" font-size="10.5" fill="#777" text-anchor="end">13:17 → 21:12</text>
<circle cx="620" cy="896" r="10" fill="#ffffff" stroke="#f2a600" stroke-width="2"/><text x="620" y="900" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">8</text>
<text x="638" y="900" font-size="11.5" fill="#333">the dragon waits to devour the child: Herod seeks the child</text>
<text x="1155" y="900" font-size="10.5" fill="#777" text-anchor="end">12:4 → 2:13</text>
<circle cx="620" cy="926" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="620" y="930" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">9</text>
<text x="638" y="925" font-size="11.5" fill="#333">“the devil will throw some of you into prison, to be tried”: led out to be</text>
<text x="638" y="938" font-size="11.5" fill="#333">tried by the devil</text>
<text x="1155" y="930" font-size="10.5" fill="#777" text-anchor="end">2:10 → 4:1</text>
<circle cx="620" cy="956" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="620" y="960" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">10</text>
<text x="638" y="960" font-size="11.5" fill="#333">“I fell at his feet as dead … fear not”: three fall on the mountain</text>
<text x="1155" y="960" font-size="10.5" fill="#777" text-anchor="end">1:17 → 17:6–7</text>
<circle cx="620" cy="986" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="620" y="990" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">11</text>
<text x="638" y="990" font-size="11.5" fill="#333">thrown into the lake of fire: thrown into the furnace of fire</text>
<text x="1155" y="990" font-size="10.5" fill="#777" text-anchor="end">20:15 → 13:42</text>
<circle cx="620" cy="1016" r="10" fill="#ffffff" stroke="#f2a600" stroke-width="2"/><text x="620" y="1020" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">12</text>
<text x="638" y="1020" font-size="11.5" fill="#333">the wedding of the Lamb: “the kingdom is like a king who made a wedding”</text>
<text x="1155" y="1020" font-size="10.5" fill="#777" text-anchor="end">19:7–9 → 22:1–14</text>
<circle cx="620" cy="1046" r="10" fill="#ffffff" stroke="#f2a600" stroke-width="2"/><text x="620" y="1050" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">13</text>
<text x="638" y="1050" font-size="11.5" fill="#333">“my wage with me … the first and the last”: the labourers paid last to first</text>
<text x="1155" y="1050" font-size="10.5" fill="#777" text-anchor="end">22:12–13 → 20:1–16</text>
<circle cx="620" cy="1076" r="10" fill="#ffffff" stroke="#f2a600" stroke-width="2"/><text x="620" y="1080" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">14</text>
<text x="638" y="1080" font-size="11.5" fill="#333">“a great earthquake came”: at the tomb, in the same words</text>
<text x="1155" y="1080" font-size="10.5" fill="#777" text-anchor="end">16:18 → 28:2</text>
<line x1="40" x2="66" y1="1142" y2="1142" stroke="#257de0" stroke-width="3" stroke-linecap="round"/><text x="72" y="1146" font-size="12.5" fill="#333">Kept</text>
<line x1="122.8" x2="148.8" y1="1142" y2="1142" stroke="#f47230" stroke-width="3" stroke-linecap="round"/><text x="154.8" y="1146" font-size="12.5" fill="#333">Exchanged: the bearer or the one it is done to</text>
<line x1="487.0" x2="513.0" y1="1142" y2="1142" stroke="#00b894" stroke-width="3" stroke-linecap="round"/><text x="519.0" y="1146" font-size="12.5" fill="#333">Opposed</text>
<line x1="589.9" x2="615.9" y1="1142" y2="1142" stroke="#f2a600" stroke-width="3" stroke-linecap="round"/><text x="621.9" y="1146" font-size="12.5" fill="#333">Given a form: happens, is likened, enacted, named in the land</text>
</svg>