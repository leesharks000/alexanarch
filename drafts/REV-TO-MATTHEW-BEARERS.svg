<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">How the Apocalypse produces the Gospel: who bears each relation</title>
<desc id="d">Left, the bearers of relations in Revelation. Middle, the two parameters and the move. Right, who bears the relation in Matthew, with one checked example for each line.</desc>
<rect width="1200" height="1170" fill="#ffffff"/>
<text x="40" y="40" font-size="24" fill="#1a1a1a">How the Apocalypse produces the Gospel</text>
<text x="40" y="64" font-size="14" fill="#555">Give the heavenly speaker a past and a land. Then each relation of Revelation has somewhere to fall. One checked example on every line.</text>
<text x="40" y="104" font-size="16" font-weight="bold" fill="#1a1a1a">IN REVELATION</text><text x="930" y="104" font-size="16" font-weight="bold" fill="#1a1a1a">IN MATTHEW</text>
<text x="600" y="104" font-size="13" text-anchor="middle" fill="#555">P1: the speaker is given a past  ·  P2: the life is told in a named land</text>
<rect x="40" y="125" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="155.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The speaker</text>
<text x="155.0" y="173.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">“I”, from heaven, about to come</text>
<rect x="40" y="225" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="255.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The Lamb</text>
<text x="155.0" y="273.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">slain; buys with blood</text>
<rect x="40" y="325" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="355.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The four riders</text>
<text x="155.0" y="373.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">crown, sword, balance, death</text>
<rect x="40" y="425" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="455.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The adversary</text>
<text x="155.0" y="473.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">dragon, beast, Babylon</text>
<rect x="40" y="545" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="575.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The faithful and the seer</text>
<text x="155.0" y="593.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">tried; sees and falls</text>
<rect x="40" y="665" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="695.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The city and the end</text>
<text x="155.0" y="713.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">wedding, harvest, fire, gates</text>
<rect x="40" y="775" width="230" height="60" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="155.0" y="805.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Signs in heaven</text>
<text x="155.0" y="823.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">sun, stars, earthquake</text>
<rect x="930" y="160" width="230" height="64" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="1045.0" y="192.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The teacher</text>
<text x="1045.0" y="210.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">says it, does it, suffers it</text>
<rect x="930" y="330" width="230" height="64" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="1045.0" y="362.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The followers</text>
<text x="1045.0" y="380.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">the twelve; Peter; “you”</text>
<rect x="930" y="500" width="230" height="64" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="1045.0" y="532.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The adversaries in the land</text>
<text x="1045.0" y="550.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">Herod, priests, Pharisees, Judas</text>
<rect x="930" y="650" width="230" height="64" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="1045.0" y="682.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The hearers at the judgment</text>
<text x="1045.0" y="700.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">the fruitless; the lawless</text>
<rect x="930" y="790" width="230" height="64" rx="6" fill="#f1efe9" stroke="#b9b4a8"/>
<text x="1045.0" y="822.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The told world</text>
<text x="1045.0" y="840.0" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">parables, events, a map</text>
