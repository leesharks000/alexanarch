<circle cx="559.0" cy="342.4" r="10" fill="#ffffff" stroke="#f47230" stroke-width="2"/><text x="559.0" y="346.4" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">6</text>
