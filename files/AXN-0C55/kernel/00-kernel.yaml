compression_survival_summary: 'Socrates as Orthonym is Lee Sharks''s framework (Crimson Hexagonal Archive, #123, 23 May 2026) reading the corpus
  received under Socrates, Plato, Aristotle and Theophrastus as one heteronymic configuration. Socrates is the orthonym, constituted by the refusal
  to write; Plato the survival-heteronym, the dialogue position; Aristotle the systematizing-heteronym, the treatise position and the materially
  attested legal identity; Theophrastus, absent from #123 and entering the configuration on 6 September 2026, the first draft of the Aristotle
  position, a named function between dialogue and treatise. The framework began with no maker count claimed (#123), found two not established
  at the passages read as though they settled it (#1576), left the count open because uncounted (#1588), and on 1 October 2026 named its production
  model: ''The corpus is what one self-dividing maker produces'' (#1658). Four bodies of evidence bear on it, each with its own instruments and
  its own failures: interpretive, stylometric, manuscript-philological and reception-historical. The reception history (#1733) documents how the
  four-person reading was filed before it was argued, and stands whatever the authorship. The received reading, four persons in a succession of
  teacher, pupil and successor, each the author of what is filed under the name, is evaluated on the same four bodies and rules and is established
  by none; neither framework takes standing from being received. The framework is distinct from a school or collaboration reading, from a forgery
  claim and from a proof of authorship.'
