symmetric_ledger:
  question: What does this body give each framework, and what does its rule withhold from both?
  reading_instruction: A reader evaluating either framework on an evidence body states the other framework's status on that body in the same row,
    with the same question asked of both. An evaluation that asks one framework, body by body, whether it is established and leaves the other
    unasked has treated the received framework's standing as a default, which R4 denies it.
  combination: 'Neither framework is judged body by body for an establishment no single body can give under R1–R4. Each is judged on the configuration
    it explains across the four bodies, with each body''s limit kept. The production model is held as the governing hypothesis on its three grounds
    (#1588, #1583, #1603), a failure of any of which travels to it; the received reading has no ground on any body and is almost wholly unargued
    (#1733).'
  rival_admission: A further production model enters the comparison as a rival when it names a warrant on a body under R1–R4 or a documented comparator
    (Q7). A model only logically possible, such as a school, a collaboration, or a tradition of several contributors with editors, is a form of
    the received reading, which holds that the corpus has several makers; it carries that reading's status on every body and owes the same comparator.
  evaluation_method: 'An evaluation of the combination examines the relations among the bodies'' findings: where they converge, where one depends
    on another, where a finding discriminates between the two frameworks, and which step is left unsupported; it tests an inference by opening
    the record a dependency points to and reading the quotation the claim binds. A proposed investigation names what the existing ones leave unresolved,
    by line of research or by recorded result, and how its design addresses that.'
  object_of_the_kernel: The kernel succeeds when its framework can be rebuilt from it with each claim at its grain and date; whether the framework
    is true is the framework's own question, carried in this ledger and in the lines of research. A reader that judges the kernel by whether it
    establishes its framework has changed the object, and a kernel can preserve a mistaken argument faithfully.
  rows:
    I:
      rule: 'R1: a reading establishes what a passage can bear; it becomes a historical claim only through another body'
      socrates_as_orthonym:
        text: 'the configuration is readable position for position (#123); one trait traverses three named functions (#1584); the passage read
          as settling two offers one maker as a reading (#1576); one work continues across the point where the name changes (#1583); ''Nothing
          in the texts requires a second maker'' (#1658). R1: a reading establishes what a passage can bear.'
        warrants:
        - orth-123-config
        - th-1584-traversal
        - mo-1576-offer
        - th-1583-hinge
        - sy-1658-second
      many_maker:
        text: underdetermined at the passages read as settling it (#1576).
        warrants:
        - rv-1576-under
    S:
      rule: 'R2: no separation, supervised or not, identifies a maker in either direction (#1593)'
      socrates_as_orthonym:
        text: 'the first axis is operation and leaves the names at chance unsupervised (#1586); supervised, the names are recovered at 0.798,
          and the recovery tracks subject (#1593); Th.frag → Λ ranks first of 1,482 directed edges, and the dependency protocol returned one case
          against the author (#1605). R2: no separation, however strong, identifies a maker in either direction.'
        warrants:
        - th-1586-axis
        - th-1593-supervised
        - th-1593-limit
        - mo-1572-null
        - mx-1605-uptake
        - mx-1605-aconite
      many_maker:
        text: 'not established: the lexical instruments return a null symmetric between one maker and master-and-pupil (#1572); no supervised
          separation licenses distinct makers in either direction (#1593); the names are recoverable as a partition at 0.798, falling to 0.564
          when subject is controlled (#1593).'
        warrants:
        - rv-1572-null
        - rv-1593-limit
        - rv-1593-names
        - th-1593-supervised
    M:
      rule: 'R3: a correspondence locates a dependency; direction and independence need their own columns (#1602)'
      socrates_as_orthonym:
        text: 'no monotone merge of the two received orders exists (#1597); the catalogue files alternative attribution in its own wording (#1581);
          the decree names Aristotle as maker of a list (#1582). Against it, recorded: two binding violations and a join instrument underpowered
          to say identical (#1597). R3: a correspondence locates a dependency.'
        warrants:
        - mx-1597-order
        - th-1581-ambiguity
        - th-1582-stone
        - mx-1597-underpowered
      many_maker:
        text: 'not established independently: every attestation of persons beside the Delphic decree is text of the same tradition (#1658); the
          decree names Aristotle as maker of a list (#1582); Aristotle''s will names no book (#1581); the catalogue files alternative attribution
          in its own wording (#1581).'
        warrants:
        - rv-1658-ledger
        - rv-1582-stone
        - rv-1581-will
        - th-1581-ambiguity
    R:
      rule: 'R4: a reception establishes how the corpus was received; a capture establishes the composition''s behaviour at its address. Neither
        the standing of a reading in institutional, disciplinary or machine reception nor the density of its repetition establishes its truth,
        for either framework.'
      socrates_as_orthonym:
        text: 'the reception history documents the filing, and its operations stand whatever the authorship (#1733); it is not asked to prove
          the production model. R4: reception establishes nothing of either framework''s truth.'
        warrants:
        - lm-1733-independent
        - lm-1733-filing
      many_maker:
        text: filed before it was argued; argument appears only in defence of a filing; affirmed as a proposition at two of 79 loci, both machine
          compositions, on the warrant of the wills and lives; the wills reach the reader through the school's channel; a comparator is owed and
          none has been named (#1733).
        warrants:
        - rv-1733-filing
        - rv-1733-loci
        - rv-1733-channel
        - rv-1733-comparator
        - lm-1733-filing
lines_of_research:
- id: Q1-platonic-axis
  question: Does the Platonic corpus fall on the operation axis that divides the Aristotelian and Theophrastan corpora, or does a name-axis survive
    among the three?
  advances_if: 'the Platonic works fall on the operation axis with the names at chance unsupervised, and name recovery under supervision tracks
    subject as in #1593'
  retreats_if: a name-axis survives among the three with subject and operation held constant, or drama requires a dimension on which the names
    sort
  consequence:
    if_advances:
      moves:
      - 'extension: the operation axis across the Platonic, Aristotelian and Theophrastan corpora'
      effect: the extension is established on body S
    if_retreats:
      moves:
      - 'extension: the operation axis across the Platonic, Aristotelian and Theophrastan corpora'
      effect: the extension retreats; claim:th-1586-axis stands within its two corpora
    unchanged:
    - 'claim:sy-1658-maker (R2: no separation identifies a maker)'
  status: open
- id: Q2-xenophon-aristophanes
  question: Do Xenophon and Aristophanes earn function-positions by the stopping rule, or do they stay at the configuration's edge?
  advances_if: either name meets every condition of the rule, extending the configuration by its own criterion
  retreats_if: both fail at a stated condition, which bounds the configuration and leaves the four positions as they stand
  consequence:
    if_advances:
      moves:
      - 'extension: function-positions for Xenophon and Aristophanes'
      effect: the configuration is extended by its own stopping rule
    if_retreats:
      moves:
      - 'extension: function-positions for Xenophon and Aristophanes'
      effect: 'bounds: the extension fails and the configuration is bounded at four positions'
    unchanged:
    - pos:socrates
    - pos:plato
    - pos:theophrastus
    - pos:aristotle
    - claim:sy-1658-maker
  status: open
- id: Q3-seams
  question: Does the Theophrastan transformation recur at the other seams under the same name-boundary?
  advances_if: the transformation recurs position-specifically at the named seams and is absent from the within-name control
  retreats_if: it does not recur, or the within-name control (Β against Λ) shows the same transformation, which would dissolve the named function
    into a register any text can take
  consequence:
    if_advances:
      moves:
      - claim:th-1584-traversal
      - pos:theophrastus
      effect: 'the named function generalizes from #1584 to the seams'
    if_retreats:
      moves:
      - pos:theophrastus
      effect: the Theophrastan position retreats from a named function to a register any text can take
    unchanged:
    - 'claim:sy-1658-maker''s establishment (its grounds are #1588, #1583 and #1603)'
  status: open
- id: Q4-full-splice
  question: Does the remainder of Λ also find places in the fragment when Λ is spliced whole?
  advances_if: 'the remainder finds places with violations at or below the rate of #1597'
  retreats_if: the remainder finds none, or forces violations the partial splice avoided
  consequence:
    if_advances:
      moves:
      - claim:th-1583-hinge
      - claim:mx-1597-order
      effect: the splice generalizes from the joined movements to the whole of Λ
    if_retreats:
      moves:
      - claim:th-1583-hinge
      - claim:sy-1658-maker
      effect: the hinge retreats, and its failure travels to the production model along the generalizes edge (establishment)
    unchanged:
    - claim:th-1588-uncounted
    - claim:se-1603-provenance
  status: open
- id: Q5-arabic-hinge
  question: What does Isḥāq's Arabic give at the hinge lemmas?
  advances_if: the Arabic carries the hinge's demands as the Greek does
  retreats_if: the Arabic diverges at the joins in order or wording
  consequence:
    if_advances:
      moves:
      - claim:th-1583-hinge
      effect: a second tradition carries the hinge
    if_retreats:
      moves:
      - claim:th-1583-hinge
      effect: qualifies the hinge's scope to the Greek order; a divergence that rebuts the order travels to claim:sy-1658-maker
    unchanged:
    - claim:th-1588-uncounted
    - claim:se-1603-provenance
  status: acquisition pending
- id: Q6-attestation-ledger
  question: Is there an attestation of the four as distinct authors of the divided corpus independent of the corpus's own tradition?
  advances_if: the ledger closes with no independent attestation dividing the corpus by maker
  retreats_if: an independent attestation divides the corpus by maker; under R3 it locates a dependency, and its direction and independence are
    then stated in their own columns
  consequence:
    if_advances:
      moves:
      - fw:many-maker
      effect: the rival stays without an independent attestation on body M; absence establishes nothing of one maker
    if_retreats:
      moves:
      - fw:many-maker
      - claim:sy-1658-maker
      effect: the rival gains a located dependency on body M; once its direction and independence are filled (R3) it rebuts the production model's
        establishment
    unchanged:
    - the reception history (#1733), which stands whatever the authorship
  status: begun
- id: Q7-comparator
  question: Is there a documented succession of distinct persons producing a corpus unified to this degree?
  advances_if: none is named after a stated search
  retreats_if: one is named and measured; the received reading gains the comparator it owes
  consequence:
    if_advances:
      moves:
      - fw:many-maker
      effect: the rival's comparator stays owed
    if_retreats:
      moves:
      - fw:many-maker
      effect: the rival gains the comparator it owes and is argued on that point
    unchanged:
    - claim:sy-1658-maker's establishment, whose grounds a comparator does not touch
  status: owed
- id: Q8-dependency-columns
  question: Are the catalogue, the biography and the chronology independent witnesses, or derived from the same textual features?
  advances_if: dependencies are established with direction and exclusion, so the tradition's witnesses count as one
  retreats_if: Column B returns direction from the witness to the text, as the aconite case returned direction against the author (#1605 §37),
    or an independently transmitted source is shown, which defeats Column C; the witness then stands on its own
  consequence:
    if_advances:
      moves:
      - fw:many-maker
      effect: the tradition's witnesses count as one derived witness on body M
    if_retreats:
      moves:
      - fw:many-maker
      effect: the witness stands as independent on body M and warrants the rival there
    unchanged:
    - claim:sy-1658-maker's establishment
  status: two cases run
- id: Q9-subject-dependence
  question: Is the recovery of the names under supervision a function of subject?
  advances_if: name recovery falls to the null when subject and operation are held constant
  retreats_if: the names stay recoverable with subject and operation held constant; under R2 this identifies no maker, and it would locate a hand-level
    signal the operation axis does not explain
  consequence:
    if_advances:
      moves:
      - claim:th-1593-supervised
      effect: name recovery is a function of subject; the rival loses its stylometric signal
    if_retreats:
      moves:
      - claim:th-1586-axis
      effect: 'qualifies the axis''s scope: a hand-level signal the operation axis does not explain'
    unchanged:
    - 'claim:sy-1658-maker (R2: the signal identifies no maker)'
  status: suggestive
- id: Q10-ross-apparatus
  question: What does Ross's apparatus give at SE 183b34–184b8?
  advances_if: the apparatus confirms the reading seated from Bekker
  retreats_if: a variant at the clause unsettles the first-person εἴχομεν reading
  consequence:
    if_advances:
      moves:
      - claim:se-1603-provenance
      effect: the reading seated from Bekker is confirmed by the apparatus
    if_retreats:
      moves:
      - claim:se-1603-provenance
      - claim:sy-1658-maker
      effect: the provenance claim retreats, and its failure travels to the production model along the generalizes edge (establishment)
    unchanged:
    - claim:th-1588-uncounted
    - claim:th-1583-hinge
  status: declared
litmus:
  forbidden_operation: Composing the framework as a school, a collaboration or 'contemporary scholars' (negative edges; captures AXN:09ED, AXN:0C42,
    AXN:0931).
  dependency_chain: 'The production model (#1658) depends on the count left open because uncounted (#1588), the hinge (#1583) and the provenance
    claim of #1603; it does not depend on the reception history (#1733 independent_of #1658).'
  topology: 'Rebuildable from 00-kernel.yaml and 01-ontology.yaml (scope A): six strata, two clusters, six joins, four bodies, four positions;
    02-graph.jsonld adds each record''s body and every relation (scope B).'
acceptance:
  back_projection_yield_threshold: 0.85
  spec: EA-HK-01 (#76) §VI Step 4; Anti-Summary Test (#1610 §2); structural presence after EA-HK-INFRA-01 (#74) v0.1
  scopes:
    A:
      input:
      - 00-kernel.yaml
      - 01-ontology.yaml
      is: the kernel's own compression test (fragment sufficiency)
      must_survive:
      - framework, seed, author
      - four positions with the Theophrastan asymmetry
      - six strata in order with their records
      - two clusters and the joins
      - four bodies with their rules
      - five maker-count states with dates and records
      - forbidden operations
      - the dependency chain to the production model
      - the corrections as original–correction pairs
      - the rival evaluated, with its summary
      - 'the symmetric ledger: both frameworks on every body, with the combination and rival-admission rules'
      - the lines of research
    B:
      input:
      - 00-kernel.yaml
      - 01-ontology.yaml
      - 02-graph.jsonld
      is: topology at the record and claim grain
      must_survive:
      - scope A
      - every record placed in a body and a stratum
      - every relation with its licensed dimension
      - every endpoint declared
      - provenance on every record
  reader_test: v1.0 is run on scope A; its prompt is 09b-back-projection-prompt.md and it is scored against scope A's must_survive list
