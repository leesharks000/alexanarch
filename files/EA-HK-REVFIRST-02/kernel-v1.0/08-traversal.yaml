entry: 00-kernel.yaml, compression_survival_summary; then counts and by_book
modes:
  whole:
    must: the fan, the standings with what each licenses, the failures, the rival
    must_not: state an order of composition as shown by the relations
  by_book:
    must: every relation reaching the book, its strongest standing, what is planned
    must_not: report a book with no relation as reached
  by_place:
    must: every relation leaving a place of Revelation and the layer under it
    must_not: treat a layer as a source of the target apart from the place
  by_rule:
    must: the relations that instantiate a rule
    must_not: count a rule as tested by relations found by reading
  by_standing:
    must: the relations at a standing with what it licenses and withholds
    must_not: merge standings
  research:
    must: the question that bears on a relation, its instrument and both outcomes
    must_not: close a question without a record
  local:
    must: 'one relation: both places, operation, standing, pointer, path to the framework'
    must_not: restate the passage; open the pointer
