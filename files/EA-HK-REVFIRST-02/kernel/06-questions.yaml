id: EA-HK-REVFIRST-02/questions
rule: each line of research names its instrument, what to read first, and the result that would advance or retreat the map
questions:
- id: Q1-inverse
  question: Can the inverse rule (parable to saying; epistle to letter) be written, sealed and run with cuts?
  bears_on:
  - rel:q-thief
  - rel:mt-*
  instrument: a pack on the model of the labourers pack, direction reversed
  read_first:
  - the paper I.6, VII
  - 1735
  advances: the inverse fails to place the sayings in the letters, each fitted to its assembly
  retreats: the inverse yields the sayings where they stand
- id: Q2-control-source
  question: Does the same procedure, run from another source of like length, reach as much of Matthew?
  bears_on:
  - rel:mt-*
  instrument: T_Μ with the source swapped (1 Enoch; Daniel with Ezekiel 40-48)
  read_first:
  - the paper XIV.1
  advances: reach well below 178 verses
  retreats: like reach
- id: Q3-clustering
  question: Do Philo's places cluster by treatise more than chance?
  bears_on:
  - rel:layer-*
  instrument: a permutation control over Philo's sections
  read_first:
  - 1758
  - the paper XIV.5c
  advances: clustering beyond the control
  retreats: no clustering
- id: Q4-luke
  question: What transform takes Revelation to Luke, and does Matthew's carry over?
  bears_on:
  - rel:plan-luke
  instrument: T_Μ applied to Luke; the ledger rebuilt
  read_first:
  - the notebook 2AT
  advances: rules shared with a stated difference
  retreats: no rule carries
- id: Q5-john
  question: Do the seven plagues reverse into John's signs under a stated rule?
  bears_on:
  - rel:plan-john
  instrument: a sealed pack per sign
  read_first:
  - the notebook
  advances: signs produced from plagues and the rule
  retreats: no sign produced
- id: Q6-seven-in-seven
  question: Does the Pauline seven-church formation transform Revelation's seven, and do the named epistolary positions map to it?
  bears_on:
  - rel:plan-seven-in-seven
  - rel:letter-*
  instrument: the letters slate extended; the Muratorian order as testimony
  read_first:
  - 1735
  - 1415
  advances: a mapping with stated residue for each position
  retreats: positions that fit no letter
- id: Q7-mark
  question: What of the 458 verses Matthew shares with Mark does Revelation reach, and by what rule?
  bears_on:
  - rel:plan-mark
  instrument: the ledger restricted to shared verses; a synopsis in seat
  read_first:
  - the paper XIV.1a
  advances: a rule for the sea stories and the passion shared
  retreats: reach stays at 51
- id: Q8-reading
  question: What do Vos (1965) and Bauckham (1977, 1983) say in full of each saying the ledger keeps?
  bears_on:
  - rel:q-thief
  - rel:q-confession
  instrument: the works themselves
  read_first:
  - the paper I.6 and Works cited
  advances: their lists contain the rows kept under M1
  retreats: their lists show sayings the ledger cannot place
