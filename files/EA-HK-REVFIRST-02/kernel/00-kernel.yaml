grain: 'the relation: a place of Revelation, a place of another book, an operation, a standing, a pointer'
compression_survival_summary: 'Revelation First (Lee Sharks, #202) holds that the Apocalypse is the generative source of the rest of the New Testament.
  This kernel holds every relation the programme has drawn from Revelation to another book, each at its own standing, and the relations it has
  planned or seen fail. It holds 210 relations. For the epistles: the letters to the seven assemblies set against seven epistles, one of them
  run to an executable derivation (Smyrna to James, nine rules), four doctrinal transforms worked to derivation grade, the rest mapped with grades
  and residue. For Matthew: 158 relations reaching 305 of 1,067 verses under a stated transform (T_Μ v0.4; 86 relations and 178 verses at v1.0
  of this kernel), one passage produced blind from the rule and two verses, 43 pairings written down before they were counted and held, 7 that
  failed as written, 34 counted, 18 derived by an engine, 55 read. Under Revelation, at 13 places, a layer of Philo or scripture is recorded:
  the third parameter of the transform admits it only through a place Revelation holds. 17 of the 26 other books are reached above the founding
  grain; 5 have no relation (1 Timothy, Titus, Philemon, 2 John, 3 John). Luke, Mark, John, Acts and the Pauline seven are planned. Six mappings
  were tested and failed and are kept: the four creatures to the four Gospels, the source''s order in a Gospel''s order, one seat-map over a whole
  Gospel, Philo taken straight to Matthew, strands walked in their own order, and a count on direction. 17 of Matthew''s relations are entered
  for the relation, with few shared words or none, under a check fixed beforehand, and are marked. Matthew handles Revelation as it handles the
  scripture it does not name: it keeps no order of the source, as it keeps none of Isaiah or the Psalms, with one walk (Revelation 12:1-6 through
  Matthew 2); the counts behind this are first ones, on lists made from memory. A count meant to decide direction did not. A standing licenses
  what it names and nothing above it: a relation read is not a relation counted, and a relation counted is not a derivation. No relation here
  decides the order in which the books were written; the argument for order is the framework''s (#1735, #1755). The received account is carried
  as the rival on the same terms: the Synoptic tradition as the source of Revelation''s sayings (Vos 1965; Bauckham 1977), Mark, a sayings source
  and special material as the sources of Matthew. Its inverse procedures have not been built and that is its status here.'
invariants:
- 'REL-1 A relation is a pointer: to a record where one holds it, to a hashed data file or the notebook where none does, and it says which.'
- REL-2 A standing licenses what it names and nothing above it (01-ontology.yaml, standings).
- REL-3 Failures are relations. A mapping tested and failed stays in the kernel at that standing.
- 'REL-4 No relation decides the order of composition. Direction is the framework''s question (#1735, #1755 rung IV).'
- REL-5 A layer (Philo, scripture) enters only through a place Revelation holds.
- 'REL-6 FRAGMENT ≠ WHOLE: a relation, a book''s table or a standing keeps its path to the framework and states what it has not reconstructed.'
- REL-7 The sealed key is not in the kernel. Blind runs are cited by the hash commitment printed in the paper (#1812, VII.9).
