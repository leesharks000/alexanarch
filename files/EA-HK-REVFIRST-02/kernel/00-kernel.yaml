  - a layer depends on the place of Revelation it stands under
  - the book table depends on the relations
  constraints:
  - REL-2
  - REL-4
  - REL-5
  topology: a fan from one book to twenty-six, each ray a set of relations; under the centre, a second fan from Revelation back to its layers
transform:
  epistles:
    operation: 'letter to epistle: the speaker commissions writing to seven messengers; each letter is unfolded as an epistle'
    classes:
      M: elaborative unfolding — the seed's structure expanded, its terms retained, its ruling kept
      M̄: adversarial unfolding — the seed's terms retained, its ruling negotiated or inverted; the epistle argues with its seed
      X: canonical mechanism — the exchange or carriage of the letter recorded in the canon itself
    james_rules:
    - R1 EPISTOLARIZE
    - R2 THEOLOGIZE
    - R3 CITE-PROMISE
    - R4 SOCIALIZE
    - R5 POSSESS
    - R6 NARRATIVIZE
    - R7 ECONOMIZE
    - R8 IMPERATIVIZE
    - R9 ADJUDICATE
  matthew:
    name: T_Μ v0.4
    S: the source held whole; the unit is the relation with its bearer
    P:
    - P1 give the speaker a past
    - P2 tell the life in a named land; cite scripture as written
    - P3 at each place of the source the layers it was made from stand open (scripture; Philo), and a compressed member may be restored; Philo
      only through a place Revelation holds
    M:
    - M1 keep
    - M2 exchange the patient
    - M3 the costly act done by the adversary, or refused
    - M4 the rider's charge taken by the teacher
    - M5 oppose commerce, image, wealth
    - M6 the faithful's trial to the teacher, the seer's part to the followers
    - M7 the speaker's reproofs said of adversaries
    F:
    - F1 stage
    - F2 enact
    - F3 liken
    - F4 foretell
    - F5 happen
    C: C1-C5, five checks
    modes_of_inheritance:
    - kept
    - reworked and passed on
    - dropped by the source and restored in the target (ancestral reactivation)
