  - seven messengers
  - a writer holding Revelation whole
  - the reader given a rule and a place
  operations:
  - commission
  - unfold a letter as an epistle
  - keep
  - exchange
  - reassign
  - stage
  - enact
  - liken
  - foretell
  - restore from the layer
  dependencies:
