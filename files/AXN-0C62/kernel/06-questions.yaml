- id: Q4a-homologei
  question: Does ὁμολογεῖ in 1 John 4:2 bear the operative reading, word-conform?
  posed_in:
    record: rec:828
    axn: AXN:0345.GOVERNANCE.🧭▲📏🕛♦️🎹
    record_sha256: 509f4f6d82890171ca8fec4338a7a59281d4619b454ea72126f249cdf01125aa
    exact: The spirit that ὁμολογεῖ (word-conforms with) Jesus Christ *formed in the body* (ἐν σαρκὶ ἐληλυθότα) is from God.
    located_in: text
  body: P
  bears_on:
  - claim:hl-828-homologei
  - claim:hl-1217-homologei
  read_first:
  - 828
  - 1217
  how_to_ask: read ὁμολογέω across the Johannine corpus and the lexica, the creedal and the operative senses at each locus
  advances_if: the operative sense is attested at loci the creedal sense cannot carry
  retreats_if: the creedal sense carries every locus
  unchanged_if: both senses stay available
  status: open
  commons: open
- id: Q4b-elelythota
  question: Does ἐν σαρκὶ ἐληλυθότα bear 'formed in the body', or only 'having come in flesh'?
  posed_in:
    record: rec:828
    axn: AXN:0345.GOVERNANCE.🧭▲📏🕛♦️🎹
    record_sha256: 509f4f6d82890171ca8fec4338a7a59281d4619b454ea72126f249cdf01125aa
    exact: '*formed in the body* (ἐν σαρκὶ ἐληλυθότα)'
    located_in: text
  body: P
  bears_on:
  - claim:hl-828-elelythota
  read_first:
  - 828
  - 1217
  how_to_ask: read the perfect of ἔρχομαι with ἐν σαρκί across 1–2 John and its patristic citations; ask what resultant state the perfect asserts
  advances_if: the perfect is shown to assert an abiding state in the flesh that the record's 'formed in the body' renders
  retreats_if: the construction bears arrival only, with no resultant formation
  unchanged_if: the rendering stays the record's, at the outer ring; Q4a's result does not settle Q4b
  status: open
  commons: open
