id: EA-HK-HISTLOGOS-01/questions
rule: A question carries the record that poses it, its body, what it bears on, what to read first, how to ask it, and what result would advance
  or retreat the framework.
questions:
- id: Q1-biographical
  question: What item outside the manuscripts bears on how many persons made the Socratic–Peripatetic corpus?
  posed_in:
    record: rec:1658
    axn: AXN:06E0.GENERATIVE.🔙🧬🔖👈🟢🤲
    record_sha256: f33b48b8c4b1595f3308937eb9b07e2880c4a5b0f4398964f0e9919f52043b28
    exact: 'Still open: any epigraphic or papyrological item for Plato or Theophrastus that the archive does not yet hold.'
    located_in: text
  body: B
  bears_on:
  - claim:hl-stmt-biographical
  - claim:hl-1658-ledger
  - hk:orthonym/fw/many-maker
  read_first:
  - 1658
  - 1733
  - 1576
  - 123
  how_to_ask: list every epigraphic, papyrological and documentary item for Plato, Theophrastus and Aristotle, each with its channel; set each
    against both readings by RB
  advances_if: items of the biographical kind are found for the one-maker reading only where the Delphi stone stands, and none independent of
    the Lives for four makers
  retreats_if: 'an independent channel attests the composing persons (#1733''s falsifier: ''an independent channel for the wills found'')'
  unchanged_if: 'the ledger stays as #1658 left it: one item outside the manuscripts, the rest one tradition'
  status: open
  commons: open
- id: Q2-genealogy-at-strength
  question: What are the strongest documented statements of the current consensus genealogy of the Logos, and what do they rest on?
  posed_in:
    record: rec:625
    axn: AXN:01DE.GOVERNANCE.🕖📏🌗🔄🍃♌
    record_sha256: 684f066f18addefcdfa23967b1657aff385f2cf1ea57ca12f0275d94118341a9
    exact: This essay does not propose to solve the quest or to replace it. It proposes to *redirect* it.
    located_in: text
  body: R
  bears_on:
  - fw:current-consensus-genealogy
  read_first:
  - 625
  - 626
  - 1486
  - 1484
  how_to_ask: 'a bounded literature search: Heraclitus to the Johannine prologue in the standard commentaries and histories, each at its page,
    with what each takes as given'
  advances_if: each statement takes the concept genealogy and the Galilean biography as given and argues neither at the inscription channel
  retreats_if: a documented statement argues the genealogy against the material inscription channel and meets it
  unchanged_if: 'the search is not run: the rival stays stated from the author''s words'
  status: open
  commons: open
