    axn: AXN:060B.DATASET.➖△⏫➕🕐💛
    record_sha256: 9198d89062cdf842c50658fd0ab39dc999a23b9f0f78aeb401ed23a5f3c29373
    exact: The suppression signature of a technology, as distinct from ordinary textual loss, is S,M ≫ A,O.
    located_in: text
  body: T
  bears_on:
  - claim:hl-1496-signature
  - claim:hl-stmt-genealogy
  read_first:
