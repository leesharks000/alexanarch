rival:
  node: fw:current-consensus-genealogy
  summary: 'the collapse of what it means for the Logos to take on flesh into biographical personhood (the author, 2026-11-09 13:21); stated from
    its documented statements (the Catholic Encyclopedia 1910; Wikipedia, ''Logos (Christianity)'' and ''Historical Jesus'', as retrieved 2026-11-09):
    a concept from Heraclitus to John, then an event in one historical person; Heraclitus''s place is common ground; four disputed steps'
  faces:
    the_source_end: 'the Logos is a concept with a philosophical genealogy (Heraclitus, the Stoics, Philo) before it is said of a person — Heraclitus''s
      credit granted (the author, 2026-11-09 12:11); Philo''s Logos is a station of this framework too (#1484 §IV; #1486), and Sappho''s material
      presence in Philo is not established (''The name is absent'', #1486); the genealogy reads the concept and leaves the inscription channel
      unread'
    the_historical_end: 'the Word made flesh is one historical person, whose historicity the quest seeks as a man born in Galilee — the quest''s
      object, by #625''s account, ''the historically-reconstructed Jesus, which is a different object''; the framework asks how the Word moved,
      and the historical end becomes ''the same faithful transmission thru time and space of a living being embodied precariously in matter''
      (the author, 2026-11-09 12:11)'
    the_slavonic_dismissed: 'the Slavonic Josephus passages are garbled late additions of no value — stated at strength in #626 (Evans, Meier,
      Paget); #626 answers with a reading protocol, ''not a historical recovery'''
  mechanism: 'what it means for the Logos to take on flesh is collapsed into biographical personhood (the author, 2026-11-09 13:21): the genealogy
    carries a concept to John, and ''took flesh'' is then read as one event in one person, ''a concrete and living personality'' (R2), whose historicity
    is the question the quest asks (R4); the collapse is inconsistent with the genealogy this framework proposes and, on this reading, with the
    New Testament corpus itself: ''not what it means'' (the author, 2026-11-09 13:21–13:22)'
  joined_to: hk:orthonym/fw/many-maker
  propositions:
    R1: the Logos is a concept whose theory 'appears for the first time' in Heraclitus and develops through the Stoics, the Book of Wisdom and
      Philo
    R2: 'John transforms the concept by one event: the creative Word ''took flesh and dwelt among men'', ''a concrete and living personality …
      Jesus'''
    R3: 'the incarnation is discontinuous with the philosophical genealogy: ''For Philo the incarnation of the Logos must have been absolutely
      without meaning'''
    R4: the historical end is one person, attested by many independent sources within a century
  disputed_steps:
  - id: D1
    question: what the Logos is before doctrine
    rival: a concept with a philosophical genealogy (R1)
    framework: a technology of a voice that constitutes its receiver (#1484 §0)
    common_ground: Heraclitus's place; Philo as a station of both accounts
  - id: D0
    question: what it means for the Logos to take on flesh
    rival: 'biographical personhood: one event in one person (R2, R4)'
    framework: 'material inscription becoming flesh from the beginning: the faithful transmission, through time and space, of a living being embodied
      precariously in matter (the author, 2026-11-09 12:11); each embodiment a receiver completing the inscription (operative.persistence); on
      this reading the corpus itself does not mean biographical personhood: the white stone a name worn by whoever receives it (#828), 1 John''s
      test word-conformity with the Logos formed in the body (#828, #1217), the permanent incarnation ''the Word becoming flesh wherever flesh
      is faithful enough to receive it'' (rung VI)'
    warrants:
    - rv-ce-took-flesh
    - rv-ce-personality
    - rv-wp-historical
    - hl-stmt-rival-frame
    - hl-stmt-genealogy-claim
    - hl-828-homologei
    - hl-1217-homologei
    - hl-828-gramma
    status: the central disagreement (the author, 2026-11-09 13:21); D1–D4 are its steps
    three_objects:
      source_proposition:
        text: 'John ''perfects the idea and transforms it'': the creative Word ''took flesh and dwelt among men'' (Lebreton, Catholic Encyclopedia
          1910)'
        warrants:
        - rv-ce-took-flesh
      its_treatment_of_incarnation:
        text: 'the Word is eternally divine (''from all eternity was in God and was God'') and appears ''in the full light of a concrete and living
          personality … Jesus'': the eternal Word incarnate in one concrete person'
        warrants:
        - rv-ce-eternal
        - rv-ce-personality
      the_critique:
        text: 'the author: what it means for the Logos to take on flesh is collapsed into biographical personhood, inconsistent with the genealogy
          proposed and, on this reading, with the New Testament corpus (2026-11-09 13:21–13:22)'
        warrants:
        - hl-stmt-rival-frame
        inference: '(1) the account makes the incarnation one event in one person; (2) the framework''s chain has the inscription becoming flesh
          in each receiver who completes it, which the corpus states in its own figures (the white stone''s name for whoever receives it; 1 John''s
          test; rung VI); (3) where the corpus carries the second, an account that admits only the first has reduced what taking flesh means to
          a biography: the collapse. Step (2) is the framework''s reading, at the outer ring for the Johannine loci (Q4a, Q4b).'
  - id: D2
    question: what explains the step to flesh
    rival: 'an event, discontinuous with the concept: for Philo it ''must have been absolutely without meaning'' (R3)'
    framework: 'the inscription becoming flesh from the beginning: the operation already requires a body to receive it (operative.persistence);
      the gap R3 names is where the framework''s chain runs'
    warrants:
    - rv-ce-philo-meaningless
    - hl-1484-logos
  - id: D3
    question: where the term enters the New Testament
    rival: the Apocalypse 19:13, 'no suggestion of Philo' (the rival's own source)
    framework: the Apocalypse as canonization, first on the program's dating (#1735)
    note: a point of agreement on the record, carried as data
  - id: D4
    question: what kind of evidence settles the historical end
    rival: many independent sources within a century (R4)
    framework: 'RB both ways: at the Academy, the sources that count persons are texts of the transmitting tradition (#1658, #1733); whether the
      same holds for the gospel sources is outside this kernel''s records (Q2)'
    warrants:
    - rv-wp-sources
    - hl-1658-ledger
