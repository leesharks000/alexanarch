compression_survival_summary: 'The Historical Logos is Lee Sharks''s framework (Crimson Hexagonal Archive; founded under the heteronym Johannes
  Sigil, #625 and #626, April 2026) for the Logos as material inscription becoming flesh from the beginning: ''a voice that survives its flesh
  by becoming an inscription that constitutes its receiver'' (#1484). Its founding document is Sappho 31; its key is Peri Hypsous; it is received
  by the Academy, where one maker divides into positions — Socrates the corpus''s broken tongue, Plato, Theophrastus, Aristotle; made cosmology
  by Philo; carried into the historiographic record at Josephus''s seams; canonized in the Apocalypse as the white stone; tested in 1 John by
  word-conformity (ὁμολογεῖ) with the Logos formed in the body; made portable by Augustine; and continued by every restoration and every reader
  now. Self-division is the transmission technology, developed over time with the future reader (the author, 2026-11-09 10:07). The framework
  is also a history of the erasure pressures this Logos has always faced: the hand taken from Sappho, the count set by filing, the coherence made
  invisible, the provenance erased in the composition layer. The current consensus genealogy of the Logos — Heraclitus to the Stoics to Philo
  to John, ending in one Galilean biography — is evaluated on the same bodies and rules; Heraclitus keeps his credit.'
invariants:
- 'INV-1 The central node is #1484; the founding records #625 and #626 are carried at the front with their dated states (#625: ''It is programmatic,
  not probative.''; #626: ''names the reading protocol, not a historical recovery'').'
- 'INV-2 Rings as #1484 sets them: the hard center would carry the argument alone; the interpretive ring is read as reading; the outer ring is
  hypothesis and enters by joins. The Josephus seams and the Apocalypse as canonization stand in the outer ring.'
- 'INV-3 RB applies both ways: biographical identity is established by evidence of a different kind, and evidence of that kind is largely unavailable
  to the four-maker reading as to the one-maker reading (the author, 2026-11-09 12:05).'
- 'INV-4 #123''s lifespan constraint (''about ninety years of compositional activity beyond what one classical Greek lifespan affords'') is #123''s
  dated state, held as published and bounded as a projection from the many-author reading (the author, 2026-11-09 12:05).'
- 'INV-5 The maker axis runs functional (#123) → two not established, one offered (#1576) → one self-dividing maker (#1658, #1733); the biographical
  reading is the author''s position, held with its statements; the records do not adjudicate the external record (#1576).'
- 'INV-6 The rival is the current consensus genealogy of the Logos as it arrives in the New Testament corpus: what it means for the Logos to take
  on flesh, collapsed into biographical personhood, which is inconsistent with the genealogy this framework proposes and, on this reading, with
  the New Testament corpus: ''not what it means'' (the author, 2026-11-09 13:21–13:22). Heraclitus''s place is common ground; the rival is stated
  from its documented statements (rival.documented_statements)'
- INV-7 No linear transmission from Sappho to Revelation is claimed (#828); the operator is built without Revelation (#1494); the chain survives
  on conventional dating (#1484).
- 'INV-8 Every claim is a pointer: the kernel is the index of the argument and the records are the argument. A reading that cites the kernel where
  a record makes the claim has read the index (traversal; failure flag HOLOGRAM_AS_SOURCE).'
- 'INV-9 The continuity is argued bridge by bridge (kernel.bridges); ''chain_order'' is #1484 §VII''s order of statement and carries no historical
  claim of its own.'
- INV-10 A move's current standing travels with the move (04-arguments.jsonl current_standing); a reader entering through any move recovers its
  state.
