  five instruments read from their records (construction under fixed transforms; blind reconstruction; frozen operators and the append-only ledger;
  the suppression signature; measurement at corpus scale), each with controls, results at status and recorded losses; Counterfeit Orthodoxies
  joined, #978 the current state, #674 the prior, #65''s seating carried as data; the rival''s settlement step D5 and the flag SETTLEMENT_AS_CORPUS;
  at the review of the v1.1 draft (16:55): M-D1 restored to #1576''s four propositions, the several-maker accounts stated with their costs, D5
  in four objects with 367 CE dating one collection''s boundary (Athanasius and Irenaeus fetched), the flag raised on the inference, the method
  set out by bridge with controls run and specified, the semantic challenges. v1.0 (2026-11-09, deposit): v0.3 (2026-11-09): at the review of
  v0.2, bridge endpoints set by their evidence (fourteen bridges, branching from Sappho 31); Philo''s modular status carried into the erasure
  layer; three positive demonstrations in the one-maker argument; the rival''s source, its treatment of incarnation and the critique kept as three
  objects; rung VI''s amended dependency carried; identifier handling for the new fields; scope C''s mechanical consequence tests (hl_checks.py)
  and its reader prompt (09c).'
