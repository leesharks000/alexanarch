chain_order:
  meaning: 'the stations'' order is #1484 §VII''s order of statement; it asserts no simple linear transmission (INV-7). Each bridge states its
    own relation kind, its historical sequence and what breaks it.'
  where_history_differs: 'Catullus answers the line before Philo and Longinus (#1484: ''already''); the Orphic tablets stand beside the lyric
    with no direction claimed'
  topology: 'the evidence branches from Sappho 31: eight bridges leave the instrument directly (to the threshold, the Academy twice, Philo, Peri
    Hypsous, Catullus, the canon, Augustine, the reader now); Catullus → Josephus, Philo → Peri Hypsous (conjectural), Peri Hypsous → Augustine,
    the tablets → the canon and the canon → the Johannine test carry the rest. The exposition keeps #1484 §VII''s sequence; the argument has this
    shape.'
maker_argument:
  '@id': argument:one-maker
  thesis: one composing person better explains the Socratic–Peripatetic configuration — its divisions, its production mechanics and its editorial
    multiplication — than separate composing persons do
  standing: 'argued from the corpus, comparatively; held by the author as biographical identity (2026-11-08 20:00; 2026-11-09 12:05). A biographical
    hypothesis argued from the corpus and a directly attested biographical identification are different achievements: the first is argued here;
    the second is unattested for any count (RB).'
  steps:
  - step: 1
    move:
    - arg:a1658-nothing-requires-two
    role: no text requires a second maker
  - step: 2
    move:
    - arg:a1576-result
    - arg:a1576-symmetric-null
    role: two is not established by the passages read as though it were; the discipline's instrument leaves the received relation-type as unestablished
      as the hypothesis
  - step: 3
    move:
    - arg:a1576-voices-objects
    - arg:a1576-capacity-conceded
    role: one maker can be many voices (Plato) and many objects (Aristotle); the capacity is conceded in the tradition's own testimony
  - step: 4
    move:
    - arg:a1733-set-explains
    role: 'the comparison: the received reading explains each item by a person; the single-maker reading explains the set by one investigation,
      and the marks'
  - step: 5
    move:
    - arg:a1733-set-by-filing
    - arg:a1733-count-kept
    - arg:a1733-wills-dependent
    role: the count was set by filing before argument, and the wills offered as independent corroboration reach the reader in one text
  - step: 6
    move:
    - arg:a1658-ledger-finding
    role: the one item outside the manuscripts attests one legal person, Aristotle
  - step: 7
    move:
    - arg:a123-pattern
    role: configurations whose maker count can be inspected produce volume comparable to the combined corpus from one hand
    note: '#123''s lifespan premise is bounded (lifespan_state); this step stands on the comparative cases'
  - step: 8
    statement: claim:hl-stmt-biographical
    role: 'the author''s grounds: the reading conforms to ''the psychological and production mechanics of authorial configurations whose maker
      count we can inspect''; the many-author reading ''requires the circularity and pointing to hypothetical second witnesses to make sense'''
  rival:
    claims:
    - arg:a1733-received-rival
    - arg:a1658-two-persons-rival
    standing: the four persons rest on the Lives and the succession of the schools (#1733); RB withholds biographical standing from both counts
      alike
  qualified_by:
  - arg:a1733-not-decide
  - arg:a1576-not-adjudicated
  breaks_if:
  - arg:a1733-falsify-wills
  - an epigraphic or papyrological item attesting a second composing person (Q1)
  substitution_test: 'replacing ''one person'' with ''a collective'', ''a school'' or ''a mystical self-dividing entity'' changes the thesis;
    the author: ''one self-dividing maker does mean one biological person'' (2026-11-08 20:00)'
  demonstrations:
  - id: M-D1
    configuration: 'four propositions (#1576 §1): “Division is a part of the method (*APr* I.31).” “No part of the method existed beforehand (*SE*
      34).” “Division did exist beforehand, as a named art with rules and practitioners (*Phaedrus*, *Sophist*, *Philebus*).” “And the relevant
      dialogues are conventionally dated before the relevant treatises.” The first three are stated in the texts; the fourth is the frame they
      are read in, and it bundles four claims the paper keeps apart: the two lifetimes in that order, these texts in that order, Aristotle having
      these texts, his taking the practice from them'
    one_maker_explains: 'the four stand with the three stated words as written once precedence is reconsidered, last, as §9 reconsiders it: “later”
      an order of grasp within one knower, “two states of one knower”, and the priority claim of *SE* 34 true because one''s own earlier work
      is prior in time and outside the succession the sentence denies'
    several_maker_must_posit: 'one of the stated words moved, paid each time on Aristotle''s side: the five reconciliations of #1576 §8 (the priority
      claim''s object narrowed; μόριον read as retrospective; organisation placed outside the received class; the dialogues filed as products;
      precedence moved within Aristotle''s own working life); the fourth word never moved for Plato'
    divergence: 'which word moves, and at what cost: the received reading moves a stated word to keep precedence biographical; the one-maker reading
      moves precedence from a chronology to an order of grasp and leaves the stated words as written'
    moves:
    - arg:a1576-four-props
    - arg:a1576-fourth-bundles
    - arg:a1576-one-word-moves
    - arg:a1576-never-for-plato
    - arg:a1576-wait-order
    - arg:a1576-r5-reply
    - arg:a1576-two-states-knower
    - arg:a1576-order-not-chronology
    - arg:a1576-own-earlier
    - arg:a1576-stipulation-reply
    - arg:a1576-sequence-not-count
    - arg:a1576-compatible-not-established
    bound: the texts establish the sequence of operations and positions and leave the maker-count open (#1576 §9.4); the evidence is compatible
      with the hypothesis and does not establish it (§9.1)
    revised:
      date: '2026-11-09'
      was: the fourth (two makers) the frame they are read in
      why: '#1576''s fourth proposition is precedence; the review of the v1.1 draft found the substitution, which the mechanical checks passed
        (scope C, semantic_challenges S1)'
  - id: M-D2
    configuration: 'the corpus''s operation and its name-boundary: dividing is syllogizing (Prior Analytics), combining is dividing (De anima),
      and the one place the corpus shows its name-boundary is where its account of God changes operation (#1658)'
    one_maker_explains: the doctrinal joint and the authorial joint as one cut seen from two ends
    several_maker_must_posit: 'an account of the seam: a successor''s deliberate response, a school''s shared practice, or chance (several_maker_accounts)'
    divergence: 'one cut seen from two ends, or a response, a school''s practice, or chance: each several-maker account explains the location;
      the one-maker reading also explains why each side leaves the same thing open. Measurement does not yet discriminate response from one maker
      at this seam: the notebook finds direction unresolved at every seam (#1605)'
    moves:
    - arg:a1658-combine-divide
    - arg:a1658-one-operation
    - arg:a1658-boundary-at-god
    - arg:a1658-one-joint
    - arg:a1658-one-cut
    several_maker_accounts:
    - account: 'deliberate response: teacher and successor, the successor answering the teacher''s theology'
      stated_at:
      - arg:a1658-two-persons-rival
      - arg:a1658-rival-coherent
      must_explain_at_the_seam: the response falling where the theology changes operation, which this account expects; and that at the joint each
        side leaves the same thing open
      costs: the persons rest on attestation of a different kind from the texts it is offered against; the friction it reads as disagreement is
        what a divided mind produces (#1658)
      cost_moves:
      - arg:a1658-evidence-kind
      - arg:a1658-ledger-price
      - arg:a1658-friction-reply
    - account: a school's common practice or coordinated investigation
      stated_at:
      - arg:a1576-not-one-hand
      - arg:a1733-school-innocent
      must_explain_at_the_seam: the same co-coverage, element by element, under a shared programme
      costs: '#1576 grants the co-coverage to a school; the one-maker reading''s further claim is the single cut at the doctrine of God, which
        a shared programme leaves to two decisions falling together'
      cost_moves:
      - arg:a1658-boundary-at-god
      - arg:a1658-one-joint
    - account: chance
      stated_at: []
      must_explain_at_the_seam: the name-boundary falling, unconnected, at the one place the doctrine changes
      costs: the chance itself, at the one place the corpus shows its name-boundary
      cost_moves:
      - arg:a1658-boundary-at-god
    open:
    - arg:a1605-cl-unresolved
  - id: M-D3
    configuration: 'the catalogues: the ''lost'' Theophrastan works are, at the title, the extant Aristotelian works under the Theophrastan transform,
      with measured stylistic markers; for one book the premise ''two authors'' enters at Nicolaus against the catalogues'' silence (#1733)'
    one_maker_explains: one body of work under two names and one transform; the attribution entering late, by a note that carries a second attribution
    several_maker_must_posit: a school's ordinary filing, element by element, or two independent losses falling so that each name's survivors
      match the other's lost titles (several_maker_accounts)
    divergence: 'one corpus under a transform, or a school''s filing or two coincident losses: each several-maker account takes the pattern one
      element at a time; the one-maker reading takes it whole, at the title'
    moves:
    - arg:a1733-transform
    - arg:a1733-transform-measures
    - arg:a1733-losses-innocent
    - arg:a1733-catalogue-silence
    - arg:a1733-premise-enters
    - arg:a1733-note-travels
    several_maker_accounts:
    - account: a school's ordinary filing
      stated_at:
      - arg:a1733-school-innocent
      must_explain_at_the_seam: each element of the catalogue pattern, taken one at a time
      costs: at the catalogues' line the coincidence is in whole titles, their pairing, a book count and the transform's own names, which a stem
        rule does not see (#1733)
      cost_moves:
      - arg:a1733-stem-blind
    - account: two independent losses
      stated_at:
      - arg:a1733-losses-innocent
      must_explain_at_the_seam: each name's survivors matching the other's lost titles
      costs: two losses coinciding at the title, against the catalogues' silence on two authors
      cost_moves:
      - arg:a1733-catalogue-silence
  how_to_read: each demonstration sets the configuration beside what each account must posit to explain it; the comparison's force is the posits,
    read in the moves
