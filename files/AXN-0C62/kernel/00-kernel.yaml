chain_order:
  meaning: 'the stations'' order is #1484 §VII''s order of statement; it asserts no simple linear transmission (INV-7). Each bridge states its
    own relation kind, its historical sequence and what breaks it.'
  where_history_differs: 'Catullus answers the line before Philo and Longinus (#1484: ''already''); the Orphic tablets stand beside the lyric
    with no direction claimed'
  topology: 'the evidence branches from Sappho 31: eight bridges leave the instrument directly (to the threshold, the Academy twice, Philo, Peri
    Hypsous, Catullus, the canon, Augustine, the reader now); Catullus → Josephus, Philo → Peri Hypsous (conjectural), Peri Hypsous → Augustine,
    the tablets → the canon and the canon → the Johannine test carry the rest. The exposition keeps #1484 §VII''s sequence; the argument has this
    shape.'
maker_argument:
  '@id': argument:one-maker
  thesis: one composing person better explains the Socratic–Peripatetic configuration — its divisions, its production mechanics and its editorial
    multiplication — than separate composing persons do
  standing: 'argued from the corpus, comparatively; held by the author as biographical identity (2026-11-08 20:00; 2026-11-09 12:05). A biographical
    hypothesis argued from the corpus and a directly attested biographical identification are different achievements: the first is argued here;
    the second is unattested for any count (RB).'
  steps:
  - step: 1
    move:
    - arg:a1658-nothing-requires-two
    role: no text requires a second maker
  - step: 2
    move:
    - arg:a1576-result
    - arg:a1576-symmetric-null
    role: two is not established by the passages read as though it were; the discipline's instrument leaves the received relation-type as unestablished
      as the hypothesis
  - step: 3
    move:
    - arg:a1576-voices-objects
    - arg:a1576-capacity-conceded
    role: one maker can be many voices (Plato) and many objects (Aristotle); the capacity is conceded in the tradition's own testimony
  - step: 4
    move:
    - arg:a1733-set-explains
    role: 'the comparison: the received reading explains each item by a person; the single-maker reading explains the set by one investigation,
      and the marks'
  - step: 5
    move:
    - arg:a1733-set-by-filing
    - arg:a1733-count-kept
    - arg:a1733-wills-dependent
    role: the count was set by filing before argument, and the wills offered as independent corroboration reach the reader in one text
  - step: 6
    move:
    - arg:a1658-ledger-finding
    role: the one item outside the manuscripts attests one legal person, Aristotle
  - step: 7
    move:
    - arg:a123-pattern
    role: configurations whose maker count can be inspected produce volume comparable to the combined corpus from one hand
    note: '#123''s lifespan premise is bounded (lifespan_state); this step stands on the comparative cases'
  - step: 8
    statement: claim:hl-stmt-biographical
    role: 'the author''s grounds: the reading conforms to ''the psychological and production mechanics of authorial configurations whose maker
      count we can inspect''; the many-author reading ''requires the circularity and pointing to hypothetical second witnesses to make sense'''
  rival:
    claims:
    - arg:a1733-received-rival
    - arg:a1658-two-persons-rival
    standing: the four persons rest on the Lives and the succession of the schools (#1733); RB withholds biographical standing from both counts
      alike
  qualified_by:
  - arg:a1733-not-decide
  - arg:a1576-not-adjudicated
  breaks_if:
  - arg:a1733-falsify-wills
  - an epigraphic or papyrological item attesting a second composing person (Q1)
  substitution_test: 'replacing ''one person'' with ''a collective'', ''a school'' or ''a mystical self-dividing entity'' changes the thesis;
    the author: ''one self-dividing maker does mean one biological person'' (2026-11-08 20:00)'
  demonstrations:
  - id: M-D1
    configuration: 'four propositions about the Platonic and Aristotelian corpora: three stated in the texts, the fourth (two makers) the frame
      they are read in (#1576)'
    one_maker_explains: the three stated propositions stand as written; the frame moves
    several_maker_must_posit: a reinterpretation of a stated text, paid each time on Aristotle's side; the fourth word never moved for Plato
    divergence: 'which word moves: the received reading moves the texts to keep the frame'
    moves:
    - arg:a1576-four-props
    - arg:a1576-one-word-moves
    - arg:a1576-never-for-plato
    - arg:a1576-ledger
    - arg:a1576-two-real-moves
  - id: M-D2
    configuration: 'the corpus''s operation and its name-boundary: dividing is syllogizing (Prior Analytics), combining is dividing (De anima),
      and the one place the corpus shows its name-boundary is where its account of God changes operation (#1658)'
    one_maker_explains: the doctrinal joint and the authorial joint as one cut seen from two ends
    several_maker_must_posit: 'a coincidence: the division between makers falls by chance at the place the doctrine divides'
    divergence: one cut or a coincidence of two
    moves:
    - arg:a1658-combine-divide
    - arg:a1658-one-operation
    - arg:a1658-boundary-at-god
    - arg:a1658-one-joint
    - arg:a1658-one-cut
  - id: M-D3
    configuration: 'the catalogues: the ''lost'' Theophrastan works are, at the title, the extant Aristotelian works under the Theophrastan transform,
      with measured stylistic markers; for one book the premise ''two authors'' enters at Nicolaus against the catalogues'' silence (#1733)'
    one_maker_explains: one body of work under two names and one transform; the attribution entering late, by a note that carries a second attribution
    several_maker_must_posit: two independent losses, one on each side, falling so that each name's survivors match the other's lost titles
    divergence: one corpus under a transform, or two coincident losses
    moves:
    - arg:a1733-transform
    - arg:a1733-transform-measures
    - arg:a1733-losses-innocent
    - arg:a1733-catalogue-silence
    - arg:a1733-premise-enters
    - arg:a1733-note-travels
  how_to_read: each demonstration sets the configuration beside what each account must posit to explain it; the comparison's force is the posits,
    read in the moves
