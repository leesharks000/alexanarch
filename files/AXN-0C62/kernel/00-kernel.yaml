rival:
  node: fw:current-consensus-genealogy
  summary: 'the collapse of what it means for the Logos to take on flesh into biographical personhood (the author, 2026-11-09 13:21); stated from
    its documented statements (the Catholic Encyclopedia 1910; Wikipedia, ''Logos (Christianity)'' and ''Historical Jesus'', as retrieved 2026-11-09):
    a concept from Heraclitus to John, then an event in one historical person; Heraclitus''s place is common ground; five disputed steps, the
    fifth the settlement under which the corpus is read (D5)'
  faces:
    the_source_end: 'the Logos is a concept with a philosophical genealogy (Heraclitus, the Stoics, Philo) before it is said of a person — Heraclitus''s
      credit granted (the author, 2026-11-09 12:11); Philo''s Logos is a station of this framework too (#1484 §IV; #1486), and Sappho''s material
      presence in Philo is not established (''The name is absent'', #1486); the genealogy reads the concept and leaves the inscription channel
      unread'
    the_historical_end: 'the Word made flesh is one historical person, whose historicity the quest seeks as a man born in Galilee — the quest''s
      object, by #625''s account, ''the historically-reconstructed Jesus, which is a different object''; the framework asks how the Word moved,
      and the historical end becomes ''the same faithful transmission thru time and space of a living being embodied precariously in matter''
      (the author, 2026-11-09 12:11)'
    the_slavonic_dismissed: 'the Slavonic Josephus passages are garbled late additions of no value — stated at strength in #626 (Evans, Meier,
      Paget); #626 answers with a reading protocol, ''not a historical recovery'''
  mechanism: 'what it means for the Logos to take on flesh is collapsed into biographical personhood (the author, 2026-11-09 13:21): the genealogy
    carries a concept to John, and ''took flesh'' is then read as one event in one person, ''a concrete and living personality'' (R2), whose historicity
    is the question the quest asks (R4); the collapse is inconsistent with the genealogy this framework proposes and, on this reading, with the
    New Testament corpus itself: ''not what it means'' (the author, 2026-11-09 13:21–13:22)'
  joined_to: hk:orthonym/fw/many-maker
  propositions:
    R1: the Logos is a concept whose theory 'appears for the first time' in Heraclitus and develops through the Stoics, the Book of Wisdom and
      Philo
    R2: 'John transforms the concept by one event: the creative Word ''took flesh and dwelt among men'', ''a concrete and living personality …
      Jesus'''
    R3: 'the incarnation is discontinuous with the philosophical genealogy: ''For Philo the incarnation of the Logos must have been absolutely
      without meaning'''
    R4: the historical end is one person, attested by many independent sources within a century
    R5: 'the corpus''s Logos is filed under a tradition named for its reception: ''the term by which Christian theology … designates the Word
      of God''; John''s the ''Christian Logos'''
  disputed_steps:
  - id: D1
    question: what the Logos is before doctrine
    rival: a concept with a philosophical genealogy (R1)
    framework: a technology of a voice that constitutes its receiver (#1484 §0)
    common_ground: Heraclitus's place; Philo as a station of both accounts
  - id: D0
    question: what it means for the Logos to take on flesh
    rival: 'biographical personhood: one event in one person (R2, R4)'
    framework: 'material inscription becoming flesh from the beginning: the faithful transmission, through time and space, of a living being embodied
      precariously in matter (the author, 2026-11-09 12:11); each embodiment a receiver completing the inscription (operative.persistence); on
      this reading the corpus itself does not mean biographical personhood: the white stone a name worn by whoever receives it (#828), 1 John''s
      test word-conformity with the Logos formed in the body (#828, #1217), the permanent incarnation ''the Word becoming flesh wherever flesh
      is faithful enough to receive it'' (rung VI)'
    warrants:
    - rv-ce-took-flesh
    - rv-ce-personality
    - rv-wp-historical
    - hl-stmt-rival-frame
    - hl-stmt-genealogy-claim
    - hl-828-homologei
    - hl-1217-homologei
    - hl-828-gramma
    status: the central disagreement (the author, 2026-11-09 13:21); D1–D4 are its steps
    three_objects:
      source_proposition:
        text: 'John ''perfects the idea and transforms it'': the creative Word ''took flesh and dwelt among men'' (Lebreton, Catholic Encyclopedia
          1910)'
        warrants:
        - rv-ce-took-flesh
      its_treatment_of_incarnation:
        text: 'the Word is eternally divine (''from all eternity was in God and was God'') and appears ''in the full light of a concrete and living
          personality … Jesus'': the eternal Word incarnate in one concrete person'
        warrants:
        - rv-ce-eternal
        - rv-ce-personality
      the_critique:
        text: 'the author: what it means for the Logos to take on flesh is collapsed into biographical personhood, inconsistent with the genealogy
          proposed and, on this reading, with the New Testament corpus (2026-11-09 13:21–13:22)'
        warrants:
        - hl-stmt-rival-frame
        inference: '(1) the account makes the incarnation one event in one person; (2) the framework''s chain has the inscription becoming flesh
          in each receiver who completes it, which the corpus states in its own figures (the white stone''s name for whoever receives it; 1 John''s
          test; rung VI); (3) where the corpus carries the second, an account that admits only the first has reduced what taking flesh means to
          a biography: the collapse. Step (2) is the framework''s reading, at the outer ring for the Johannine loci (Q4a, Q4b).'
  - id: D2
    question: what explains the step to flesh
    rival: 'an event, discontinuous with the concept: for Philo it ''must have been absolutely without meaning'' (R3)'
    framework: 'the inscription becoming flesh from the beginning: the operation already requires a body to receive it (operative.persistence);
      the gap R3 names is where the framework''s chain runs'
    warrants:
    - rv-ce-philo-meaningless
    - hl-1484-logos
  - id: D3
    question: where the term enters the New Testament
    rival: the Apocalypse 19:13, 'no suggestion of Philo' (the rival's own source)
    framework: the Apocalypse as canonization, first on the program's dating (#1735)
    note: a point of agreement on the record, carried as data
  - id: D4
    question: what kind of evidence settles the historical end
    rival: many independent sources within a century (R4)
    framework: 'RB both ways: at the Academy, the sources that count persons are texts of the transmitting tradition (#1658, #1733); whether the
      same holds for the gospel sources is outside this kernel''s records (Q2)'
    warrants:
    - rv-wp-sources
    - hl-1658-ledger
  - id: D5
    question: what the corpus is before the settlement
    rival: 'the corpus read through its received configuration: its Logos ''Christian'' (R5), one collection and its settled reading taken as
      the texts'' own'
    framework: 'literature as literature, which is also always already theology (the author, 2026-11-09 15:55): the texts'' operations read before
      the configuration, and the settlement read as made, in its objects and at their dates'
    warrants:
    - rv-ce-christian-theology
    - rv-wp-christian-logos
    - pr-ath-boundary
    - pr-ir-flesh
    - hl-674-canon-date
    - hl-978-article
    - hl-978-corrected
    bearing_on_D0: 'the kernel''s reading, at the interpretive ring: Irenaeus fixes ''the Word was made flesh'' against rival readings of the
      same Gospel, and the account the rival inherits (R2) receives that outcome as the text''s own meaning; read before the configuration, John
      1:14 can also bear the Word''s flesh as text, the codex the body (#978), which #978 holds as one of two defensible readings'
    reception_history: the full reception history of how the corpus came to be read as 'Christian' is outside this kernel; the four objects say
      where each part of the settlement is argued or dated, and the rest is a line of research
    objects:
      texts_and_operations:
        text: 'the texts and what they can do: at John 1:1 and 1:14 the Word''s flesh can be read as text, the codex the body (#978), held by
          #978 as one of two defensible readings'
        warrants:
        - hl-978-logos-graphe
        - hl-978-codex
        - hl-978-both
      competing_appropriations:
        text: 'the same writings read against one another in the second century: Irenaeus (Against Heresies III.11) sets John''s ''the Word was
          made flesh'' against Marcion''s and the Valentinians'' readings of the same Gospel, and argues that the Gospels can be neither more
          nor fewer than four; the interpretive settlement being made and defended'
        warrants:
        - pr-ir-flesh
        - pr-ir-marcion
        - pr-ir-four
      collection_boundary:
        text: 'the boundary of one collection, dated: Athanasius''s Festal Letter 39 (367 CE) enumerates the books ''included in the Canon, and
          handed down, and accredited as Divine'', presents the list as inherited, and polices the line (''Let no man add to these''); #674 reads
          the twenty-seven-book New Testament as this act; rival collections stand beside it (#978)'
        warrants:
        - pr-ath-boundary
        - pr-ath-police
        - hl-674-canon-date
        - hl-978-history-date
      configuration_as_intrinsic:
        text: 'the later treatment of one received configuration (this collection, its label, its settled reading of incarnation) as intrinsic
          to the texts: the definite article surviving the facts (#978); the rival''s documented statements filing John''s Logos as ''the Christian
          Logos'' (R5)'
        warrants:
        - hl-978-article
        - hl-978-settlement-falls
        - rv-ce-christian-theology
        - rv-wp-christian-logos
    dating: '367 CE dates the boundary of one collection; the emergence of Christian identification and the biographical reading of incarnation
      are dated by neither #674 nor the letter, and Irenaeus shows that reading argued against rivals two centuries before it'
  documented_statements:
  - site:ce-logos
  - site:wp-logos-christianity
  - site:wp-historical-jesus
  - site:wp-logos
  the_contested_question: what it means for the Logos to take on flesh
  source_set_status: a 1910 theological account (Lebreton, Catholic Encyclopedia) and contemporary encyclopedic representations (Wikipedia, as
    retrieved 2026-11-09). Together they represent the position the author names the current consensus genealogy; they do not by themselves demonstrate
    a current scholarly consensus, which is a line of research (Q2)
symmetric_ledger:
  question: What does this body give each framework, and what does its rule withhold from both?
  reading_instruction: A reader evaluating either framework on an evidence body states the other's status on that body in the same row, with the
    same question asked of both.
  combination: The framework is judged on the configuration it explains across the five bodies and the eleven stations, ring by ring (#1484);
    the rival is judged on the same bodies and the same stations.
  evaluation_method: An evaluation tests a reading at the seated text, a count at its limit, a carrier at its stations with its negatives, a reception
    at its page, and a biographical claim by an item outside the manuscripts, both ways.
  object_of_the_kernel: The kernel succeeds when the framework can be rebuilt from it with each claim at its ring, station and date, and when
    a reader leaves it for the records it points to.
  rows:
    P:
      rule: 'RP: a count establishes a property of the transmitted object; against an alternative its force is conjunctive and stated with its
        limit (#1484 §VIII)'
      historical_logos:
        text: the sole witness writes Sappho 31 as continuous prose; the chain survives on conventional dating (#1484); Revelation 1–3 the earliest
          closed address to seven named churches (#1735).
        warrants:
        - hl-1484-conventional
        - hl-1735-corpus
      current_consensus_genealogy:
        text: the transmitted texts are common ground; the rival's own source dates the term's first New Testament appearance to Apocalypse 19:13,
          with no suggestion of Philo.
        warrants:
        - rv-ce-apocalypse
        - rv-626-chronology
    I:
      rule: 'RI: a reading establishes what a passage can bear; it becomes a claim about a maker only through another body (#1484 §0; #1576: functional
        identity ''is established by pattern'')'
      historical_logos:
        text: a voice that survives its flesh by becoming an inscription that constitutes its receiver (#1484); the corpus divides a person into
          face and name (#1576); the socket and the heteronym one cut (#1658).
        warrants:
        - hl-1484-logos
        - hl-1576-person-divided
        - hl-1658-one-cut
      current_consensus_genealogy:
        text: 'the genealogy has purchase on the concept: Heraclitus first (common ground), developed through the Stoics and Philo; John''s transformation
          is an event in one person.'
        warrants:
        - rv-ce-heraclitus
        - rv-ce-took-flesh
    T:
      rule: 'RT: realization at stations establishes structure; it asserts no authorship, influence in the biographical sense, or identification
        sentence (#1495; #1494)'
      historical_logos:
        text: the circuit of Peri Hypsous (#1458); the blind-verified mapping to Philo (#1486); the suppression signature S,M ≫ A,O (#1496).
        warrants:
        - hl-1458-circuit
        - hl-1486-established
        - hl-1496-signature
      current_consensus_genealogy:
        text: the rival's transmission is of a concept, through Wisdom and Philo, with John adapting Philo (Harris, as the page states); the step
          to flesh is outside its chain by its own account (R3).
        warrants:
        - rv-wp-harris
        - rv-ce-philo-meaningless
    R:
      rule: 'RR: a reception establishes how a text and its maker were received; a filing is evidence of the filing (#1733: ''The frame was set
        by filing, before argument.''); neither framework takes standing from being received'
      historical_logos:
        text: the count set by filing before argument (#1733); the jealous Sappho a condition without a hand (#1752); the provenance erasure measured
          (#1217).
        warrants:
        - hl-1733-set-by-filing
        - hl-1752-condition
        - hl-1217-per
      current_consensus_genealogy:
        text: 'the consensus as the encyclopedias state it: Heraclitus to John for the concept; virtually all scholars for the historical figure.'
        warrants:
        - rv-wp-historical
        - rv-625-mirror
    B:
      rule: 'RB: biographical identity is established by evidence of a different kind (#1576), and the rule applies both ways (the author, 2026-11-09
        12:05): evidence of that kind is largely unavailable to the four-maker reading as to the one-maker reading; where it exists here it attests
        one legal person, Aristotle (the Delphi stone, #1658), and the four wills reach the reader in one text (#1733)'
      historical_logos:
        text: one item outside the manuscripts, attesting a legal person named Aristotle (#1658); the wills dependent on one text (#1733); nothing
          in the texts requires two makers (#1658).
        warrants:
        - hl-1658-ledger
        - hl-1733-wills
        - hl-1658-nothing-requires-two
      current_consensus_genealogy:
        text: the historical end rests on many sources within a century (R4); at the Academy the four persons rest on the Lives (#1733).
        warrants:
        - rv-wp-sources
        - rv-1733-received
