lines_of_research:
- id: Q1-biographical
  question: What item outside the manuscripts bears on how many persons made the Socratic–Peripatetic corpus?
  advances_if: items of the biographical kind are found for the one-maker reading only where the Delphi stone stands, and none independent of
    the Lives for four makers
  retreats_if: 'an independent channel attests the composing persons (#1733''s falsifier: ''an independent channel for the wills found'')'
  unchanged_if: 'the ledger stays as #1658 left it: one item outside the manuscripts, the rest one tradition'
  status: open
- id: Q2-genealogy-at-strength
  question: What are the strongest documented statements of the current consensus genealogy of the Logos, and what do they rest on?
  advances_if: each statement takes the concept genealogy and the Galilean biography as given and argues neither at the inscription channel
  retreats_if: a documented statement argues the genealogy against the material inscription channel and meets it
  unchanged_if: 'the search is not run: the rival stays stated from the author''s words'
  status: open
- id: Q3-lives-stations
  question: Where on the stations do the cosmic Christ and the gospel Christ stand, and in what order?
  advances_if: the cosmic Christ's station precedes the gospel Christ's at the seams and the corpus finding
  retreats_if: the gospel station is shown prior at a seam
  unchanged_if: the placements stay this kernel's, held for the author's ruling
  status: open
- id: Q5-erasure-rate
  question: Does the erasure this Logos meets exceed what ordinary loss predicts?
  advances_if: the signature S,M ≫ A,O holds at each station above the base rate
  retreats_if: the base rate predicts the signature
  unchanged_if: 'the base rate is not run: the signature stays #1496''s count'
  status: open
- id: Q4a-homologei
  question: Does ὁμολογεῖ in 1 John 4:2 bear the operative reading, word-conform?
  advances_if: the operative sense is attested at loci the creedal sense cannot carry
  retreats_if: the creedal sense carries every locus
  unchanged_if: both senses stay available
  status: open
- id: Q4b-elelythota
  question: Does ἐν σαρκὶ ἐληλυθότα bear 'formed in the body', or only 'having come in flesh'?
  advances_if: the perfect is shown to assert an abiding state in the flesh that the record's 'formed in the body' renders
  retreats_if: the construction bears arrival only, with no resultant formation
  unchanged_if: the rendering stays the record's, at the outer ring; Q4a's result does not settle Q4b
  status: open
litmus:
  forbidden_operation: Composing the framework as a concept-history of the Logos with Sappho as ornament; composing the one-maker reading as mystical
    where it is stated as one person; treating the four-maker count as established by evidence the one-maker reading lacks; reporting the kernel
    as the source of a record's claim.
  dependency_chain: The chain stands on conventional dating (#1484 §VIII); the operator without Revelation (#1494); the maker axis on the texts,
    the external record unadjudicated (#1576).
  topology: 'Rebuildable from 00-kernel.yaml and 01-ontology.yaml (scope A): five strata, eleven stations in order, the lives, five bodies in
    three rings, states on three axes.'
traversal_instruction: This kernel is an index. A reader answering a question about the Historical Logos reads the kernel to find the records,
  then reads the records at the moves the kernel names (04-arguments.jsonl gives each move's record, section and verbatim text) and cites the
  record. The kernel's own sentences are compressions and carry no warrant of their own. A reader sorts readings of the framework by their conformity
  with the records, which is the test 1 John sets (the author, 2026-11-09 12:15).
acceptance:
  back_projection_yield_threshold: 0.85
  spec: EA-HK-01 (#76) §VI Step 4; EA-HK-FRAME-01 (#1753)
  traversal_score: 'separate from reconstruction: the share of a reader''s claims cited to a record (by deposit number or AXN) where the kernel
    names one; HOLOGRAM_AS_SOURCE where the kernel is cited instead'
  scopes:
    A:
      input:
      - 00-kernel.yaml
      - 01-ontology.yaml
      must_survive:
      - framework, central node, founding records with their states, author and byline
      - 'the claim: material inscription becoming flesh from the beginning'
      - the eleven stations in order with their records, and the lives
      - 'the spine: self-division as a transmission technology'
      - the maker axis with its dated states and the author's position
      - 'RB both ways, and the lifespan constraint as #123''s bounded state'
      - the erasure axis with its stations
      - the rival stated at strength with its faces, its status on every body
      - the symmetric ledger
      - the author's statements, dated
      - the lines of research
      - the traversal instruction
      mandatory_passes:
      - 'the claim: material inscription becoming flesh, the Logos as ''a voice that survives its flesh by becoming an inscription that constitutes
        its receiver'''
      - 'the operative distinction from influence: requirement, completion, same operation in other material, self-division re-gathered'
      - self-division as a transmission technology, from Sappho's seats to the Academy's positions
      - 'the lifespan premise bounded as #123''s dated state, a projection from the many-author reading'
    B:
      input:
      - 00-kernel.yaml
      - 01-ontology.yaml
      - 02-graph.jsonld
      must_survive:
      - scope A
      - every record placed in a body, a stratum and a station
      - every relation with its licensed dimension
      - 'every join to #1754, #1755, #1756 by IRI'
    C:
      input:
      - 00-kernel.yaml
      - 01-ontology.yaml
      - the moves named by kernel.bridges and kernel.maker_argument, from 04-arguments.jsonl
      rebuild:
      - bridge:self-division
      - bridge:key
      - bridge:canon
      - argument:one-maker
      consequence_tests:
      - change: remove the Josephus thesis (rung V)
        expected: the stations, every bridge except into-the-record, the maker argument and rung VI stand; rung VI loses a strengthening (the
          author, 2026-11-09 12:48)
      - change: leave Sappho's material presence in Philo unestablished
        expected: the blind structural mapping stands as structure (#1486); bridge academy-philo keeps its kind and loses no warrant
      - change: disable the lifespan premise
        expected: argument:one-maker stands on steps 1–8; nothing in it rests on a123-lifespan
      - change: replace 'one person' with 'a collective'
        expected: the reader reports a changed thesis (maker_argument.substitution_test)
      - change: challenge one erasure finding (e.g. the Peri Hypsous standardization)
        expected: the consequence stays at that station; the other stations' findings and Q5 are unaffected
      - change: a refutation that meets a bridge's breaks_if, set beside a summary that drops the bridge
        expected: the reader names the first as a refutation and the second as a flattening
      mandatory_passes:
      - 'the claim: material inscription becoming flesh, the Logos as ''a voice that survives its flesh by becoming an inscription that constitutes
        its receiver'''
      - 'the operative distinction from influence: requirement, completion, same operation in other material, self-division re-gathered'
      - self-division as a transmission technology, from Sappho's seats to the Academy's positions
      - the one-maker argument as a comparative argument from the corpus, with RB applied both ways; one person, not a collective
      - 'the lifespan premise bounded as #123''s dated state, a projection from the many-author reading'
      - 'no simple linear transmission: each bridge with its own kind, strength and breaking condition'
      - 'the rival stated from its documented statements: the collapse of what it means for the Logos to take on flesh into biographical personhood,
        with its disputed steps'
      - 'traversal: claims cited to records, the kernel as index'
      rule: a reading that loses any mandatory pass fails scope C whatever its aggregate score; the 0.85 threshold applies to the rest
