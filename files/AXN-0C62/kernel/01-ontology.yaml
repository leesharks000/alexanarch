id: EA-HK-HISTLOGOS-01/ontology
classes:
  Framework: a named argument with a central record and an author
  Record: an archive deposit, by AXN and hash
  Station: a place on the chain where the technology is realized (#1484 §VII)
  AuthorStatement: a statement of the author's, dated and verbatim; it establishes what the author holds; what a record shows, the record establishes
  Claim: a pointer to a quotation in a record, with typed state (#1529)
  EvidenceBody: one of five kinds of evidence, each with its rule
  Ring: a tier of evidentiary hardness (#1484)
  Capture: a reception event in the Capture Registry
  Stratum: a period of the framework's development
  Cluster: a grouping of records
  Move: a unit of a record's argument, verbatim (04-arguments.jsonl)
  Bridge: 'an argued join between two stations: operations at each end, supporting passages, relation kind, strength and what breaks it'
  SurfaceRecord: a public page outside the archive, fetched and hashed, read for what it states
