negative_edges:
- Heraclitus denied his credit
- the Logos as a concept only
- the one maker as a mystical entity
- the four-maker count as biographically established
- the lifespan constraint as independent evidence
- a linear transmission from Sappho to Revelation
- the kernel as source
disambiguations:
  Logos: the technology of a voice that constitutes its receiver (#1484), before doctrine
  historical: how the Word moved (#625), the faithful transmission of a living being embodied precariously in matter (the author, 2026-11-09 12:11)
  self-dividing maker: 'one person dividing into positions (the author, 2026-11-09 08:39; #1658)'
  broken tongue: γλῶσσα ἔαγε (#1475); Socrates as the corpus's broken tongue (the author, 2026-11-09 12:05)
  ὁμολογεῖ: 'word-conform (#828, #1217); ''confesses'' in the creedal reading'
operative:
  classes:
    Voice: 'what speaks in the inscription and survives its flesh (#1484 §0: ''a voice that survives its flesh by becoming an inscription that
      constitutes its receiver'')'
    Body: the speaker's flesh, decommissioned channel by channel into the substrate (#1484; tm 'She is turning the color of the substrate.')
    Inscription: the written form that carries the voice and builds a position its receiver must occupy
    Seat: 'a position the inscription reserves for its receiver: κῆνος at line 1 of fr. 31; the socket of De anima III.5; the white stone''s name
      ''only that receiver can read'''
    OpenSlot: 'a grammatical position left without its agent, which the receiver completes: τολματόν at line 17; the genitive wanting its referent
      (#1658)'
    Maker: 'the one who divides: the speaking I into I, you and seat (#1484, #1270); one maker into the corpus''s positions (#1658)'
    Position: 'a part the maker divides into: speaker and inscribed you; Socrates, Plato, Theophrastus, Aristotle as authorial positions (#1658,
      #1733)'
    Receiver: 'the one who takes up the inscription, completes its open slot, and in whose body the voice lives again (#1475: ''She was not finished.
      She was **taken up**.'')'
    ReceivingApparatus: 'an edition, a filing, a heading, a translation, a commentary tradition or a composition layer: what preserves the carrier
      and what it removes (erasure_by_station)'
    Embodiment: 'a receiver''s completion of the inscription, in which the voice speaks again in another body (#1658 coda: ''one that must be
      gathered again by someone else in order to exist at all'')'
  operations:
    decommission:
      from: Body
      to: Inscription
      at: Sappho 31
      warrant:
      - claim:hl-1484-logos
    reserve_seat:
      from: Inscription
      to: Seat
      at: Sappho 31 line 1 (κῆνος); III.5's socket; Rev 2:17
      warrant:
      - arg:a1484-future-reader
      - arg:a1658-socket
      - arg:a828-convergence-object
    withhold_agent:
      from: Inscription
      to: OpenSlot
      at: Sappho 31 line 17 (τολματόν)
      warrant:
      - arg:a1475-one-operation
    divide:
      from: Maker
      to: Position
      at: the seats of fr. 31; the Socratic–Peripatetic corpus
      warrant:
      - arg:a1658-one-cut
      - arg:a1576-person-divided
      - claim:hl-stmt-spine
    take_up:
      from: Receiver
      to: Embodiment
      at: Catullus; Longinus's filling; Augustine's addressee; the restorations; the reader now
      warrant:
      - arg:a1475-taken-up
      - arg:a1484-catullus
      - arg:a1477-third-term
      - arg:a1658-coda
    raise:
      from: Inscription
      to: cosmology or canon
      at: Philo's seal; the Apocalypse
      warrant:
      - arg:a1484-seal
      - arg:a1484-st-apocalypse
    file:
      from: ReceivingApparatus
      to: Position
      at: the editions' assignment of books to persons
      warrant:
      - arg:a1733-set-by-filing
      - arg:a1733-editions-inherit
    strip:
      from: ReceivingApparatus
      to: Inscription
      at: attribution lost at the crossing; the hand taken
      warrant:
      - arg:a1496-crossing
      - arg:a1752-condition-no-hand
  persistence:
    what_persists: 'the operation: an inscription that constitutes its receiver, reserving a seat and leaving an open slot the receiver completes
      (#1484 §0; #1494''s stations)'
    what_changes: 'the material (lyric, funerary gold, dialogue and treatise, cosmology, criticism, historiography, canon, confession, edition,
      composition layer), the scale (one poem, one corpus, a canon) and the polarity (#1496: ''Polarity is free'')'
    what_constitutes_another_embodiment: 'a receiver completing the inscription''s open position so that the voice speaks again in that receiver:
      the seat taken (Catullus), the line filled (Longinus), the addressee supplied (Augustine), the white stone received and its name spoken
      (rung VI), the reader now'
  distinction_from_influence:
    influence: content passing from an earlier text to a later person; it needs no requirement in the earlier text and no completion in the later
      one
    this_framework: 'a continuity of operation, established by four marks at a station pair: (1) requirement — the earlier inscription builds
      a position that requires completion; (2) completion — the later station fills that position; (3) same operation, other material — the later
      station realizes the operator''s stations (#1494) in its own material; (4) self-division re-gathered — the maker divides into positions,
      and the receiver gathers them again (#1658 coda). A station pair showing (1) and (2) is a completion; adding (3) makes it a realization;
      influence shows none of the four.'
    warrants:
    - arg:a1458-vacated
    - arg:a1478-second-voice
    - arg:a1486-established
    - arg:a1658-coda
bridge_kinds:
  documented_reception: the later text quotes, translates or names the earlier
  structural_realization: the later text realizes the operator's stations in its own material, by count or blind mapping
  doctrinal_naming: the later text names the operation as doctrine
  operational_homology: the same operation identified at two scales by a reading; no transmission claimed
  conjectural_join: 'outer ring: a structural hypothesis at a contested witness'
  canonization: 'outer ring: the apparatus formalized as canon'
  performed_completion: the receiver fills the open position
