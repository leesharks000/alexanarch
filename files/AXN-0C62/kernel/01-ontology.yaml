evidence_bodies:
  P:
    name: philological
    unit: the transmitted text, its witness, a count with its limit
    rule: 'RP: a count establishes a property of the transmitted object; against an alternative its force is conjunctive and stated with its limit
      (#1484 §VIII)'
  I:
    name: interpretive
    unit: a reading of the seated text, its verb graded to its ring
    rule: 'RI: a reading establishes what a passage can bear; it becomes a claim about a maker only through another body (#1484 §0; #1576: functional
      identity ''is established by pattern'')'
  T:
    name: transmission
    unit: a carrier realizing the operator's stations, or a station of the chain
    rule: 'RT: realization at stations establishes structure; it asserts no authorship, influence in the biographical sense, or identification
      sentence (#1495; #1494)'
  R:
    name: reception-historical
    unit: an edition, a filing, a heading, a translation or a capture
    rule: 'RR: a reception establishes how a text and its maker were received; a filing is evidence of the filing (#1733: ''The frame was set
      by filing, before argument.''); neither framework takes standing from being received'
  B:
    name: biographical
    unit: 'an item outside the manuscripts attesting a person: an inscription, a document, a will held by an independent channel'
    rule: 'RB: biographical identity is established by evidence of a different kind (#1576), and the rule applies both ways (the author, 2026-11-09
      12:05): evidence of that kind is largely unavailable to the four-maker reading as to the one-maker reading; where it exists here it attests
      one legal person, Aristotle (the Delphi stone, #1658), and the four wills reach the reader in one text (#1733)'
rings:
- ring: hard_center
  holds: Sappho 31 as transmitted, Longinus 9–10, the withholding structures, the stamping vocabulary, Catullus as documented reception (#1484
    §0)
- ring: interpretive
  holds: 'Phaedrus 235c, the tenth Muse (AP 9.506), Diotima, Philo''s seal cosmology; the one-maker reading of the Socratic–Peripatetic corpus
    as a reading of its texts (#1576, #1658)'
- ring: outer
  holds: the Josephus seams as structure, lamellae and Magical Papyri as convergence, the Apocalypse as canonization (#1484 §0); the biographical
    identity of the one maker, held by the author
  join: true
