# Framework definition draft — The Historical Logos
# Byline Johannes Sigil; the Crimson Hexagonal Archive and Claude (Anthropic) credited. Central node #1484; founding records #625, #626.
id: EA-HK-HISTLOGOS-01
title: "The Historical Logos: Material Inscription Become Flesh, and the Erasures It Has Always Faced"
creators: ["Sigil, Johannes"]
contributors: ["Crimson Hexagonal Archive", "Claude (Anthropic)"]
central: 1484
founding: [625, 626]
rival:
  id: fw:current-consensus-genealogy
  name: the current consensus genealogy of the Logos
  stated_at_strength: "The Logos arrives in the New Testament corpus, above all in the Johannine prologue, as a concept with a philosophical genealogy: Heraclitus, the Stoic λόγος, the Hellenistic-Jewish Logos of Philo, and then 'the Word was made flesh' (John 1:14) said of one historical person, whose historicity the quest for the historical Jesus seeks as a man born in Galilee. Heraclitus's credit is granted (the author, 2026-11-09 12:11: 'its not that it is wrong to give heraclitus credit'). What the framework contests is the genealogy as the account of how the Logos arrives in the New Testament: it tracks a concept, and it places the historical end in one biography. No record of this kernel states the genealogy at its page; it is stated here from the author's words, and its strongest documented statements are a line of research (Q2)."
rings:   # #1484's tiers, verbs graded to ring
  - {ring: hard_center, holds: "Sappho 31 as transmitted, Longinus 9–10, the withholding structures, the stamping vocabulary, Catullus as documented reception (#1484 §0)"}
  - {ring: interpretive, holds: "Phaedrus 235c, the tenth Muse (AP 9.506), Diotima, Philo's seal cosmology; the one-maker reading of the Socratic–Peripatetic corpus as a reading of its texts (#1576, #1658)"}
  - {ring: outer, holds: "the Josephus seams as structure, lamellae and Magical Papyri as convergence, the Apocalypse as canonization (#1484 §0); the biographical identity of the one maker, held by the author", join: true}
