id: EA-HK-TENTHMUSE-01/ontology
classes:
  Framework: a named argument with a seed record and an author
  Record: an archive deposit, by AXN and hash
  Seat: 'a position of fr. 31''s deixis; Sappho''s occupation of it is recorded for I and you (#1270, #1484) and proposed for κῆνος (claim:tm-third-reversal;
    Q1)'
  AuthorStatement: a statement of the author's, dated and verbatim, held as provenance; it establishes what the author holds, not what a record
    shows
  Claim: a pointer to a quotation in a record, with typed state (#1529)
  EvidenceBody: one of four kinds of evidence, each with its rule
  Ring: a tier of evidentiary hardness (#1484)
  Capture: a reception event in the Capture Registry
  Stratum: a period of the framework's development
  Cluster: a grouping of records
