  bounds: strength
negative_edges:
- jealousy lyric (as the framework)
- an oral singer whose survival is others'
- contemporary scholars (for the future reader)
- the reconstructed stanza as manuscript reading
- the Slavonic as evidence for the sealed test
disambiguations:
  tenth Muse: 'the tradition''s filing of Sappho into the Muses'' apparatus (AP 9.506), carried by #1484 as the reception''s receipt'
  future reader: κῆνος as the reader seated face to face with the inscribed voice (#1270), distinct from 147's remembrance, which is common ground
    (#1645)
  κῆνος: a seat, not a person (#1484 §I)
