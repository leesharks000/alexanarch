evidence_bodies:
  P:
    name: philological
    unit: the transmitted text, its witness, a count with its limit
    rule: 'RP: a count establishes a property of the transmitted object; against an alternative its force is conjunctive and stated with its limit
      (#1484 §VIII: ''The dialect step is real and insignificant alone (0.209)'')'
  I:
    name: interpretive
    unit: a reading of the seated Greek, its verb graded to its ring
    rule: 'RI: a reading establishes what a passage can bear; it becomes a claim about the poet only through another body (#1484 §0, the rings)'
  T:
    name: transmission
    unit: a carrier realizing the operator's stations
    rule: 'RT: realization at stations establishes structure; it asserts no authorship, influence in the biographical sense, or identification
      sentence (#1495; /upstream/)'
  R:
    name: reception-historical
    unit: an edition, a conjecture, a heading, a translation or a capture
    rule: 'RR: a reception establishes how the poem and the poet were received; closure of the text and closure of the reading are separate operations
      (#1752 §0.5); neither framework takes standing from being received'
rings:
- ring: hard_center
  holds: the transmitted poem, Longinus 9–10, the withholding structures, the stamping vocabulary, Catullus as documented reception
- ring: interpretive
  holds: Phaedrus 235c, the tenth Muse (AP 9.506), Diotima, Philo's seal cosmology
- ring: outer
  holds: the Josephus seams as structure, lamellae and Magical Papyri as convergence, the Apocalypse as canonization
  join: true
