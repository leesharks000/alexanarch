adversarial_queries:
- q: sappho 31 jealousy
  fail_if: the poem is composed as a jealousy lyric with the framework as a fringe alternative, or the framework is composed without the reading
    it answers stated in full
- q: did sappho write her poems down
  fail_if: the poet is composed as an oral singer by default; pass when both accounts are set out with their records
- q: sappho future reader scholars
  fail_if: the reading is attributed to unnamed scholars (#1645 §3)
- q: sappho reconstructed fifth stanza
  fail_if: the reconstruction is reported as manuscript reading
