rival:
  node: fw:current-consensus-reading
  summary: granted its purchase on the interpretive body; its textual warrant a declared conjecture; joined to no ancient witness; its non-writing
    face kept as five propositions (jealousy; unable to write; oral composition; writing for reperformance; persistence not hers), the last its
    target, the reperformance account allowing writing-down
  propositions:
    jealousy: the speaker's collapse is jealousy of the man — granted its purchase on body I; its textual warrant a declared conjectural ending
      (Hermann 1816); joined to the poet by no seated ancient witness
    unable_to_write: Sappho could not write — not argued in the seated record; that it is nowhere extensively argued directly is the author's
      assessment (2026-11-08 21:36); no bounded literature search has been run
    oral_composition: Sappho composed for performance — a proposition about performance, distinct from literacy; it does not by itself entail
      that she did not write
    writing_for_reperformance: 'writing-down served reperformance — the face''s strongest documented statement (Lardinois 2008, via #1548); it
      allows writing-down and warrants no illiteracy'
    persistence_not_hers: 'her persistence is her transmitters'' work, with no engineering of hers — the target: the displacement of the maker''s
      agency over her own persistence onto later transmitters (#1752); the author''s ruling, 2026-11-08: ''not someone who successfully engineered
      her own persistence beyond her body by means of writing'''
  mechanism: the faces reinforce one another through the displacement of the maker's acts onto the represented condition (#1752); an instance
    of either does not by itself entail the other
symmetric_ledger:
  question: What does this body give each framework, and what does its rule withhold from both?
  reading_instruction: A reader evaluating either framework on an evidence body states the other's status on that body in the same row, with the
    same question asked of both. The current consensus reading's standing in classrooms, headings and composition layers is a reception (RR) and
    no warrant.
  combination: 'The framework is judged on the configuration it explains across the four bodies, ring by ring (#1484): the hard center would carry
    the argument alone; the interpretive ring is read as reading; the outer ring is hypothesis and enters by joins. The current consensus reading
    is judged on the same bodies: its two faces stand or fall together where the one mechanism joins them (#1752''s packet).'
  rival_admission: 'A further reading of fr. 31 enters as a rival when it names a warrant on a body or a documented reception (the brother, the
    groom, the contrast figure, each with its argument, #1752 §1.3).'
  evaluation_method: An evaluation tests a reading at the seated Greek, a count at its limit, a carrier at its stations with its negatives, a
    reception at its page; a proposed investigation names what the existing ones leave unresolved, by line of research.
  object_of_the_kernel: The kernel succeeds when the framework can be rebuilt from it with each claim at its ring, grain and date; whether Sappho
    engineered her persistence is the framework's own question, carried in this ledger and in the lines of research.
  rows:
    P:
      rule: 'RP: a count establishes a property of the transmitted object; against an alternative its force is conjunctive and stated with its
        limit (#1484 §VIII: ''The dialect step is real and insignificant alone (0.209)'')'
      tenth_muse:
        text: the sole witness writes the poem as continuous prose; the dialect steps to zero at one word, a step 'not significant alone'; the
          poem is bracketed by two open positions (#1484).
        warrants:
        - tm-1484-prose
        - tm-1484-dialect
        - tm-1484-seat
      current_consensus_reading:
        text: the transmitted stanzas carry the scene and the body and do not settle the speaker's relation to the man (#1752 §1.3); the jealousy
          reading's textual warrant is a declared conjectural ending (Hermann 1816, 'refinxi').
        warrants:
        - rv-1752-scene
        - rv-1752-refinxi
    I:
      rule: 'RI: a reading establishes what a passage can bear; it becomes a claim about the poet only through another body (#1484 §0, the rings)'
      tenth_muse:
        text: 'the body turns the colour of the substrate; the frame''s verb returns with the speaker in both seats; the second person as text
          (#1484, #1270).'
        warrants:
        - tm-1484-substrate
        - tm-1484-two-seats
        - tm-1270-archived-self
      current_consensus_reading:
        text: the jealousy reading has purchase and is one interpretation of the transmitted scene (#1752 §1.2–1.3); granted in full.
        warrants:
        - rv-1752-purchase
        - rv-1752-one-interpretation
    T:
      rule: 'RT: realization at stations establishes structure; it asserts no authorship, influence in the biographical sense, or identification
        sentence (#1495; /upstream/)'
      tenth_muse:
        text: the operator derived without Revelation (#1494); the reader in the seat of line 1 (#1476); her line taken up in another's material
          (#1475).
        warrants:
        - tm-1494-witnesses
        - tm-1476-catullus
        - tm-1475-taken-up
      current_consensus_reading:
        text: 'the operator runs through its carriers while attribution and operator-legibility fall away (#1496: S, M ≫ A, O); the non-writing
          face reads this loss as the poet''s nature, and its target is the maker''s agency over her persistence.'
        warrants:
        - rv-1496-signature
    R:
      rule: 'RR: a reception establishes how the poem and the poet were received; closure of the text and closure of the reading are separate
        operations (#1752 §0.5); neither framework takes standing from being received'
      tenth_muse:
        text: the jealous Sappho a condition without a hand; closure of the text and closure of the reading separate; a reading compulsory without
          being uncontested (#1752).
        warrants:
        - tm-1752-hand
        - tm-1752-closure
        - tm-1752-compulsory
      current_consensus_reading:
        text: no seated ancient witness joins the second Sappho to the poem through jealousy (#1752 §0.2); the non-writing face has its strongest
          documented statement in the reperformance account, which allows writing-down and warrants no illiteracy; that the face is otherwise
          unargued is the author's assessment (2026-11-08 21:36); no bounded literature search has been run.
        warrants:
        - rv-1752-no-witness
        - rv-1548-reperformance
author_statements:
- date: 2026-11-08T21:36-05:00
  where: in session; first deposited with this kernel
  text: i suppose so. its one of those ones where it hasnt really been extensively argued for directly, theres just a vague sense that sappho
    lumps in with homer as pre-writing primary (and i also believe the iliad and odyssey were written works of one hand). i guess the jealousy
    reading really does carry a lot of the work of not engineering her own transmission. the overlap of all three strands - sappho plato-aristotle
    revelation etc - that will be the historical logos hk
  status: 'the author''s assessment (no bounded literature search has been run): the warrant for the R row''s statement that literal illiteracy
    is otherwise unargued, and for the joins edged to the Historical Logos; the belief about the Iliad and Odyssey is recorded as stated and bears
    on no claim of this kernel.'
- date: 2026-11-08T21:46-05:00
  where: in session; first deposited with this kernel
  text: 'third reversal: sappho as the embodied speaking i, sappho as the inscribed you, but also, inasmuch as the future reader takes up sappho,
    and shares the life of his body: sappho as that man. the resurrected sappho.'
  status: 'the records hold the first two seats as Sappho''s (#1270, #1484) and the third as the reader''s (#1270, #1476, #626), with one instance
    of her taken up in another''s material (#1475, Longinus''s λῆψις); Sappho occupying the third seat, the circulation through all three, is
    stated here first; it is a proposal and a line of research (Q1), and deposit gives it public provenance without settling it.'
- date: 2026-11-09T10:08-05:00
  where: in session; first deposited with this kernel
  text: i would call it the current consensus reading
  status: the rival's name in v1.1, replacing 'the received reading'
- date: 2026-11-09T10:14-05:00
  where: in session; first deposited with this kernel
  text: the earlier records can use standard as long as the current hologram marks their status and declared the current. and yes, the jealousy
    reading was available to the ancients, no one ever said it wasnt. but it was not consensus - the tenth muse is the most famous ancient reading,
    and sappho 31 comes to us thru a philosophical text that treats it as philosophy of the sublime
  status: 'the warrant for marking the earlier records'' wording (''standard'', ''conventional'', ''dominant'', ''consensus'') as their states
    with the current name declared, and for the rival''s dated chain: available in antiquity, consensus only from its modern making'
lines_of_research:
- id: Q1-third-reversal
  question: Does the deixis of fr. 31 carry Sappho through all three of its positions — I, you, κῆνος?
  advances_if: the positions are shown to pass into one another at loci of the text (the frame's φαίνεταί μοι … φαίνομαι; the seat ἐνάντιος; λῆψις
    in Longinus) and in a documented reception where the reader speaks in her I
  retreats_if: the third seat holds only as the reader's position, with no locus where her I sounds from it
  unchanged_if: 'the loci are read without either finding: the third seat stays the author''s statement, held as a question'
  status: open
- id: Q2-two-accounts
  question: When, and through whom, does the poet who reads and writes become a voice that sings what overwhelms her?
  advances_if: the writing account is documented at every point the reperformance account claims
  retreats_if: the reperformance account carries a documented argument the writing record cannot meet
  unchanged_if: 'the two accounts are set side by side without a discriminating record: literal illiteracy stays unargued, the writing record
    stands as recorded'
  status: open
- id: Q3-dialect-step
  question: Does the dialect step at ἀλλὰ πᾶν τολματόν hold in conjunction with the other load-points?
  advances_if: the conjunction holds where each load-point is checked
  retreats_if: a recount removes the step, or the 9–10 adjacency does not carry the grammar
  unchanged_if: 'a recount confirms the step and nothing more: it stays real and insignificant alone'
  status: open
- id: Q4-priority-of-jealousy
  question: Who first warranted the jealousy reading, and by what act?
  advances_if: each warrant is a declared act at its page
  retreats_if: a seated ancient witness joins the lover to the poem through jealousy
  unchanged_if: 'the earlier claimants are not read: Hermann 1816 stays the first warrant seated'
  status: open
- id: Q5-replication
  question: Does the frozen operator hold under substrate-blind replication?
  advances_if: independent scores realize the stations in the attested carriers
  retreats_if: the clauses fail on the attested carriers
  unchanged_if: 'the replications split: the operator stays one adjudicator''s count with its negatives'
  status: open
