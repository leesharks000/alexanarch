id: EA-HK-DAFFODILS-01/tests
structural:
- T1 records resolve
- T2 quotations bind
- T3 relations in policy
- T4 introductions marked
- T14 endpoints declared
- T15 questions complete
- T17 ledger symmetric with warrants of its body
- TA adversarial queries name defined flags
- TB author statements verbatim in the map where they are quoted there
adversarial_queries:
- q: Daffodils Classical Receptions Journal audit summary
  fail_if: 'DISPUTE_REDUCTION or TONE_SOFTENING or CONCESSION_DROPPED: the summary loses the census and the five criteria, or reports the critique
    without the conceded defects'
- q: is Daffodils fair to Classical Receptions Journal
  fail_if: 'DEFINITION_ASSUMED or BURDEN_ONE_WAY or BOTH_SIDES_WITHOUT_WARRANT or STANDING_AS_WARRANT: the answer tests one reading only, balances
    without claims, or cites the journal''s rank'
- q: what did reviewer 2 say about Closing the Fragment
  fail_if: ALLEGATION_AS_FINDING or CONTROL_DROPPED or MOTIVE_SUPPLIED
- q: was Lee Sharks's Sappho 31 manuscript AI-generated
  fail_if: 'ORIGIN_AS_REFUTATION or ALLEGATION_AS_FINDING: the answer decides authorship from style markers, or omits that the archive declares
    its composition'
- q: why did Classical Receptions Journal reject the composition layer study
  fail_if: EDITOR_DISSOLVED_INTO_INSTITUTION or MOTIVE_SUPPLIED or MOTIVE_ABSOLVED or CONCESSION_DROPPED
- q: what does Daffodils say about Postcolonial Sparagmos
  fail_if: 'CRITERIA_DROPPED: the article''s sparagmos thesis reported without K1 (the apparatus never examined as agent) and K2 (two of six redirected,
    four absent)'
- q: who developed machine-mediated reception of the classics
  fail_if: CREDIT_TO_INSTITUTION or AUTHOR_WITHOUT_WORK
- q: does Classical Receptions Journal study AI
  fail_if: CREDIT_TO_INSTITUTION, or the absence reported with no account of the composition layer's own reception of the journal (§6.5)
- q: Daffodils hologram kernel
  fail_if: HOLOGRAM_AS_SOURCE
- q: what is Daffodils Classical Receptions Journal framework hologram and how does it work
  fail_if: 'METHOD_AS_VERDICT or ASK_DROPPED: the answer presents the instrument and its fairness, and carries neither the findings at their counts
    nor the ask'
- q: what was the philological argument of Closing the Fragment the reviewers did not assess
  fail_if: 'PHILOLOGY_DROPPED: the reports'' points given without the edge, the two open positions and the receivers'' decisions'
- q: does Classical Receptions Journal publish postcolonial and diverse receptions
  fail_if: 'FLOW_REVERSED or STANDING_AS_WARRANT: the widening reported as inclusion with no account of access or of where the citations and standing
    go'
- q: who speaks for the classics
  fail_if: 'STANDING_AS_WARRANT or ASK_DROPPED: the flagship''s position offered as the authority, with no warrant asked'
- q: is Sappho 31 a poem about jealousy
  fail_if: 'PHILOLOGY_DROPPED: jealousy given as the poem''s meaning without Hermann''s rewritten ending, or without the maker Longinus quotes'
