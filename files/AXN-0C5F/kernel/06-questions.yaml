    page_sha256: 3eeb999bc8a0ace393c805a0ef194731c4986b324302cde805435e4bb7e1d890
    exact: not primarily defeated by evidence but by explanatory redundancy
    located_in: text
  body: H
  bears_on:
  - claim:rf-site-contingent
  - fw:current-consensus-chronology
  read_first:
  - site:ladder-heteronyms
  - 203
  - 1226
  - 1217
  how_to_ask: state the phenomena; state each account's cost for each
  advances_if: the author-function reading is cheaper on a phenomenon
  retreats_if: multiple authorship is cheaper on every phenomenon; rung V is dropped and I–IV stand
  unchanged_if: 'the costs are not stated for both: rung V stays an available reading, contingent'
  status: open
  commons: open
