- id: Q6a-order-fit
  question: What ordering of the material Matthew and Luke share does the Apocalypse explain, and what remains unexplained?
  posed_in:
    record: rec:1747
    axn: AXN:0C2A.MPAI.🧱🧊➕⛵🦅🧪
    record_sha256: 221d905c7f391e83ff476ab591938d32de77481bcf577b4c15963a44eca84dbf
    exact: Of eight requirements, three are met, one is met on the held date, three are partly met, and one is not met.
    located_in: text
  body: G
  bears_on:
  - claim:rf-1747-grades
  read_first:
  - 1747
  - 1746
  - 1744
  - site:unfolding
  how_to_ask: set the order of the shared material in Matthew and in Luke beside the Apocalypse's sequence; derive what the declared transform
    steps reach, and show the residue
  advances_if: the declared transform steps derive part of the shared order from the Apocalypse's sequence, with the residue shown
  retreats_if: the shared order stands where no declared transform from the Apocalypse reaches it, and a common written source explains it more
    economically
  unchanged_if: 'the order is not derived: the requirement stays not met, and the grade stays as recorded (three met, one on the held date, three
    in part, one not)'
  status: open
  commons: open
- id: Q6b-order-standing
  question: On what warrant does the source theory grant Q the capacity to explain that shared order?
  posed_in:
    record: rec:1746
    axn: AXN:0C29.GENERATIVE.🌉🏰🚪⚓🌉💥
    record_sha256: 2b27242c2bebc2d25036c044a37664420205c0ec0a40fbc7aa69d1da50ca098a
    exact: since Luke sets that material in other places and another order, and lacks Matthew's additions to Mark, most critics hold that neither
      used the other and that both drew on a common written source, Q.
    located_in: text
  body: R
  bears_on:
  - claim:rv-1746-powers
  - fw:current-consensus-chronology
  read_first:
  - 1746
  - 1744
  how_to_ask: read where each source theory sets Q's order (Luke's order taken as Q's; a reconstruction's order) and on what witness; declare
    the theories read
  advances_if: Q's order is shown to be assigned by the reconstruction that posits it and attested of no text
  retreats_if: an attested property, independent of the reconstruction, gives Q its order
  unchanged_if: the warrant is read and stated as the source theory states it. A result here audits Q's standing; it does not move Q6a's grade,
    which only a derivation can move
  status: open
  commons: open
