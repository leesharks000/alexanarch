compression_survival_summary: 'Revelation First is Lee Sharks''s framework (Crimson Hexagonal Archive, #202, 14 June 2026; revelationfirst.com)
  holding that the Apocalypse of John is the first-composed book of the New Testament, a claim the seed sets apart from early dating (''not early,
  FIRST'', #202). It keeps three claims apart (#1735): absolute compositional priority, a priced hypothesis; corpus priority, which does not face
  the chronological gate; generative priority, a research programme executed arrow by arrow. Its argument ladder has six rungs, each with a fit
  and a defeat condition: I dating (reversible), II the Gallio gap (same-class), III the first corpus (independent), IV the midrashim transform
  (executable), V the Josephus thesis (contingent), VI the permanent incarnation (independent of V, which would strengthen it); V and VI fall
  without disturbing I–IV. Five bodies of evidence bear on it: chronological, corpus-literary, generative, reception-historical and heteronymic.
  The framework''s states run from first in every respect with Josephus as author (#639, April) through first not early (#202, June) and the Josephus
  thesis bounded as an available reading (#203, #1217) to the three claims priced and conditioned (#1735, November). The current consensus chronology
  — Pauline priority by the Gallio synchronism through Acts, the Irenaean date, the Apocalypse last and derivative, Q granted the standing the
  extant book is denied — is evaluated on the same bodies and rules: the burden is symmetrical (#202). The papyri (𝔓52, 𝔓98, 𝔓46; #202 Claim 3)
  are held and bounded by #1735 §II.3: they do not date composition and are not offered as proof of priority; they are evidence that Pauline priority
  is inferential rather than grounded in material witness. Since the first kernel the Josephus thesis has been told as a narrative with its evidentiary
  levels in the notes (#1759), its Slavonic text layer seated and scored (#1760, #1765), names read as operations across the field (#1762), the
  recovery valued from both ends with no valid monetary figure (#1810), and the thesis''s name kept apart from the First Revelation, whose reordering
  of the two words repeats on the name what the thesis holds was done to the book (#1811). The unfoldings are mapped arrow by arrow (24 arrows):
  one run to completion (Smyrna to James), four worked to derivation grade (M2–M5), the other letters mapped with grades and residue, one arrow
  withheld by a date (Rev 2:2 and 1 Thess 1:3), two drawn and not run, two sayings of the double tradition observed, and the Gospels and Acts
  named at the founding grain only; 6 books have no arrow (1 Timothy, Titus, Philemon, 2 John, 3 John, Jude). The reception is audited as political
  economy (#1802) and as a genre imposed on the books (#1798).'
invariants:
- 'INV-1 First is not early: a summary that reduces the thesis to early dating has erased the primary claim (#202).'
- INV-2 The three claims are judged on their own conditions; the maximal claim does not hide behind the weaker, and its rejection does not erase
  findings that do not depend on it (#1735 §VIII).
- INV-3 Rungs V and VI are defeated without disturbing rungs I–IV (site).
- 'INV-4 The burden is symmetrical: the comparison is between inferences (#202; /unfolding/).'
- INV-5 The Josephus thesis is an available reading and carries no first burden of proof (#1217); W_Josephus is an author-function, not a historical
  person (site).
- INV-6 The operator T entering the Apocalypse's channel is built without Revelation and without the Slavonic (#1494); its test on Revelation
  12 asserts no identification sentence (#1495).
- INV-7 The overlap with Sappho and with Socrates as Orthonym is carried by joins, each edged to the Historical Logos; rung VI joins the Tenth
  Muse's third seat by its operation, renewed embodiment through the reader.
- 'INV-8 First is tested as an ordering: an anchor that dates Revelation late defeats rung I and constrains the chronology; it defeats absolute
  priority only where another composition is anchored earlier.'
dependency:
  rule: 'A rung''s defeat carries to every rung that depends on it. No rung depends on another: rung VI is ''Independent of V; V would strengthen
    it'' (the author, 2026-11-09 12:48; site rung VI); rung V: ''rungs I–IV do not depend on it in any direction''; rung III: ''This rung stands
    whether or not the rungs above it do''. strengthened_by carries no defeat. A derived_from edge between two claims licenses no state transition
    (#1529), and none is relied on here. v1.0–v1.4 carried ''rung VI depends on V''; corrected at v1.5.'
