  not_claimed:
  - 'The shared order of Matthew and Luke: ''not met; not claimed'' (#1747).'
  - 'A derivation of the double tradition as a whole: two sayings are ''an observation awaiting a census'' (#1747).'
  - 'The order of James against the order of the Smyrna letter: ''open… Not yet measured'' (the James working surface).'
  - 'Any Gospel derived: the four Gospels and Acts stand at the founding grain, named and not run, apart from three Matthean and two Lukan loci
    observed or drawn in #1746–#1747.'
  - 'Seed inventory beyond Rev 1–3, 5, 13 and 21: the seals, trumpets and bowls, the two witnesses, chapters 12 and 17–20 and the close of the
    book have no typed seed elements.'
  outline_of_the_total_programme:
    status: an outline proposed at v1.5 from the map above, for the author's ruling; it is no record's claim and nothing in it is asserted of
      the texts
    author_programme:
      at: 2026-11-26 12:35
      text: 'in fact - its time we built that map. we have some preliminary mappings that will allow us to experiment with the whole. heres what
        im imagining: we have the four riders, the four creatures, the four names, and the four gospels. and we have a specific mapping to matthew
        with the mourning tribes. we can press into the matthew mapping, define a transform algorithm that describes the transformation of revelation
        materials to matthew, then use that to work out the other three. same with the epistles. we have james. what im imagining well find is
        a seven within seven structure: the seven church pauline formation transformed from rev''s seven churches, but then also paul as one of
        seven and the other named epistolary positions mapped to rev''s seven. its time we mapped it out.'
      status: the author's statement of the map to be built; hypotheses, not findings. Carried here as the head of the outline; the mapping is
        opened as a working file and is not part of this kernel
      hypotheses:
      - 'a fourfold: the four riders, the four creatures, the four names and the four Gospels'
      - 'Matthew first, pressed from the mourning tribes (Matt 24:30 and Rev 1:7): a transform algorithm defined on Matthew, then used to work
        out the other three'
      - the epistles from James, the one run case
      - 'a seven within seven: the Pauline seven-church formation transformed from Revelation''s seven churches, and Paul as one of seven named
        epistolary positions mapped to Revelation''s seven'
    object: 'Revelation unfolded to each of the twenty-six other books as an executable derivation, with the residue of every book displayed:
      ''The transform graph is the object to be broken, not merely admired.'''
    stages:
    - n: 1
      name: seed inventory
      what: Revelation whole, segmented into typed seed elements in Greek, in one file
      have: Smyrna, eleven elements (working surface); the other six letters, two to six each; M2–M5, three or four each
      owed: Rev 4, 6–12, 14–20, 22
    - n: 2
      name: operator vocabulary, frozen
      what: 'the declared operations gathered into one vocabulary with families (expand, anchor, frame) and classes (M, M̄, X), fixed before each
        new test as #1494 fixed T'
      have: 39 operation names across the run, worked and mapped arrows; families declared for James only
      owed: families for the rest; a rule that an operation coined after scoring does not count
    - n: 3
      name: target census, book by book
      what: every pericope of the target book classed derived, partly derived, residue or other-tradition, as James is
      have: 'James: 13 derived pericopes; residue 6 pericopes'
      owed: twenty-five books; first the mapped epistles (Colossians, 1 Corinthians 8–10, 1 John, 1 Thessalonians, Philippians)
    - n: 4
      name: antecedent map
      what: for each arrow, the tradition available to both texts, stated before the direction is argued (#1735 §VI.3, step two)
      have: Lev 26:12, Isa 53, Isa 65:17 and 66:22, Dan 7 (M2–M5); Dan 7:13, Zech 12:10–12, Gen 12:3 (Matt 24:30)
      owed: the seven letters, per element
    - n: 5
      name: direction
      what: 'the anchor rules, which alone carry direction: a word or form carried across and changed in grammar or standing, with the evidence
        that would reverse the arrow stated first'
      have: δώσω → ἐπηγγείλατο (Rev 2:10 → Jas 1:12); ἐπάγγελμα (2 Pet 3:13); Col 4:16, the exchange recorded in the canon
      owed: one anchor rule per mapped arrow, or the arrow stays a map
    - n: 6
      name: order
      what: whether the borrower keeps, gathers or scatters the order of the seed
      have: 'the Jas 2:2–7 knot: ''The order is not kept; the gathering is.'''
      owed: a measure; the shared order of Matthew and Luke, not claimed
    - n: 7
      name: the Gospels
      what: the census of the double tradition against Rev 1–3, 16:15 and 22:7–20, then Matthew, where six critics already drew the arrow at 24:30
      have: the thief, the confession, Matt 24:30; four parameter sets named at the founding grain
      owed: everything else; the Gospels are the least mapped part of the programme and the largest
    - n: 8
      name: the residue ledger
      what: 'one ledger of what does not derive, across the New Testament: the falsification surface of rung IV'
      have: James, six pericopes; per-letter residue in prose
      owed: the ledger
    - n: 9
      name: scoring by other hands
      what: clauses and scoring rule handed to independent substrates with the target unnamed (lines_of_research)
      have: 'the precedent, #1495: one adjudicator, one pass, replication invited'
      owed: a run
    order_of_work:
    - version the James working surface, which has moved past the frozen v1.0
    - 'Colossians and 1 Corinthians 8–10 to executable grade: the highest-graded mapped arrows, one of class X and one of class M̄'
    - Hebrews, where 4 arrows already land from separate seeds
    - the double-tradition census, then Matthew
    - 'the books with no arrow: 1 Timothy, Titus, Philemon, 2 John, 3 John, Jude'
    what_would_count_against: Identify NT passages that cannot be derived from Revelation through any plausible transform — these are the counterevidence.
      The transform graph is the object to be broken, not merely admired.
