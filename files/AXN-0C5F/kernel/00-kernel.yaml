unfoldings:
  rule: 'A compressed map of every arrow the records draw from Revelation to another book of the New Testament, each at its own grain and state,
    and an outline of the total programme. A map is not a derivation: an arrow counts for what its state says and no more, and ''The comparison
    is between inferences. The burden is symmetrical.'' (site /unfolding/). Grades are ''the evaluation''s, offered for ruling, not settled canon''
    (the slate of 2026-07-28).'
  direction: 'outward, Revelation to the later books (rung IV). The foldings in, Sappho 31 and Philo into the Apocalypse''s channel (#1493–#1495,
    #1511, #1758), are the kernel''s joins and are not repeated here.'
  states:
    run: 'an executable derivation: typed seed elements, declared rules, emissions matched verse by verse, coverage counted, residue displayed'
    worked: 'derivation grade: seed, rules, emissions and an honesty panel stating the shared-source alternative'
    mapped: a letter mapped to an epistle with a grade, its class and its residue stated; granularity proportional to evidence
    drawn: an arrow drawn and not run; direction open
    withheld: markedness found; the arrow withheld by a date held under the chronology under examination
    observed: a lexical observation awaiting a census; no derivation claimed
    named: 'stated at the founding grain (#407, #639, #65, #1217); no seed inventory, no rules, no residue'
    unresolved: split between targets and left split
  classes:
    M: elaborative unfolding — the seed's structure expanded, its terms retained, its ruling kept
    M̄: adversarial unfolding — the seed's terms retained, its ruling negotiated or inverted; the epistle argues with its seed
    X: canonical mechanism — the exchange or carriage of the letter recorded in the canon itself
  falsification: Identify NT passages that cannot be derived from Revelation through any plausible transform — these are the counterevidence.
    The transform graph is the object to be broken, not merely admired.
