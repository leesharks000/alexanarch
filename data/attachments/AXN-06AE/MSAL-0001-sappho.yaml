monetary_grammar:
  equivalence: true
  scalarization: true
  fungibility: true
  alienability: false
  transferability: false
  accumulation: false
  ownership: true
  discounting: false
  settlement: false
  capitalization: true
  grammar_notes: 'An option valuation activates equivalence, scalarization, ownership and capitalization, and does
    not activate settlement, alienability or discounting. This matters: the inscription claims no discharge of anything,
    which is why it can be a witness compression despite being unsound.'
closure_audit:
  scalar_presented_as: partial_representation
  audit_pointer: preserved
  excluded_relations_can_reopen_account: 'true'
  monetary_settlement_claimed: 'false'
  semantic_settlement_claimed: 'false'
  classification: witness
  rationale: The inscription named itself a toy, carried its own sensitivity analysis, and stated that it was not
    fair market value. The pointer back to the evidence is preserved and this ledger is one. No account is claimed
    closed.
inscription_integrity:
  assessment: unsound
  defects:
  - defect: the transport coefficient's denominator is the archive's own observation count
    class: observer_denominator
    evidence: tau = U_P / 588, where 588 is the number of observations the archive had made. Running a thousand
      further captures with nothing changing in the world would cut tau by roughly 60% and the valuation with it.
    effect_on_amount: unbounded; the amount is a function of our labour
    repairable: with_new_measurement
  - defect: the unseen-uptake multiplier is asserted and conflicts with the archive's own computed floor
    class: undeclared_coefficient
    evidence: U_unseen = 40 appears with no derivation. The registry's Good–Turing figure gives a multiplier of
      1.61 on observed events, 25× smaller.
    effect_on_amount: roughly 25× high
    repairable: with_new_measurement
  - defect: the computed floor does not license that use either
    class: population_mismatch
    evidence: the Good–Turing figure was computed over addresses at which archive material is cited; operator export
      is a different and much rarer population with one complete instance. An estimator on the first population
      cannot be applied to the second.
    effect_on_amount: the true multiplier is unknown, not 40 and not 1.61
    repairable: with_new_measurement
  - defect: the product is dimensionally incoherent
    class: dimensional_incoherence
    evidence: dollars × (events / observations) × dimensionless does not yield dollars
    effect_on_amount: the output is not a monetary quantity in the sense its unit claims
    repairable: 'no'
  - defect: the incidence coefficient is the midpoint of an invented log range, presented as a working centre
    class: range_midpoint_as_finding
    evidence: alpha_M spans 1e-8 to 1e-4 in the inscription's own table, and the answer spans $0.14M to $8.65B;
      1e-6 is chosen, not measured
    effect_on_amount: four orders of magnitude
    repairable: with_new_measurement
  - defect: the exposure base is a proxy named as the object
    class: proxy_named_as_object
    evidence: $503.5T is the financial assets of financial institutions in 29 jurisdictions, not 'the monetary substrate'
    effect_on_amount: unquantified
    repairable: 'yes'
  - defect: the input is stale
    class: stale_input
    evidence: N_obs = 588; the registry holds 601 observations at audit time
    effect_on_amount: 'small, and it demonstrates the first defect: the coefficient moves when we work'
    repairable: 'yes'
  amount_survives_audit: 'no'
  note: 'Seven defects, of which one is not repairable by further measurement: a product of a stock, a rate over
    our own effort, and a dimensionless coefficient does not yield a monetary quantity. The amount is preserved
    in this ledger exactly as written, because preservation is what the ledger requires; it is preserved as an artifact
    of a grammar now visible, not as a value.'
