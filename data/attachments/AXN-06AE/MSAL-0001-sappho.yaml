  mechanism: scalarization onto a common unit
  depends_on_monetary_form: 'true'
- capacity: sensitivity analysis over the unknown coefficient
  mechanism: the formula exposes alpha_M as the dominant term
  depends_on_monetary_form: 'true'
  evidence: the inscription's own §7 shows every decimal of alpha_M moving the result by an order of magnitude —
    a capacity the pre-monetary object did not have
- capacity: 'threshold analysis: what would have to be true for the option to matter'
  mechanism: inversion of the formula
  depends_on_monetary_form: 'true'
- capacity: capital-allocation legibility
  mechanism: expression in a grammar an investor already reads
  depends_on_monetary_form: 'true'
