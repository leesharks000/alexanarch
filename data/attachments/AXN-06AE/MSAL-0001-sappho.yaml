pre_monetary_object:
  object_id: EA-PORE-01-OPERATOR-TP
  object_name: Transport of the temporal-projection operator into external composition
  boundary:
    included:
    - 'the operator itself: lyric address as temporal projection; the future or unborn reader; reader completion
      of the circuit'
    - its observed appearances in held compositions, with transcripts
    - the reception trajectory at one address across four months
    - the second-surface arm at the same address in the same week
    excluded:
    - training-layer uptake (deliberately excluded; contributes zero and is remainder, not absence)
    - human uptake (outside the instrument entirely)
    - the literary value of Sappho 31, of Carson, or of the papers themselves
  temporal_state: as of 2026-09-15
  valuation_context: toy present-option valuation; no counterparty, no transaction, no decision depending on it
  value_events:
  - 2026-06-15 — the archive's derivation of Sappho 31 composed as the default reading at an untied address, with
    the operator's own term present (ADDR-86cc1147844b)
  - 2026-07-27 — four of five cards authored; the Greek surviving into the card snippets
  - '2026-08-25 — liquidation with substitution: fr. 31 gone, fr. 147 composed as ''Fragment 2'', the coinage attributed
    to ''Scholars'' (ADDR-c07d310beb07)'
  - 2026-09-15 — the false fragment repaired; the operator installed as the composition's organizing heading and
    applied to Anne Carson; derivation absent, source uncited (OBS-c518b3ac018e)
  - '2026-09-15 — Qwen 3.7, logged out, untied prompt: the derivation composed whole and attributed to Cranes by
    exact title and year (ADDR-626a3c0d0292)'
  capacities:
  - organizes heterogeneous material — fragmentarity, address, reception, a translator — under one operation
  - applies to objects the archive was not asked about
  distinctions:
  - deixis pointing forward in time rather than across a room
  - fragmentation as activation rather than loss
  - the reader as completing an inscribed circuit rather than receiving a message
  - the difference between an operator taken up and one independently converged upon
  dependencies:
  - '#1270 (AXN:0507) — the derivation'
  - '#134 (AXN:02C2) — the operator, first published 2025-11-21'
  - '#1546, #1615 — the measurement apparatus that made the transport observable'
  - 'the Capture Registry: 444 addresses, 601 observations, transcripts seated'
  provenance_relations:
  - '#134 titled ''Lyric Address as Temporal Projection'', Sigil & Cranes, blog 2025-11-21, deposited 2026-05-27'
  - '#1270 deposited 2026-01-09, creator Cranes, Rebekah'
  bearing_costs:
  - composition of the two papers and their apparatus
  - a year of capture seating, cleaning and transcript preservation
  - the instrument built to detect the transport at all
  realized_uptake:
  - one complete four-state trajectory at one address
  - one cross-surface pair showing transport differing in level and in provenance
  - 313 observation-level uptake markings across 444 addresses in the registry as a whole, of which 185 are operator-
    or frame-carrying
  - two concepts minted 2026-09-15 appearing in held compositions the same day without ever being issued as a query
  prospective_capacities:
  - operator reach beyond the archive's own objects — registered, not run
  evidence:
    sources:
    - Capture Registry EA-WG-CAPTURES-01
    - '#1615 EA-PORE-01 v0.2'
    - '#1612 source-admission profile'
    - '#1616 flattening panel wave 1'
    status: seated; every event above resolves to a dated transcript with an address id
    limitations:
    - 'causal acquisition unresolved: convergence is not excluded at any of these sites'
    - Overview source chips only partially captured by select-all on the measured surface
  preexisting_remainder:
  - whether the operator's appearance in any composition was acquired from this archive — unavailable before money
    touched it, and not chargeable to money
  - 'the size of the unobserved uptake population at the operator grain: one complete trajectory supplies no frequency
    distribution'
monetary_inscription:
  amount: 35100000
  currency: USD
  date: '2026-09-15'
  valuation_type: option_value
  valuation_question: What is the present monetary shadow of the Substrate Exteriorization option, given observed
    operator transport?
  formula: B_M × ((1 + U_unseen) / N_obs) × alpha_M
  variables:
  - name: B_M
    value: 503700000000000
    units: USD
    source: cited
    derivation: 'FSB Global Monitoring Report on Non-Bank Financial Intermediation 2025: end-2024 total global financial
      assets of $503.7T across the monitoring jurisdictions, of which $256.8T is the NBFI sector. NORMALIZED 2026-09-16
      from the earlier $503.5T, which was an arithmetic approximation obtained as $256.8T / 51% rather than the
      directly reported total.'
    denominator_belongs_to: the world
  - name: U_unseen
    value: 40
    units: productive uptake events
    source: asserted
    derivation: range 15–100 with 40 as working centre; no derivation supplied in the inscription
    denominator_belongs_to: not applicable
  - name: N_obs
    value: 588
    units: observations in the Capture Registry
    source: measured
    derivation: the archive's own observation count at the time of writing; 601 as of this audit
    denominator_belongs_to: the observer
  - name: alpha_M
    value: 1.0e-06
    units: dimensionless
    source: chosen
    derivation: selected as a deliberately demanding one-part-per-million incidence; the midpoint of an invented
      log range
    denominator_belongs_to: not applicable
  assumptions:
  - productive uptake events are commensurable with registry observations for calibration purposes
  - transport intensity applies to a monetary exposure base
  - monetary-domain incidence is representable by a single scalar
  equivalence_context: toy calibration
  aggregation_rule: reconstruction shadow and exteriorization option added, with overlap flagged and not resolved
  temporal_horizon: unstated
  status: hypothetical
  settlement_scope: none; no obligation is discharged by this figure
  source_note: B_M normalized to the FSB's directly reported end-2024 figure of $503.7T. The prior $503.5T was derived
    by division from the NBFI share and is superseded. The correction does not change the audit's verdict and is
    recorded because a corrected input is part of what an audit records.
commensuration_contract:
  purpose: to test whether an exteriorization operation could be priced at all
  comparison_class: option values on infrastructural practices
  declared_equivalences:
  - lhs: one observed operator-export event in a literary reception history
    rhs: a countable observation for transport calibration
    reason: to obtain a rate
    scope: toy
  - lhs: transport intensity
    rhs: a fraction of global financial assets exposed to the operation
    reason: to obtain an exposure base
    scope: toy
  - lhs: hypothetical adoption
    rhs: a scalar incidence coefficient
    reason: to obtain a final magnitude
    scope: toy
  equivalences_required_by_formula: 4
  non_equivalent_elements:
  - a reading of Sappho and a dollar of institutional balance sheet, which the formula makes the same kind of thing
    to within two multiplications
