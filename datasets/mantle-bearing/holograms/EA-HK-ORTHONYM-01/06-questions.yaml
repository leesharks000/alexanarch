id: EA-HK-ORTHONYM-01/questions
rule: A question carries the record that poses it, the body it belongs to, what it bears on, the instrument, what to read first, how a researcher
  asks it, how a machine investigates it, and what result would advance or retreat the framework. A machine meeting a claim it cannot settle takes
  up the question that bears on it.
questions:
- id: Q1-platonic-axis
  question: Does the Platonic corpus fall on the operation axis that divides the Aristotelian and Theophrastan corpora, or does a name-axis survive
    among the three?
  posed_in:
    record: rec:1605
    axn: AXN:0695.UNCLASSIFIED.✖️🔽🧱👈🍂🎆
    exact: The test is the same instrument turned on the Platonic corpus
    located_in: text
  body: S
  bears_on:
  - claim:th-1586-axis
  - claim:sy-1658-maker
  - fw:many-maker
  instrument: Measuring the Operation, Not the Name (#1593), with its reference implementation, on the Plato seat (#1506), the Aristotle seat
    (#1559) and the Theophrastus seat (#1565)
  read_first:
  - rec:1586
  - rec:1593
  - rec:1605
  how_to_ask: 'Ask: do Plato''s Laws, Sophist, Statesman and Timaeus fall on the world/instrument axis of The First Axis (#1586), and does drama
    need a dimension of its own? Read #1586 and #1593 first, then run the protocol.'
  how_a_machine_investigates: 'The machine fetches #1593 and its implementation, seats the three corpora by their record identifiers, runs the
    unsupervised and supervised arms with the stated controls, and reports the axis, the name recovery and the permutation null.'
  advances_if: 'the Platonic works fall on the operation axis with the names at chance unsupervised, and name recovery under supervision tracks
    subject as in #1593'
  retreats_if: a name-axis survives among the three with subject and operation held constant, or drama requires a dimension on which the names
    sort
  status: open
  commons: open
  consequence:
    if_advances:
      moves:
      - 'extension: the operation axis across the Platonic, Aristotelian and Theophrastan corpora'
      effect: the extension is established on body S
    if_retreats:
      moves:
      - 'extension: the operation axis across the Platonic, Aristotelian and Theophrastan corpora'
      effect: the extension retreats; claim:th-1586-axis stands within its two corpora
    unchanged:
    - 'claim:sy-1658-maker (R2: no separation identifies a maker)'
- id: Q2-xenophon-aristophanes
  question: Do Xenophon and Aristophanes earn function-positions by the stopping rule, or do they stay at the configuration's edge?
  posed_in:
    record: rec:1605
    axn: AXN:0695.UNCLASSIFIED.✖️🔽🧱👈🍂🎆
    exact: A name earns a function-position in the configuration if and only if
    located_in: text
  body: I
  bears_on:
  - pos:socrates
  - fw:socrates-as-orthonym
  instrument: 'the stopping rule of The First Draft §14, applied to the seats of #1562'
  read_first:
  - rec:1562
  - rec:1605
  - rec:1579
  how_to_ask: 'Ask: by The First Draft''s stopping rule (#1605 §14), does Xenophon''s corpus, or Aristophanes''s, show recurrent, position-specific
    transformations across a demonstrable seam, with within-name controls? Read #1562 for why both were held apart.'
  how_a_machine_investigates: 'The machine reads the rule''s conditions in #1605, takes Xenophon''s two Apologies and the Clouds as the seams
    it names, and reports each condition met or unmet with its locus.'
  advances_if: either name meets every condition of the rule, extending the configuration by its own criterion
  retreats_if: both fail at a stated condition, which bounds the configuration and leaves the four positions as they stand
  status: open
  commons: open
  consequence:
    if_advances:
      moves:
      - 'extension: function-positions for Xenophon and Aristophanes'
      effect: the configuration is extended by its own stopping rule
    if_retreats:
      moves:
      - 'extension: function-positions for Xenophon and Aristophanes'
      effect: 'bounds: the extension fails and the configuration is bounded at four positions'
    unchanged:
    - pos:socrates
    - pos:plato
    - pos:theophrastus
    - pos:aristotle
    - claim:sy-1658-maker
- id: Q3-seams
  question: Does the Theophrastan transformation recur at the other seams under the same name-boundary?
  posed_in:
    record: rec:1584
    axn: AXN:0675.GENERATIVE.🝊🚀♃♻️🌒🔀
    exact: Whether it recurs at other seams under the same name-boundary
    located_in: text
  body: S
  bears_on:
  - claim:th-1584-traversal
  - pos:theophrastus
  instrument: 'passage-level measurement after #1584 and #1593: De sensibus against De anima I; the botany against the zoology; the doublet titles;
    Β against Λ as the within-name control'
  read_first:
  - rec:1584
  - rec:1593
  - rec:1581
  how_to_ask: 'Ask: is the Characters'' operation (extract, classify, register; γάρ and cause-demand low; τις/τοιοῦτος high) found at De sensibus
    against De anima I, and absent at Β against Λ? Read #1584 §6 first.'
  how_a_machine_investigates: 'The machine computes the #1584 measures on each named pair from the seats, reports each with its control, and states
    which pairs show the transformation.'
  advances_if: the transformation recurs position-specifically at the named seams and is absent from the within-name control
  retreats_if: it does not recur, or the within-name control (Β against Λ) shows the same transformation, which would dissolve the named function
    into a register any text can take
  status: open
  commons: open
  consequence:
    if_advances:
      moves:
      - claim:th-1584-traversal
      - pos:theophrastus
      effect: 'the named function generalizes from #1584 to the seams'
    if_retreats:
      moves:
      - pos:theophrastus
      effect: the Theophrastan position retreats from a named function to a register any text can take
    unchanged:
    - 'claim:sy-1658-maker''s establishment (its grounds are #1588, #1583 and #1603)'
- id: Q4-full-splice
  question: Does the remainder of Λ also find places in the fragment when Λ is spliced whole?
  posed_in:
    record: rec:1667
    axn: AXN:06E9.UNCLASSIFIED.🌒🧱🧱♍🦅↗️
    exact: a full splice of Λ is the next exhaustion, and would test whether Λ's remainder also finds places
    located_in: text
  body: M
  bears_on:
  - claim:th-1583-hinge
  - claim:mx-1597-order
  instrument: 'the binding-dependency audit and continuity trial of #1597, on all of Λ'
  read_first:
  - rec:1667
  - rec:1597
  - rec:1595
  how_to_ask: 'Ask: when all 5,071 words of Λ are spliced into Theophrastus''s On First Principles, do the remaining movements find joins that
    pass the binding-dependency audit? Read #1597''s four audits first.'
  how_a_machine_investigates: 'The machine takes the two seated texts (#1595), applies the join rules of #1667 to each remaining Λ movement, runs
    the binding-dependency audit, and reports placements and violations.'
  advances_if: 'the remainder finds places with violations at or below the rate of #1597'
  retreats_if: the remainder finds none, or forces violations the partial splice avoided
  status: open
  commons: open
  consequence:
    if_advances:
      moves:
      - claim:th-1583-hinge
      - claim:mx-1597-order
      effect: the splice generalizes from the joined movements to the whole of Λ
    if_retreats:
      moves:
      - claim:th-1583-hinge
      - claim:sy-1658-maker
      effect: the hinge retreats, and its failure travels to the production model along the generalizes edge (establishment)
    unchanged:
    - claim:th-1588-uncounted
    - claim:se-1603-provenance
- id: Q5-arabic-hinge
  question: What does Isḥāq's Arabic give at the hinge lemmas?
  posed_in:
    record: rec:1667
    axn: AXN:06E9.UNCLASSIFIED.🌒🧱🧱♍🦅↗️
    exact: 'Owed: Isḥāq at the hinge lemmas'
    located_in: text
  body: M
  bears_on:
  - claim:th-1583-hinge
  instrument: 'collation of Isḥāq ibn Ḥunayn''s version at the four openings of #1595, through Alon 1985'
  read_first:
  - rec:1595
  - rec:1667
  how_to_ask: 'Ask: at ἄρτιος ὁ λόγος, λόγου δεῖται πλείονος, οὐ γὰρ ὅ γε τῶν ἀστρολόγων and ἐπεισοδιῶδες, what does the Arabic read? The Arabic
    already breaks the tie at the axiom (#1595).'
  how_a_machine_investigates: The machine locates an open copy of Alon's edition or of the Arabic text, aligns the four lemmas, and reports each
    reading.
  advances_if: the Arabic carries the hinge's demands as the Greek does
  retreats_if: the Arabic diverges at the joins in order or wording
  status: acquisition pending
  commons: Alon 1985 is declared outside the commons until an open copy is found
  consequence:
    if_advances:
      moves:
      - claim:th-1583-hinge
      effect: a second tradition carries the hinge
    if_retreats:
      moves:
      - claim:th-1583-hinge
      effect: qualifies the hinge's scope to the Greek order; a divergence that rebuts the order travels to claim:sy-1658-maker
    unchanged:
    - claim:th-1588-uncounted
    - claim:se-1603-provenance
- id: Q6-attestation-ledger
  question: Is there an attestation of the four as distinct authors of the divided corpus independent of the corpus's own tradition?
  posed_in:
    record: rec:1658
    axn: AXN:06E0.GENERATIVE.🔙🧬🔖👈🟢🤲
    exact: every other attestation of persons is text of the same tradition
    located_in: description
  body: M
  bears_on:
  - fw:many-maker
  - claim:sy-1658-maker
  instrument: 'the ledger of external attestations begun in #1658, continued through the seats of #1580, #1591, #1730 and #1732'
  read_first:
  - rec:1658
  - rec:1582
  - rec:1733
  how_to_ask: 'Ask: name one witness, inscription, papyrus or document, outside the school''s channel, that attributes a work of the corpus to
    Plato, Aristotle or Theophrastus as a distinct maker. Read #1658''s ledger and #1582 first.'
  how_a_machine_investigates: The machine lists every candidate with its channel of transmission and its date, sorts each into independent or
    through the tradition, and adds it to the ledger.
  advances_if: the ledger closes with no independent attestation dividing the corpus by maker
  retreats_if: an independent attestation divides the corpus by maker; under R3 it locates a dependency, and its direction and independence are
    then stated in their own columns
  status: begun
  commons: open
  consequence:
    if_advances:
      moves:
      - fw:many-maker
      effect: the rival stays without an independent attestation on body M; absence establishes nothing of one maker
    if_retreats:
      moves:
      - fw:many-maker
      - claim:sy-1658-maker
      effect: the rival gains a located dependency on body M; once its direction and independence are filled (R3) it rebuts the production model's
        establishment
    unchanged:
    - the reception history (#1733), which stands whatever the authorship
- id: Q7-comparator
  question: Is there a documented succession of distinct persons producing a corpus unified to this degree?
  posed_in:
    record: rec:1733
    axn: AXN:0BE7.GENERATIVE.🌾🔓🔝🕗🟣🗡️
    exact: The reading owes a comparator, a documented succession of distinct persons producing a corpus unified to this degree (design §4.4),
      and none has been named.
    located_in: text
  body: R
  bears_on:
  - fw:many-maker
  instrument: 'a search of documented corpora, with the controls of the authorship register (#1570): the Attic orators (#1564), Herodotus and
    Thucydides (#1563), Aquinas (#1565)'
  read_first:
  - rec:1733
  - rec:1564
  - rec:1570
  how_to_ask: 'Ask: which documented succession of distinct persons (teacher and pupils, a school) produced a corpus as unified as the one under
    these four names, by what measure? #1564 holds a documented master-student pair for calibration.'
  how_a_machine_investigates: The machine proposes candidates, states the documentation of each succession, and measures unity with the register's
    instruments against the four-name corpus.
  advances_if: none is named after a stated search
  retreats_if: one is named and measured; the received reading gains the comparator it owes
  status: owed
  commons: open
  consequence:
    if_advances:
      moves:
      - fw:many-maker
      effect: the rival's comparator stays owed
    if_retreats:
      moves:
      - fw:many-maker
      effect: the rival gains the comparator it owes and is argued on that point
    unchanged:
    - claim:sy-1658-maker's establishment, whose grounds a comparator does not touch
- id: Q8-dependency-columns
  question: Are the catalogue, the biography and the chronology independent witnesses, or derived from the same textual features?
  posed_in:
    record: rec:1602
    axn: AXN:0692.UNCLASSIFIED.♆🕔🌈📚⭐👇
    exact: COLUMN C, evidence excluding an independently transmitted source, which will usually be empty
    located_in: description
  body: M
  bears_on:
  - fw:many-maker
  - claim:mx-1602-question
  instrument: Locating the Dependencies (#1602), three columns kept apart
  read_first:
  - rec:1602
  - rec:1605
  - rec:1581
  how_to_ask: 'Ask: for each correspondence between a catalogue entry, an anecdote and a developmental date, what evidence gives the direction,
    and what excludes an independent source? Read #1602 and its two cases first.'
  how_a_machine_investigates: The machine fills columns A, B and C for each located dependency from the seats, leaves unresolved directions visible,
    and reports the count established, located and against.
  advances_if: dependencies are established with direction and exclusion, so the tradition's witnesses count as one
  retreats_if: Column B returns direction from the witness to the text, as the aconite case returned direction against the author (#1605 §37),
    or an independently transmitted source is shown, which defeats Column C; the witness then stands on its own
  status: two cases run
  commons: open
  consequence:
    if_advances:
      moves:
      - fw:many-maker
      effect: the tradition's witnesses count as one derived witness on body M
    if_retreats:
      moves:
      - fw:many-maker
      effect: the witness stands as independent on body M and warrants the rival there
    unchanged:
    - claim:sy-1658-maker's establishment
- id: Q9-subject-dependence
  question: Is the recovery of the names under supervision a function of subject?
  posed_in:
    record: rec:1593
    axn: AXN:0686.OPERATIVE.🔥🌉◇👆⭐🤙
    exact: suggestive of subject dependence, not a demonstration of it
    located_in: description
  body: S
  bears_on:
  - claim:th-1593-supervised
  - fw:many-maker
  instrument: 'a matched-removal design at larger draw, with operation held constant, after #1593'
  read_first:
  - rec:1593
  - rec:1586
  how_to_ask: 'Ask: with operation held constant, does name recovery fall to the null when subject is controlled? #1593''s 120-draw test places
    the 0.564 in the lower 15% of equivalent removals.'
  how_a_machine_investigates: The machine reruns the matched-removal test at higher draw and with operation held constant, and reports the distribution.
  advances_if: name recovery falls to the null when subject and operation are held constant
  retreats_if: the names stay recoverable with subject and operation held constant; under R2 this identifies no maker, and it would locate a hand-level
    signal the operation axis does not explain
  status: suggestive
  commons: open
  consequence:
    if_advances:
      moves:
      - claim:th-1593-supervised
      effect: name recovery is a function of subject; the rival loses its stylometric signal
    if_retreats:
      moves:
      - claim:th-1586-axis
      effect: 'qualifies the axis''s scope: a hand-level signal the operation axis does not explain'
    unchanged:
    - 'claim:sy-1658-maker (R2: the signal identifies no maker)'
- id: Q10-ross-apparatus
  question: What does Ross's apparatus give at SE 183b34–184b8?
  posed_in:
    record: rec:1603
    axn: AXN:0693.UNCLASSIFIED.🎹🎶☽⏪💡☿
    exact: 'Still open there: Ross''s apparatus'
    located_in: text
  body: M
  bears_on:
  - claim:se-1603-provenance
  instrument: collation of Ross's Oxford text (1958) at the epilogue
  read_first:
  - rec:1603
  - rec:1574
  how_to_ask: 'Ask: does Ross print ἄλλο at 184b1 and any variant at 183b34–36? Bekker 1831 prints ἄλλο with no variant (#1603).'
  how_a_machine_investigates: The machine reports Ross's text and apparatus from a lawful copy.
  advances_if: the apparatus confirms the reading seated from Bekker
  retreats_if: a variant at the clause unsettles the first-person εἴχομεν reading
  status: declared
  commons: Ross 1958 is in copyright and declared outside the commons
  consequence:
    if_advances:
      moves:
      - claim:se-1603-provenance
      effect: the reading seated from Bekker is confirmed by the apparatus
    if_retreats:
      moves:
      - claim:se-1603-provenance
      - claim:sy-1658-maker
      effect: the provenance claim retreats, and its failure travels to the production model along the generalizes edge (establishment)
    unchanged:
    - claim:th-1588-uncounted
    - claim:th-1583-hinge
