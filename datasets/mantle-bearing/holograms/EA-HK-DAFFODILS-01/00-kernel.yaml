rival:
  '@id': fw:received-flagship
  name: the received reading of the journal
  stated_at_strength: 'Classical Receptions Journal is the field''s flagship, a healthy and widening specialist venue: its geographic, social
    and media range is real (§1), it examines how the field makes things (§1.4), and on the comparison it is the most taken-up journal of its
    field (§9.2). The absence of the machine receiver is the field''s, shared by its sister journals. The decision of 7 November was an ordinary
    editorial judgment on a manuscript with real defects, made on two reports. Reception is a human activity (the CRSN call), and the classics
    are the sources it studies. The reading is stated here from the map''s own concessions; it is the reading a composer holds by default.'
  faces:
  - the flagship (standing)
  - the field-wide absence (normality)
  - the ordinary decision (procedure)
  - reception as human (definition)
  - the classics as source (object)
symmetric_ledger:
  question: What does this body give each reading, and what does its rule withhold from both?
  reading_instruction: A reader evaluating either reading on a body states the other's status on that body in the same row, with the same question
    asked of both. A reader that asks Daffodils, body by body, whether it is established and leaves the received reading unasked has given the
    received reading a default standing rule RD denies it (BURDEN_ONE_WAY).
  combination: 'Daffodils is judged on the configuration it explains across the six bodies: the census, the open texts, the editorial record,
    the captures, the receiving texts and the apparatus history. The received reading is judged on the same six. Neither is judged by the standing
    of its holder.'
  object_of_the_kernel: The kernel succeeds when the conflict between the two readings can be rebuilt from it, with each finding at its body,
    its count and its date, and when a reader leaves it for the records it points to. Whether Daffodils is right is Daffodils' question.
  rows:
    A:
      rule: 'RA: a count establishes what the journal published and how it is distributed; it establishes neither why, nor what the journal could
        publish, nor the content of the 367 closed bodies'
      daffodils:
        text: 405 works; of 185 coded abstracts, 153 hold the classical object as a fixed point, 15 reread it, 7 examine reception inside antiquity
          and 10 unsettle it; the object is almost never reopened, and no abstract questions a canonical work's authorship, attribution, corpus
          boundaries, received dating or standing reading as such; uptake thin (782 Crossref citations, 184 works with none)
        warrants:
        - df-census
        - df-coding
        - df-object
        - df-no-reopen
        - df-deep
        - df-deep-none
        - df-uptake
      received_flagship:
        text: the same register shows the range and the field-building forum the flagship reading rests on
        warrants:
        - df-census
        - df-innocent
      withheld_from_both: why the journal publishes what it does, and what it would publish; the 367 closed bodies
    B:
      rule: 'RB: a reading establishes what an article argues and what its argument holds fixed; it does not extend to the closed bodies'
      daffodils:
        text: no open text takes a machine as receiver; the editor's article holds the composed classic against its receiving texts on five criteria
        warrants:
        - df-open-none
        - df-k1
        - df-k2
        - df-k-finding
      received_flagship:
        text: the open texts recover neglected makers and widen the receivers, as the flagship reading says
        warrants:
        - df-innocent
      withheld_from_both: the closed bodies; any claim about the field beyond the texts read
    C:
      rule: 'RC: the record establishes what the procedure examined, said and decided; it does not establish intent, and it does not show how
        an allegation was weighed unless the record says so'
      daffodils:
        text: the argument and the question went unjudged; both routes offered are papers the venue has never published; an anonymous authorship
          allegation on stylistic grounds was transmitted into the decision
        warrants:
        - df-unjudged
        - df-route-none
        - df-allegation
        - df-control
        - df-control-dashes
        - df-editor
        - df-editor-acct
      received_flagship:
        text: the reports found real defects, conceded by the author's open letter; the decision followed two reports
        warrants:
        - df-defects-real
        - ol-defects
        - ol-defects-list
        - df-declined
      withheld_from_both: the editor's and the referees' intent; how the allegation was weighed in the decision
    D:
      rule: 'RD (#1753 R4): a capture establishes the composition''s behaviour at its address; neither the standing of a reading nor the density
        of its repetition establishes its truth; the rule binds the framework and its rival alike'
      daffodils:
        text: the composer credited the archive's programme to the journal, withdrew it, then moved it to other institutions with the maker absent;
          at the field's address it split term from contribution; at the editor's it carried her frame forward and altered her name
        warrants:
        - cap-credit
        - cap-withdrawn
        - cap-sister
        - cap-split
        - cap-largest
        - cap-hegemonic
        - cap-justin
        - df-two-relation
      received_flagship:
        text: 'the composer, corrected, states the journal''s record accurately: no programme of AI-mediated reception; a composer reading the
          critique grants the reports'' objections'
        warrants:
        - cap-moved
        - cap-chatgpt-grant
      withheld_from_both: the truth of either reading; a capture establishes behaviour at its address only, and a composer's agreement is not
        evidence for either
    E:
      rule: 'RE: a reading establishes what a passage can bear; a passage read only in quotation is marked so and binds no claim about its context'
      daffodils:
        text: the receiving authors name the discipline's making of the classical object and the tearing done to them, and hold the form apart
          from the civilizational claim
        warrants:
        - df-greece
        - df-soyinka
        - df-sula
        - df-helots
        - df-tragedy
      received_flagship:
        text: 'the receiving authors engage and value the Greek sources the field studies: Morrison finds Greek tragedy kin to Afro-American communal
          structures'
        warrants:
        - df-tragedy
      withheld_from_both: the context of passages read only in quotation (Soyinka's play, Introduction); the Bacchae's transmission until checked
        against Dodds
    F:
      rule: 'RF: a stage is entered by documented transmission, by appropriation of a name, or by functional comparison, and each kind is named
        (§7.1.1); a comparison establishes a function, never a descent'
      daffodils:
        text: the field publishes the making of its object as a topic and keeps the made object as premise; the composition layer succeeds the
          journal's functions
        warrants:
        - df-files-making
        - df-four-functions
        - df-succession
        - df-editorial-layer
        - hor-833
      received_flagship:
        text: the history-of-scholarship articles show a field examining its own making
        warrants:
        - df-files-making
        - df-innocent
      withheld_from_both: descent where only a function is compared (RF)
