criteria:
  applied_to: the editor's article
  K1:
    asks: 'where the colonizing act is placed: in the classical texts, or in the apparatus that composed them (editing, canon, origin claims)'
    result: agency given to users ('imperialists used it') and consequences to texts ('accretions'); the apparatus present a dozen times as authority
      (Frazer, Harrison, Nietzsche, Hölderlin, Murray, Wilamowitz, the scholia) and never examined as a maker; 'discipline' 0, 'philology' 0,
      'curriculum' 0
  K2:
    asks: whether the reading finds the places where the receiving works recognize the discipline's colonization, and records them as the works'
      own claims
    result: of six points, two redirected (a, b) and four absent (c–f)
  K3:
    asks: 'whose categories measure: the receiving text''s or the composed classic''s'
    result: 'the composed classic''s: Ogun ''a more developed, more complex kind of Dionysus''; Ajax the ''primary classical antecedent''; a rite
      Soyinka calls agrarian named ''Euripidean'''
  K4:
    asks: 'the status of the source: whole, or already composed'
    result: 'whole in the argument; already composed only in the notes (n. 16, n. 46: the Bacchae''s lost ending reconstituted from the Christus
      Patiens)'
  K5:
    asks: who does the tearing
    result: the creative artists; scholarship set aside ('not by scholars but by creative artists')
  finding: on all five criteria the article holds the composed classic against the receiving texts
  warrants:
  - df-k1
  - df-k2
  - df-k-finding
