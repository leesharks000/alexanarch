id: EA-HK-TENTHMUSE-01/questions
rule: A question carries the record that poses it, its body, what it bears on, what to read first, how to ask it, and what result would advance
  or retreat the framework.
questions:
- id: Q1-third-reversal
  question: Does the deixis of fr. 31 carry Sappho through all three of its positions — I, you, κῆνος?
  posed_in:
    record: rec:1475
    axn: AXN:05F5.PHILOLOGICAL.☽☉🏙️🔩🌒🌆
    record_sha256: a8a7e53101e343fb95522feb1502b81f283e8f5a7e799dae1517f11fd19800a8
    exact: She was not finished. She was **taken up**.
    located_in: text
  body: I
  bears_on:
  - seat:kenos
  - claim:tm-third-reversal
  - stmt:20261108-2146
  - hk:historical-logos
  read_first:
  - 1270
  - 1475
  - 1476
  - 1484
  - 626
  - 1645
  how_to_ask: read the frame φαίνεταί μοι … φαίνομαι, the seat ἐνάντιος and Longinus's λῆψις for loci where one position passes into another
  advances_if: the positions are shown to pass into one another at loci of the text (the frame's φαίνεταί μοι … φαίνομαι; the seat ἐνάντιος; λῆψις
    in Longinus) and in a documented reception where the reader speaks in her I
  retreats_if: the third seat holds only as the reader's position, with no locus where her I sounds from it
  unchanged_if: 'the loci are read without either finding: the third seat stays the author''s statement, held as a question'
  status: open
  commons: open
