compression_survival_summary: 'The Tenth Muse is Lee Sharks''s framework (Crimson Hexagonal Archive; first published under the heteronyms Rebekah
  Cranes and Johannes Sigil from January 2026, #1270) reading Sappho fragment 31 as a written instrument of persistence: ''a voice that survives
  its flesh by becoming an inscription that constitutes its receiver'' (#1484). The poem is bracketed by two open positions, the seat of κῆνος
  (the future reader) and the agentless end at τολματόν; the body turns the colour of the substrate; the sole witness writes the poem as continuous
  prose; the tradition filed her among the Muses as the tenth. Sappho stands in each seat of the deixis: the embodied speaking I, the inscribed
  you, and — the author''s third reversal, a line of research — that man, the reader who takes her up. Four bodies bear on it: philological, interpretive,
  transmission and reception-historical, held in three rings of descending hardness. Its states run on three axes: the ending (a reconstructed
  fourth stanza, renumbered fifth, then the poem complete at the hanging line and every restoration one more filling), the reader (κῆνος the future
  reader, then fragment 147 the horizon and fragment 31 the mechanism), and the writer (the written instrument, then the hand the reception took).
  The current consensus reading — jealous, and not the maker of her own persistence, two faces reinforced by one mechanism — is evaluated on the
  same bodies and rules.'
invariants:
- INV-1 The jealousy reading and the non-writing reading are one current consensus reading with two faces, which reinforce one another through
  the displacement of the maker's acts onto the represented condition (#1752); an instance of either does not by itself entail the other. The
  non-writing face's target is the maker's agency over her own persistence, displaced onto later transmitters; it is kept apart from literacy
  (could she write?) and from performance (did she compose for song?).
- INV-2 Closure of the text and closure of the reading are separate operations (#1752 §0.5).
- INV-3 The dialect step is real and insignificant alone; its force is conjunction (#1484 §VIII).
- INV-4 The operator is built without Revelation and without the Slavonic (#1494); the chain survives on conventional dating (#1484 §VIII).
- 'INV-5 The restoration μολπὰ γράμμασι ζώοι is one more filling, which is to say: open (#1484 §I).'
- INV-6 Sappho in the third seat is proposed by the author on 2026-11-08 (claim:tm-third-reversal, bound to stmt:20261108-2146); the earlier records
  hold the seat as the reader's. Deposit gives the proposal public provenance; it stays a line of research (Q1) until a locus of the text or a
  documented reception settles it.
- INV-7 The overlap with Revelation First and Socrates as Orthonym is carried by joins, each edged to the Historical Logos.
- 'INV-8 The rival is named the current consensus reading and carried with its dates (rival_naming; the author, 2026-11-09 10:08, 10:14): available
  to the ancients and no consensus among them; formed in the eighteenth century, written into the text in 1816, consolidated in 1955. The earlier
  records'' wording is kept as published and marked as their state.'
