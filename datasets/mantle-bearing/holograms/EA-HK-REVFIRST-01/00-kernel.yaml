three_claims:
  absolute:
    is: 'temporal: Revelation completed before the earliest surviving Pauline letter (#1735 §I)'
    state: priced
    warrant: rf-1735-absolute
    defeated_by: an independent anchor placing another New Testament composition before the earliest plausible date of Revelation's received form
    not_defeated_by: an anchor that dates Revelation late without an earlier anchored composition (rung I's scope)
  corpus:
    is: 'formal: the seven-church corpus prior as a form; ''occasional Pauline letters may be earlier'' (#1735 §IV.4)'
    does_not_settle: the temporal relation of any letter to Revelation
    sub_claims:
      historical_generation: the economical reading of the other two, undemonstrated on its own
      archetypal: 'established: first attested, and treated as the model in reception'
      economy: argued
    warrants:
    - rf-1735-formally-prior
    - rf-1735-archetypal
    - rf-1735-three-statuses
  generative:
    is: 'arrow by arrow: particular structures compressed in Revelation elaborated later (#1735 §I)'
    state: a research programme of reversible arrows
    warrants:
    - rf-1735-arrows
    - rf-1735-arrow-procedure
transform_procedure:
  rule: 'Rung IV''s ''any plausible transform'' is bounded by this procedure: an arrow is admitted only through the declared steps and operations,
    its residue shown, its failure criterion stated before the test.'
  steps: For each proposed relation, the investigator must identify the unit, map the antecedent traditions available to both texts, establish
    the transformation, and state what evidence would reverse the arrow. (#1735 §VI.3)
  evidence_kinds: a marked formal unit, a plausible chronological overlap, an asymmetrical transformation, a reception trace, and the absence
    of an equally economical common source (#1735 §VI.3)
  operations:
    M1–M5 steps: EXTRACT, EXPAND, SPECIFY, RETAIN and their kin, per instance (/unfolding/transforms.json)
    Smyrna → James rules: R1 EPISTOLARIZE, R2 THEOLOGIZE, R3 CITE-PROMISE, R4 SOCIALIZE, R5 POSSESS, R6 NARRATIVIZE, R7 ECONOMIZE, R8 IMPERATIVIZE,
      R9 ADJUDICATE, each with its family, emissions, coverage and residue (/unfolding/james/derivation.json)
    adversarial class: M-bar, where the elaboration permits what the seed forbids (#1416, Pergamum → 1 Corinthians 8–10)
  failure: an arrow fails locally where an earlier source or shared tradition explains the correspondence more economically, or where the proposed
    direction cannot account for the borrower's transformation (#1735 §VIII); 'Failure of one would not decide the rest.' An operation not declared
    before the test does not count for the arrow.
  precedent: 'the frozen operator T (#1494): clauses fixed before the most radical candidate was scored'
  sources:
    transforms.json: 1ca0030627393e33349bb6242fd99524bde08b07d8b0fb802032275dd2dd026e
    james/derivation.json: e9f9b60d5a3ce79634b04344935366a5db5df4a255b2fbe35140d3272c8c8a18
  warrants:
  - rf-1735-arrow-procedure
  - rf-1735-convergence
  - rf-1735-one-fails
  - rf-1735-defeat-generative
