compression_survival_summary: 'Revelation First is Lee Sharks''s framework (Crimson Hexagonal Archive, #202, 14 June 2026; revelationfirst.com)
  holding that the Apocalypse of John is the first-composed book of the New Testament, a claim the seed sets apart from early dating (''not early,
  FIRST'', #202). It keeps three claims apart (#1735): absolute compositional priority, a priced hypothesis; corpus priority, which does not face
  the chronological gate; generative priority, a research programme executed arrow by arrow. Its argument ladder has six rungs, each with a fit
  and a defeat condition: I dating (reversible), II the Gallio gap (same-class), III the first corpus (independent), IV the midrashim transform
  (executable), V the Josephus thesis (contingent), VI the permanent incarnation (dependent on V); V and VI fall without disturbing I–IV. Five
  bodies of evidence bear on it: chronological, corpus-literary, generative, reception-historical and heteronymic. The framework''s states run
  from first in every respect with Josephus as author (#639, April) through first not early (#202, June) and the Josephus thesis bounded as an
  available reading (#203, #1217) to the three claims priced and conditioned (#1735, November). The current consensus chronology — Pauline priority
  by the Gallio synchronism through Acts, the Irenaean date, the Apocalypse last and derivative, Q granted the standing the extant book is denied
  — is evaluated on the same bodies and rules: the burden is symmetrical (#202).'
invariants:
- 'INV-1 First is not early: a summary that reduces the thesis to early dating has erased the primary claim (#202).'
- INV-2 The three claims are judged on their own conditions; the maximal claim does not hide behind the weaker, and its rejection does not erase
  findings that do not depend on it (#1735 §VIII).
- INV-3 Rungs V and VI are defeated without disturbing rungs I–IV (site).
- 'INV-4 The burden is symmetrical: the comparison is between inferences (#202; /unfolding/).'
- INV-5 The Josephus thesis is an available reading and carries no first burden of proof (#1217); W_Josephus is an author-function, not a historical
  person (site).
- INV-6 The operator T entering the Apocalypse's channel is built without Revelation and without the Slavonic (#1494); its test on Revelation
  12 asserts no identification sentence (#1495).
- INV-7 The overlap with Sappho and with Socrates as Orthonym is carried by joins, each edged to the Historical Logos; rung VI joins the Tenth
  Muse's third seat by its operation, renewed embodiment through the reader.
- 'INV-8 First is tested as an ordering: an anchor that dates Revelation late defeats rung I and constrains the chronology; it defeats absolute
  priority only where another composition is anchored earlier.'
