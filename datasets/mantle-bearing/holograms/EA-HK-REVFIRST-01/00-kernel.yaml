  reading_instruction: 'A reader reconstructing a record''s argument reads its moves in 04-arguments.jsonl in order with their edges: data and
    counts support inferences and findings; prices, rivals, replies and defeat conditions stand beside the claims they bear on; hypotheses and
    states keep the strength the record gives them. Each quotation is verbatim, bound to the record''s hash.'
