  - rival
  - reply
  - defeat
  - hypothesis
  - state
  relations:
    supports: the move is evidence or ground for its target
    infers_from: the move is concluded from its target
    answers: a reply to a rival position
    prices: a cost the record names against its own target claim
    defeats_if: a stated condition under which the target falls
    applies: the move applies a method or test to its target
    qualifies: the move limits or grades its target
    bounds: the move sets the strength or scope of its target, leaving it held
    develops: the move extends its target
    revises: the move replaces its target in a later state of the record or of the archive
  quotations_stale_at_build: []
