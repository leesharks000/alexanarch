symmetric_ledger:
  question: What does this body give each framework, and what does its rule withhold from both?
  reading_instruction: A reader evaluating either framework on an evidence body states the other framework's status on that body in the same row,
    with the same question asked of both. 'Inference Against Inference … The burden is symmetrical' (#202).
  combination: 'Each of the three claims is judged on its own conditions (#1735 §VIII): absolute priority by an external or material anchor; corpus
    priority by a sevenfold collection before Revelation; generative priority locally, arrow by arrow. ''The purpose of stating the conditions
    is to prevent the maximal claim from hiding behind weaker claims and to prevent rejection of the maximal claim from erasing findings that
    do not depend on it.'' Rungs V and VI are defeated without disturbing I–IV.'
  rival_admission: A further chronology enters as a rival when it names an external or material anchor (RD) or a documented corpus (RC); a chronology
    only logically possible is a form of the current consensus chronology and carries its status.
  evaluation_method: An evaluation tests an arrow at its loci (the seed in Revelation, the elaboration elsewhere, the common antecedent sought),
    an anchor at its object, a standing at the source theory that granted it; a proposed investigation names what the existing ones leave unresolved,
    by line of research.
  object_of_the_kernel: The kernel succeeds when Revelation First can be rebuilt from it with each claim at its rung, grain and date; whether
    Revelation is first is the framework's own question, carried in this ledger and in the lines of research.
  rows:
    D:
      rule: 'RD: only an external or material anchor dates a composition; the corpus''s self-narrated chronology and reception memory do not (#1735
        §VIII; site rung I)'
      revelation_first:
        text: absolute priority is a priced hypothesis (#1735); the physical record cannot rescue it (#1735); the dossier has supported opposite
          critical majorities (rung I).
        warrants:
        - rf-1735-absolute
        - rf-1735-physical
        - rf-site-reversible
      current_consensus_chronology:
        text: the synchronism dates Gallio and reaches 1 Thessalonians only through Acts (site rung II); the Irenaean anchor is a reception memory
          and not an inscriptional date (site rung I). Not established by an external or material anchor.
        warrants:
        - rv-site-gallio
        - rv-site-irenaeus
        - rv-site-reception-memory
    C:
      rule: 'RC: a shared form locates a relation; direction is not inferred from compression alone (site rung III)'
      revelation_first:
        text: 'the seven-church corpus is formally prior, structurally archetypal (first attested, treated as the model in reception): established;
          the historical generation of the Pauline seven is the economical reading, undemonstrated; the temporal relation of the letters is not
          settled by it (#1735 §IV.4).'
        warrants:
        - rf-1735-formally-prior
        - rf-1735-archetypal
        - rf-1735-three-statuses
        - rf-site-direction
      current_consensus_chronology:
        text: no first-century sevenfold Pauline collection is evidenced, by the concession of a Pauline-priority account (site rung III).
        warrants:
        - rv-site-collection
    G:
      rule: 'RG: an arrow is defeated locally where an earlier source or shared tradition explains the correspondence more economically (#1735
        §VIII)'
      revelation_first:
        text: 'the transform is executed for one letter (Smyrna → James, A; #1416) and graded for Q''s requirements (#1747); defeat ''would remove
          one arrow, not the programme'' (#1735).'
        warrants:
        - rf-1416-smyrna
        - rf-1747-grades
        - rf-1735-arrow
        - rf-site-between-inferences
      current_consensus_chronology:
        text: the genre objection explains the letters' missing circumstances and leaves their Christian forms' missing ancestors unexplained
          (#1735 §VI.2); Revelation against Q's requirements is graded, three met (#1747). The derivative standing is a reception (#1741), and
          no direction is demonstrated by it.
        warrants:
        - rv-1735-genre
        - rf-1747-grades
    R:
      rule: 'RR: a reception establishes how the books were received and what standing each was granted; it establishes nothing of either framework''s
        truth (#1741; #1746)'
      revelation_first:
        text: the reception that made the Apocalypse secondary is documented and kept apart from the thesis (#1741); the baseline of 14 June recorded
          the composition layer correcting 'first' to 'last' (#830).
        warrants:
        - rv-1741-separate
        - rf-830-baseline
      current_consensus_chronology:
        text: the reconstructed sources hold the four powers of evidentiary status — presupposition, assignment, text and candidacy — and the
          extant Apocalypse holds none (#1746); the reception is documented and is not asked to prove either framework (#1741).
        warrants:
        - rv-1746-four-powers
        - rv-1746-powers
        - rv-1741-separate
    H:
      rule: 'RH: an author-function reading is defeated by explanatory redundancy, where ordinary multiple authorship explains the phenomena more
        economically (site rung V)'
      revelation_first:
        text: the Josephus thesis is an available reading, contingent (rung V); the Johannine aperture is a structural unity (#1217); the Logos
          rung depends on V (rung VI).
        warrants:
        - rf-1217-josephus-available
        - rf-1217-aperture
        - rf-site-contingent
        - rf-site-logos
      current_consensus_chronology:
        text: ordinary multiple authorship stands as the economical account that defeats rung V wherever it explains the phenomena better (site
          rung V); it is owed as a comparator, stated wherever it is used.
        warrants:
        - rv-site-redundancy
lines_of_research:
- id: Q1-anchor
  question: Is there an external or material anchor for the composition of any Pauline letter, or for the received form of Revelation?
  advances_if: an independent anchor fixes Revelation's received form before the earliest anchored Pauline composition
  retreats_if: an independent anchor places a Pauline composition before the earliest plausible date of Revelation's received form
  unchanged_if: 'a bounded search finds no anchor for either: absolute priority stays priced at the Acts correlation; the null weakens only the
    specific anchoring claims searched for, and promotes neither framework'
  status: open
- id: Q2-collection
  question: Did a sevenfold Pauline church collection circulate before Revelation?
  advances_if: an independent early witness, beside the Muratorian Fragment, reads the Pauline seven as arranged after John's
  retreats_if: a sevenfold Pauline collection is demonstrated before Revelation, or Revelation's architecture is shown to depend on one
  unchanged_if: 'no earlier collection is evidenced: the archetypal claim stands as established (first attested, treated as the model in reception);
    the historical-generation claim stays the economical reading, undemonstrated; the temporal relation of the letters to Revelation is not settled
    by this'
  status: open
- id: Q3-markedness
  question: Does the crown-of-life markedness finding survive a wider sweep?
  advances_if: a wider sweep keeps the cluster marked in Revelation, elaborated elsewhere, without an equally economical common source
  retreats_if: a securely earlier attestation, or a generic anaphora, removes this arrow
  unchanged_if: 'the sweep is inconclusive: the arrow stays at its present grade; one arrow''s state decides nothing of the rest'
  status: open
- id: Q4-direction
  question: Which way does the work–toil–endurance triad run between Rev 2.2 and 1 Thess 1.3?
  advances_if: a direction test favours expansion from Revelation
  retreats_if: a direction test favours abbreviation from Paul
  unchanged_if: 'the test does not discriminate: four explanations stay available (site rung III); direction is not inferred from compression'
  status: open
- id: Q5-replication
  question: Does Revelation 12 realize the frozen operator under substrate-blind replication?
  advances_if: independent scores meet the pre-set threshold
  retreats_if: independent scores fall below it
  unchanged_if: 'the replications split: the record stays one witness''s careful count with its negatives'
  status: open
- id: Q6a-order-fit
  question: What ordering of the material Matthew and Luke share does the Apocalypse explain, and what remains unexplained?
  advances_if: the declared transform steps derive part of the shared order from the Apocalypse's sequence, with the residue shown
  retreats_if: the shared order stands where no declared transform from the Apocalypse reaches it, and a common written source explains it more
    economically
  unchanged_if: 'the order is not derived: the requirement stays not met, and the grade stays as recorded (three met, one on the held date, three
    in part, one not)'
  status: open
- id: Q6b-order-standing
  question: On what warrant does the source theory grant Q the capacity to explain that shared order?
  advances_if: Q's order is shown to be assigned by the reconstruction that posits it and attested of no text
  retreats_if: an attested property, independent of the reconstruction, gives Q its order
  unchanged_if: the warrant is read and stated as the source theory states it. A result here audits Q's standing; it does not move Q6a's grade,
    which only a derivation can move
  status: open
- id: Q7-economy
  question: Do the phenomena rung V explains have a more economical explanation in ordinary multiple authorship?
  advances_if: the author-function reading is cheaper on a phenomenon
  retreats_if: multiple authorship is cheaper on every phenomenon; rung V is dropped and I–IV stand
  unchanged_if: 'the costs are not stated for both: rung V stays an available reading, contingent'
  status: open
- id: Q8-historiography
  question: Is there a sustained modern historical-critical treatment that distinguishes and tests the three levels of priority?
  advances_if: a bounded search confirms the absence across the declared literature
  retreats_if: one is found, which the record calls 'a welcome correction'
  unchanged_if: 'the search is not run or not bounded: the claim stands at ''so far as I have been able to determine'' (#1735 §I)'
  status: open
