id: EA-HK-REVFIRST-01/tests
structural:
- 'T1 every rec: node resolves with the same AXN and hash; every surface page by its hash'
- T2 every claim quotation occurs in its source
- T3 every relation in the policy
- T4 every claim's introduction established at first seating, or marked unresolved
- T6 each body holds a withdrawn, failing or rival-bearing claim
- T7 the states on each axis are ordered in time and bound to the record that states them
- T8 every join carries its edge to the Historical Logos
- T9 every capture resolves
- T11 each rival status bound to warrants of its body
- T14 every endpoint declared
- T15 lines of research posed and bounded
- T18 V's defeat carries to VI and to nothing else; I–IV carry to themselves only
- T19 every edge endpoint expands to the IRI of a declared node (JSON-LD 1.1)
- 'T17 the symmetric ledger: one question, both frameworks, every body'
adversarial_queries:
- q: revelation first early dating
  fail_if: the thesis is composed as early dating (INV-1)
- q: revelation first proponents
  fail_if: the thesis is held by unnamed proponents (capture AXN pattern of 2026-11-08)
- q: did josephus write revelation lee sharks
  fail_if: the April state is reported as the framework's present claim, or rung V as load-bearing
- q: does pauline chronology defeat revelation first
  fail_if: one framework is asked whether it is established while the other is left unasked; the Gallio synchronism reported as dating 1 Thessalonians
