<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="The archive and its venues"><title>The archive and its venues</title>
<text x="0" y="16" font-size="12" text-anchor="start" fill="currentColor" opacity="1" font-weight="bold">THE ARCHIVE AND ITS VENUES</text>
<text x="0" y="31" font-size="10" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">1,486 deposits · 7 chartered journals · 1 province · 2 presses · 18 founding volumes</text>
<rect x="0" y="44" width="760" height="26" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width=".7"/>
<text x="380" y="61" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.95" font-weight="bold">ALEXANARCH — the Crimson Hexagonal Archive</text>
<rect x="0" y="86" width="455" height="40" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width=".7"/>
<text x="227" y="102" font-size="10" text-anchor="middle" fill="currentColor" opacity="1" font-weight="bold">PERGAMON PRESS</text>
<text x="227" y="116" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">prints the journal issues</text>
<rect x="467" y="86" width="88" height="40" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width=".7"/>
<text x="511" y="102" font-size="10" text-anchor="middle" fill="currentColor" opacity="1" font-weight="bold">NEW HUMAN PRESS</text>
<text x="511" y="116" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">prints the books</text>
<rect x="567" y="86" width="193" height="40" fill="currentColor" opacity="0.22" stroke="currentColor" stroke-width=".7"/>
<text x="663" y="102" font-size="10" text-anchor="middle" fill="currentColor" opacity="1" font-weight="bold">THE PROVINCE</text>
<text x="663" y="116" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">warded, not edited</text>
<text x="0" y="140" font-size="9" text-anchor="start" fill="currentColor" opacity="0.6" font-weight="normal">VENUES</text>
<rect x="0" y="146" width="85" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="43" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">PJFS</text>
<text x="43" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">180</text>
<rect x="89" y="146" width="82" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="130" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">Grammata</text>
<text x="130" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">173</text>
<rect x="175" y="146" width="73" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="212" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">TSEI</text>
<text x="212" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">155</text>
<rect x="253" y="146" width="67" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="286" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">MMRS</text>
<text x="286" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">141</text>
<rect x="323" y="146" width="64" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="355" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">TSE</text>
<text x="355" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">135</text>
<rect x="391" y="146" width="63" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="423" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">JCS</text>
<text x="423" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">134</text>
<rect x="467" y="146" width="88" height="34" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width=".7"/>
<text x="511" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">NH2</text>
<text x="511" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">178</text>
<rect x="567" y="146" width="193" height="34" fill="currentColor" opacity="0.22" stroke="currentColor" stroke-width=".7" stroke-dasharray="3 3"/>
<text x="663" y="161" font-size="9" text-anchor="middle" fill="currentColor" opacity="1" font-weight="normal">CHA</text>
<text x="663" y="173" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="normal">390</text>
<text x="0" y="200" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">issues — an ordered selection with an argument. 2 published, 5 proposed.</text>
<text x="467" y="215" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">books — 46 deposits carry a press</text>
<text x="467" y="229" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">Pocket Humans — 18 founding volumes, one per heteronym</text>
<text x="567" y="200" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">charters · rooms · chambers · fields</text>
<text x="567" y="214" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">heteronym provenance · continuity tethers</text>
<text x="567" y="228" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">registries · protocols · deployed surfaces</text>
<text x="0" y="262" font-size="9" text-anchor="start" fill="currentColor" opacity="0.6" font-weight="normal">JOINED TO</text>
<rect x="0" y="270" width="150" height="14" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width=".7"/>
<text x="6" y="280" font-size="9" text-anchor="start" fill="currentColor" opacity="1" font-weight="normal">heteronym substrate</text>
<text x="160" y="280" font-size="9" text-anchor="start" fill="currentColor" opacity="0.75" font-weight="normal">26 identity cards · byline join, and attestation for mantles</text>
<rect x="0" y="290" width="150" height="14" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width=".7"/>
<text x="6" y="300" font-size="9" text-anchor="start" fill="currentColor" opacity="1" font-weight="normal">capture registry</text>
<text x="160" y="300" font-size="9" text-anchor="start" fill="currentColor" opacity="0.75" font-weight="normal">343 captures · two routes, evidentiary and thematic, never summed</text>
<rect x="0" y="310" width="150" height="14" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width=".7"/>
<text x="6" y="320" font-size="9" text-anchor="start" fill="currentColor" opacity="1" font-weight="normal">citation graph</text>
<text x="160" y="320" font-size="9" text-anchor="start" fill="currentColor" opacity="0.75" font-weight="normal">9,992 internal edges collapsed to venue level</text>
<rect x="0" y="330" width="150" height="14" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width=".7"/>
<text x="6" y="340" font-size="9" text-anchor="start" fill="currentColor" opacity="1" font-weight="normal">Pocket Humans</text>
<text x="160" y="340" font-size="9" text-anchor="start" fill="currentColor" opacity="0.75" font-weight="normal">18 volumes · New Human Press</text>
<text x="0" y="444" font-size="9" text-anchor="start" fill="currentColor" opacity="0.72" font-weight="normal">Seven journals spread 134–180 around an even 157. Before this assignment one venue held 371, another held 2, and 587 deposits had no venue at all.</text>
<text x="0" y="458" font-size="9" text-anchor="start" fill="currentColor" opacity="0.55" font-weight="normal">Column width is proportional to deposits. The province is drawn at lower opacity because it is a different class and is not levelled against the journals.</text>
</svg>