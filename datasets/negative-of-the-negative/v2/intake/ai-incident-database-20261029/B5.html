    <script nonce="cyg9thtkhU615KY656im5A==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"AI Incidents, Failures &amp; Controversies Database","description":"# ⚠️ AI Incidents, Failures &amp; Controversies Database\n\n### 32 verified incidents · 29 companies · 13 countries · 24 columns — Every major AI failure, documented\n\n---\n\n## 📌 Why This Dataset?\n\nAI incidents surged **56.4% in 2024 alone** (Stanford HAI AI Index 2025). From deepfakes influencing elections to autonomous cars killing pedestrians, AI failures are no longer hypothetical — they're happening at scale.\n\nThis dataset is a **curated, analysis-ready compilation** of the most significant real-world AI incidents, sourced from verified databases and news reports. Every single entry is a real, documented event.\n\n---\n\n## 📊 Data Sources\n\n| Source | What We Used |\n|---|---|\n| **AI Incident Database (incidentdatabase.ai)** | Primary incident records and AIID identifiers |\n| **MIT AI Incident Tracker (airisk.mit.edu)** | Severity classifications, harm taxonomies |\n| **Stanford HAI AI Index 2025** | Incident trend data and statistics |\n| **AIAAIC Repository** | Cross-verification of incidents |\n| **Verified News Reports** | CNN, Reuters, BBC, NYT, SCMP, TechCrunch |\n\n---\n\n## 📋 Column Descriptions (24 columns)\n\n| Column | Type | Description |\n|---|---|---|\n| `incident_id` | str | AIID reference ID or custom ID |\n| `date` | date | Date of incident or public disclosure |\n| `year` / `month` / `quarter` | int | Time dimensions |\n| `title` | str | Descriptive incident title |\n| `company` | str | Company/organization involved |\n| `ai_system_type` | str | Type of AI system (LLM, Autonomous Vehicle, etc.) |\n| `harm_category` | str | Specific harm type |\n| `harm_domain` | str | MIT taxonomy domain (Safety, Fairness, Privacy, etc.) |\n| `harm_severity` | str | Critical / High / Medium / Low |\n| `sector` | str | Industry sector affected |\n| `country` | str | Country where incident occurred |\n| `description` | str | Factual summary of the incident |\n| `people_affected_estimate` | int | Estimated number of people affected |\n| `financial_impact_usd` | float | Estimated financial damage in USD |\n| `regulatory_response` | str | Government/regulatory actions taken |\n| `technology_type` | str | Underlying AI technology |\n| `ai_task` | str | AI task that failed |\n| `root_cause` | str | Identified root cause of failure |\n| `resolved` | bool | Whether the issue has been resolved |\n| `legal_action_taken` | bool | Whether lawsuits or charges were filed |\n| `involved_fatalities` | bool | Whether deaths occurred |\n| `source_url` | str | Primary source URL |\n\n---\n\n## 🧪 Analysis Ideas\n\n1. **Incident Timeline Visualization** — How are AI failures accelerating year over year?\n2. **Harm Taxonomy Treemap** — Which types of AI harm are most common?\n3. **Company Risk Profile** — Which companies appear most frequently?\n4. **Sector Vulnerability Analysis** — Which industries are most exposed?\n5. **Fatality Analysis** — Map all AI-related deaths by technology type\n6. **Deepfake Explosion** — Track the rise of deepfake incidents over time\n7. **Regulatory Response Lag** — How long between incidents and policy responses?\n8. **LLM-Specific Failures** — Categorize all Large Language Model incidents\n9. **Financial Impact Estimation** — Total economic cost of AI failures\n10. **NLP on Descriptions** — Topic modeling and sentiment analysis of incident reports\n11. **Severity Prediction Model** — Can we predict incident severity from features?\n12. **Geographic Risk Map** — Where are AI incidents concentrated?\n\n---\n\n## 🏷️ Tags\n\n`artificial intelligence` `AI safety` `machine learning` `ethics` `data visualization` `NLP` `deep learning` `autonomous vehicles` `deepfakes` `bias` `2024` `2025`\n\n---\n\n## 📝 Data Notes\n\n- Every incident is **real and publicly documented** — no synthetic data\n- Incident IDs starting with \"AIID-\" reference the AI Incident Database (incidentdatabase.ai)\n- Incident IDs starting with \"REAL-\" are compiled from multiple verified news sources\n- Descriptions are original summaries based on multiple public reports\n- Financial impact figures are estimates based on reported losses, fines, and market cap changes\n- `people_affected_estimate` is null when the number cannot be reasonably estimated\n- Dataset is a curated subset — the full AIID contains 1,300+ incidents\n- Severity ratings are based on MIT AI Incident Tracker methodology\n\n---\n\n## 📜 License\n\nCC-BY-4.0 — Free to use with attribution. Please cite the AI Incident Database (incidentdatabase.ai) and this dataset.\n\n---\n\n**If this helps your AI safety research, please upvote! 👍 AI safety needs more data-driven analysis.**","url":"https://www.kaggle.com/prajitdatta/ai-incidents-failures-and-controversies-database","version":1,"keywords":["subject, science and technology, transportation, automobiles and vehicles","analysis, nlp","technique, deep learning","subject, science and technology, computer science, artificial intelligence","subject, people and society, social issues and advocacy, ml ethics"],"license":{"@type":"CreativeWork","name":"CC BY-SA 4.0","url":"https://creativecommons.org/licenses/by-sa/4.0/"},"identifier":["9594510"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"Prajit Datta","url":"https://www.kaggle.com/prajitdatta","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/489278-kg.jpg?t=2026-01-31-11-44-21"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/prajitdatta/ai-incidents-failures-and-controversies-database/download?datasetVersionNumber=1","contentSize":"8246 bytes"}],"commentCount":0,"dateModified":"2026-02-28T03:22:14.507Z","discussionUrl":"https://www.kaggle.com/prajitdatta/ai-incidents-failures-and-controversies-database/discussion","alternateName":"32 verified incidents · 29 companies · Every major AI failure, documented","isAccessibleForFree":true,"thumbnailUrl":"https://storage.googleapis.com/kaggle-datasets-images/9594510/14988844/d9d3a62b10aea764f4c2c1292cb75bb8/dataset-card.jpg?t=2026-02-28-03-26-01","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"http://schema.org/CommentAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"http://schema.org/DownloadAction","userInteractionCount":113},{"@type":"InteractionCounter","interactionType":"http://schema.org/ViewAction","userInteractionCount":1461},{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":0}]}</script>
