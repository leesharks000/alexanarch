 Prov account or by contacting our team. Fees may apply depending on timing."},"scoring":{"q":"How long does scoring take?","a":"Most computer-based exams return scores within 24 hours. Practical exam results may take longer depending on your state board. You'll get an email when results are available."},"fail":{"q":"What happens if I fail?","a":"Many candidates need more than one attempt \u2014 it's completely normal. You'll receive a score report showing areas to improve. A mandatory waiting period applies before retesting; the length varies by state."},"remote":{"q":"Is remote testing available for my exam?","a":"Remote testing is available for many knowledge-based exams. When scheduling you'll see \"Online Proctored\" as an option if available for your state and exam type."},"allowed":{"q":"What can I bring into the testing room?","a":"Generally only your approved ID and any permitted reference materials listed in your Candidate Information Bulletin. Personal items must be secured in a provided locker."},"ada":{"q":"How do I request ADA accommodations?","a":"Submit your request at least three weeks before your exam with documentation from a licensed professional. Email ada@provexam.com to get started."}}},"reviews":{"heading_line_1":"Nervous for exam day?","heading_line_2":"So were they.","subhead":"Here's what real candidates have to say about testing with Prov.","prev_aria":"Previous reviews","next_aria":"Next reviews","google_review_aria":"Google review","stars_aria":"5 out of 5 stars","pagination_aria":"Carousel pagination","slide_aria":"Go to slide :index","card_aria":"Review :index of :count by :author","footer_count":":count+ five-star Google reviews","footer_from":"from real candidates.","summary":"In summary:","summary_strong":"you've got this."},"support":{"eyebrow":"We're rooting for you","heading_line_1":"Questions before","heading_line_2":"exam day?","subhead":"Our Candidate Success Team is here for you \u2014 whether you need answers, support, or a little extra confidence before exam day.","team_alt":"Prov Candidate Success Team","channels":{"call":{"label":"Call Us","sub":"(801) 733-4455"},"email":{"label":"Email","sub":"Typically responds within 2 business days"},"text":{"label":"Text Us","sub":"Quick SMS support"}},"online_aria":"Team is online","offline_aria":"Outside business hours","hours_strong":"Mon\u2013Fri, 6am\u201310pm MT","hours_sub":"Weekend hours vary"},"bottom_cta":{"eyebrow":"Your career is waiting","heading":"Ready to get started?","subhead":"Scheduling takes less than five minutes, so you can focus on what comes next.","cta_schedule":"Schedule My Exam","cta_find":"Find a Testing Center","cta_contact":"Candidate Support","cta_bookstore":"Visit the Bookstore"}},"about":{"meta":{"page_title":"Our Story \u2014 Prov"},"hero":{"eyebrow":"Founded in 2004","heading":"Testing built on","heading_highlight":"integrity.","body":"For more than two decades, Prov has believed that great testing is about more than delivering an exam. It's about how you treat the people taking it. We bring responsive, thoughtful customer service to an industry where the experience can too often feel like an afterthought.","body_closing":"Because how you test matters... and so does how you're treated along the way."},"mission":{"eyebrow":"Who we are","heading":"More than a testing","heading_highlight":"company.","body":"Prov operates as an organization founded on integrity, creativity, and ingenuity with a customer-first approach. We don't just administer exams \u2014 we build the infrastructure that helps professionals earn the licenses that shape their careers and their communities.","quote":"Our mission is to provide tailored testing solutions for candidates and administrators worldwide. Through devoted and personalized service, we seek to simplify the candidate testing experience, foster positive relationships, and enable exam owners to run their organizations with confidence.","quote_attr":"\u2014 Prov Mission Statement"},"stats":{"aria_label":"Company statistics","items":[{"number":"2004","label":"Year Founded"},{"number":"6+","label":"Industries Served"},{"number":"20+","label":"Years of Experience"},{"number":"1,200+","label":"Candidate Reviews"}]},"values":{"eyebrow":"How we show up","heading":"The Prov","heading_highlight":"difference.","sub":"Three things have defined us since day one \u2014 and they still do.","items":[{"title":"Innovators","desc":"We continuously improve our platform so that testing stays fair, modern, and accessible \u2014 no matter how the industry evolves."},{"title":"Relationship Builders","desc":"We treat every licensing board, administrator, and candidate as a long-term partner. Trust is built one interaction at a time."},{"title":"Solution Seekers","desc":"Complex problems get straightforward answers. We dig in, figure it out, and deliver \u2014 no matter how unique the challenge."}]},"industries":{"eyebrow":"Where we work","heading":"Industries we","heading_highlight":"serve.","sub":"From a nail tech in Nevada to a master electrician in Ohio \u2014 Prov powers licensing exams across the professions that build and sustain our world.","items":[{"name":"Construction","desc":"Electrical, plumbing, HVAC, contracting, and more \u2014 licensing exams built for the trades."},{"name":"Government","desc":"State and local agency credentialing with the security and reliability government requires."},{"name":"Cosmetology","desc":"Theory and practical exams for cosmetology, esthetics, nail technology, barbering, and more."},{"name":"Life Science","desc":"Rigorous testing solutions for healthcare and life science professionals at every level."},{"name":"Workforce Development","desc":"Credentialing programs that help workers advance and organizations maintain standards."},{"name":"Education","desc":"Assessment solutions for educational institutions focused on outcomes that matter."}]},"cta":{"eyebrow":"Work with us","heading":"Ready to partner with Prov?","body":"Whether you're a licensing board looking for a testing partner or a candidate ready to get licensed \u2014 we're here to help.","call":"Call 866-720-7768","home":"Back to Home"}},"contact":{"meta":{"page_title":"Candidate Support \u2014 Prov"},"hero":{"eyebrow":"We're here to help","heading":"Get in","heading_highlight":"touch.","body":"Whether you have a question about your exam, need technical support, or want to learn about partnering with Prov \u2014 our team is ready to help."},"channels":{"aria":"Ways to reach us","phone":{"title":"Call or Text","detail":"(801) 733-4455","sub":"Speak directly with our support team"},"email":{"title":"Email Us","detail":"support@provexam.com","sub":"We typically respond within one business day"},"hours":{"title":"Support Hours","detail":"Mon \u2013 Fri, 6AM \u2013 10PM MT","sub":"Our team is available most of the day"}},"form":{"eyebrow":"Send a message","heading":"We'd love to","heading_highlight":"hear from you.","body":"Fill out the form and a member of our team will get back to you as soon as possible. For faster assistance, give us a call.","info":{"address_label":"Address","address_value":"200 W Civic Center Drive, Suite 160\nSandy, UT 84070","phone_label":"Phone","phone_value":"(801) 733-4455","email_label":"Email","email_value":"support@provexam.com"},"fields":{"first_name":"First name","last_name":"Last name","email":"Email address","phone":"Phone number","phone_optional":"(optional)","subject":"Subject","subject_placeholder":"Select a topic\u2026","message":"Message","message_placeholder":"Tell us how we can help\u2026"},"subject_options":{"exam":"Exam Scheduling","results":"Exam Results","technical":"Technical Support","ada":"ADA Accommodations","bookstore":"Bookstore \/ Returns","boards":"Licensing Board Inquiry","other":"Other"},"placeholders":{"first_name":"Jane","last_name":"Smith","email":"jane@example.com","phone":"(801) 555-0100"},"submit":"Send Message","submitting":"Sending\u2026","errors":{"first_name":"Please tell us your first name.","last_name":"Please tell us your last name.","email":"Please enter an email address we can reply to.","phone":"Please enter a shorter phone number.","subject":"Please choose a subject.","message":"Please tell us how we can help.","failed":"Something went wrong sending your message. Please try again, or email us at support@provexam.com."},"success":{"title":"Message sent!","body":"Thanks for reaching out. We'll get back to you within one business day.","reset":"Send another message"}},"cta":{"eyebrow":"Need immediate help?","heading":"We're just a call away.","body":"Our support team is available Monday through Friday, 6AM to 10PM Mountain Time.","call":"Call (801) 733-4455","email":"Email Support","home":"Back to Home"}},"faq":{"meta":{"page_title":"Candidate FAQs \u2014 Prov"},"hero":{"eyebrow":"Before your exam","heading":"Frequently Asked","heading_highlight":"Questions.","body":"Everything you need to know \u2014 from scheduling your exam to getting your results."},"accordion":{"aria_label":"Frequently asked questions","expand_aria":"Expand answer","collapse_aria":"Collapse answer"},"categories":[{"id":"scheduling","label":"Scheduling & Registration","faqs":[{"q":"Where can I find information about my exam?","a":"The Candidate Information Bulletin (CIB) contains all the specific rules, procedures, and recommended study materials for your exam. Download it from the Exam Information page on our website."},{"q":"How do I schedule an exam?","a":"Schedule through the Prov website scheduler or call (866) 720-7768. Have your driver's license number ready. Some organizations require pre-authorization before you can schedule \u2014 check your CIB for details."},{"q":"Can I cancel or reschedule an exam once it's already been booked?","a":"Yes, you can reschedule, but the deadline for rescheduling and any associated fees will vary depending on your exam. Review your Candidate Information Bulletin for specific policies before making changes."},{"q":"Where can I confirm my scheduled exam date and time?","a":"Prov sends a confirmation email after scheduling. You can also verify your appointment online through the Prov Scheduler by logging in on the \"Schedule an Exam\" page."}]},{"id":"preparation","label":"Exam Preparation","faqs":[{"q":"How do I know what books I can use on my exam?","a":"Your Candidate Information Bulletin (CIB) contains a full list of approved study materials for your exam. Always reference the CIB specific to your exam and jurisdiction."},{"q":"Can I use my textbooks or study materials during my exam?","a":"Many Prov exams allow reference materials, but these rules vary by Licensing or Certifying Jurisdiction. Check your CIB for what is and isn't permitted at your specific exam."},{"q":"Can I highlight, tab, or add notes to my reference materials?","a":"Approved markings include permanent tabs (gummed or self-adhesive) and highlighting or underlining in pen only. Prohibited items include handwritten notes, moveable tabs, and any marking done during the exam itself."},{"q":"Can I use an older edition of my reference material?","a":"Yes, older editions are generally acceptable as long as the book title is an exact match to what is listed in your CIB."},{"q":"Does Prov offer practice exams?","a":"Yes. The Prov Bookstore provides digital practice exams for a wide range of exams. Practice exams are a great way to familiarize yourself with the format and question style before exam day."}]},{"id":"testing","label":"Testing & Results","faqs":[{"q":"Where can I take my exam?","a":"Most Licensing and Certifying Jurisdictions allow candidates to take exams either in-person at a testing center or online through ExamRoom.ai. Some jurisdictions have limitations \u2014 check your CIB for what's available to you."},{"q":"What can I expect on exam day?","a":"Log in with your provided credentials. The ExamRoom.ai onboarding agent will check you in and verify your ID and approved materials. You'll then be transferred to a proctor who will officially start your exam. Results are delivered via email or through your testing organization. Note: your exam time does not begin until after check-in and registration are complete."},{"q":"What can I bring to the testing site?","a":"Approved items include pencils, a simple 4-function calculator, and any approved textbooks or reference materials listed in your CIB. Prohibited items include cameras, recorders, watches, cell phones, PDAs, tablets, specialty calculators, and any communication devices."},{"q":"Will I need to show my ID or other documentation on exam day?","a":"Yes. All test-takers must provide a valid, government-issued photo ID. Accepted forms include a driver's license, passport, or military ID. Student IDs and temporary IDs are not accepted."},{"q":"Where can I view my scores? When will the Board be notified?","a":"For most jurisdictions, scores are calculated and provided immediately after the exam. In-person test-takers receive their scores at the testing center; online test-takers receive them via email. Some organizations have scores delivered directly to them."},{"q":"How many times can I retake my exam? When can I retest?","a":"Retake policies vary by Licensing or Certifying Jurisdiction, including waiting periods and the number of allowed attempts. Find the specific rules that apply to your exam in your Candidate Information Bulletin."},{"q":"Can I review the questions I missed on my exam?","a":"Most jurisdictions allow an Exam Review for candidates who score within 10% of the passing score. Contact your jurisdiction or Prov directly to request a review."},{"q":"What do I do if I have a question or concern about my exam?","a":"Start by reviewing your CIB. You can also leave comments throughout your exam on any questions you believe are inaccurate. For further assistance, contact Prov at info@provexam.com or (866) 720-7768."},{"q":"Does Prov provide accommodations for candidates with disabilities?","a":"Yes. Prov offers exam accommodations in accordance with the Americans with Disabilities Act (ADA). Submit the official Testing Accommodations form available on the Prov website at least three weeks before your scheduled exam."}]},{"id":"online","label":"Online Testing","faqs":[{"q":"What is ExamRoom.ai?","a":"ExamRoom.ai\u2122 is a secure online proctoring system included with every online Prov exam. This remote monitoring service allows you to take your exam from any location, receive guided onboarding and tech support, and chat directly with proctors. The service is included at no additional cost."},{"q":"Do I need a special computer or internet connection to take my exam online?","a":"Prov and ExamRoom.ai are designed to work on a wide range of systems and browsers, but specific requirements apply. We strongly recommend running the system compatibility check at provexam.examroom.ai\/system-check\/ before your exam day to avoid any surprises."},{"q":"Do I need a webcam to take my online exam?","a":"Yes. Our remote proctoring software uses your camera for face-to-face monitoring throughout the exam. A functioning webcam is required to take your exam online."},{"q":"How do I make sure my computer is ready for testing?","a":"Run the system compatibility check at provexam.examroom.ai\/system-check\/ before exam day. Most systems will only require a few small adjustments. Don't wait until the day of your exam to check."},{"q":"When does my exam time officially begin?","a":"Your testing time does not begin until after you are checked in, connected with your proctor, and officially click \"Start Exam.\" You won't lose time during the check-in process."},{"q":"What happens if my computer or internet fails during my online exam?","a":"Your exam pauses and your answers are saved automatically. If your computer freezes, shuts down, or stops responding, notify your proctor when your connection is restored. For serious technical failures, your exam may be rescheduled at no penalty."}]},{"id":"bookstore","label":"Bookstore","faqs":[{"q":"What should I do if I receive an incorrect, damaged, or faulty item?","a":"Contact the Prov Bookstore directly at bookstore@provexam.com or call (866) 720-7768 Ext. 114. We'll make it right."},{"q":"What is the Prov Bookstore return policy?","a":"Unused, unopened, and undamaged items can be returned for a refund within 30 days of purchase. Please note that practice exams are not eligible for return."},{"q":"Can I cancel an order after it's been shipped?","a":"Orders cannot be canceled once they have shipped. However, you can return unused, unopened, and undamaged items within 30 days. Send returns to: Prov Bookstore, 200 W Civic Center Dr, Ste 160, Sandy, UT 84070."}]}],"contact":{"eyebrow":"Still need help?","heading":"Our team is","heading_highlight":"standing by.","body":"Can't find the answer you're looking for? Reach out directly \u2014 our Candidate Success Team responds fast.","channels":[{"type":"phone","label":"Call or Text","sub":"(866) 720-7768","href":"tel:8667207768"},{"type":"email","label":"Email Us","sub":"support@provexam.com","href":"mailto:support@provexam.com"}],"hours":"Mon\u2013Fri, 6am\u201310pm MT \u00b7 Weekend hours vary"},"cta":{"eyebrow":"You've got this","heading":"Ready to schedule your exam?","body":"Thousands of candidates have already passed with Prov. Your turn.","schedule":"Schedule My Exam","home":"Back to Home"}},"ada":{"meta":{"page_title":"ADA Accommodations \u2014 Prov"},"hero":{"eyebrow":"Testing Accommodations","heading":"ADA","heading_highlight":"Accommodations","lede":"Prov is committed to providing fair, accessible testing for every qualified candidate. If you have a disability covered by the Americans with Disabilities Act, you can request reasonable accommodations for your licensing exam.","meta_deadline_prefix":"Submit at least","meta_deadline_bold":"3 weeks","meta_deadline_suffix":"before your desired exam date. Once your accommodations have been approved, Prov will contact you to schedule your exam.","meta_renew_prefix":"Forms renew every","meta_renew_bold":"5 years","meta_apply_prefix":"Print, complete","meta_apply_bold":"and","meta_apply_suffix":"return by mail or email"},"eligibility":{"eyebrow":"Who Qualifies","heading":"Equal access to your","heading_highlight":"licensing exam.","body":"Under the Americans with Disabilities Act, an individual with a disability is a person who has a physical or mental impairment that substantially limits one or more major life activities \u2014 such as seeing, hearing, learning, reading, concentrating, or thinking \u2014 has a record of such an impairment, or is regarded as having one. Prov administers exams in a manner that does not discriminate against any qualified applicant on the basis of disability.","criteria":[{"title":"You have been approved to take a Prov exam","body":"You must be approved or eligible to take your exam before testing with Prov, based on the requirements of your licensing board or testing program."},{"title":"You have qualifying documentation","body":"A physician, psychologist, or licensed professional must verify your impairment and the accommodations they recommend."},{"title":"You apply on time","body":"All forms and supporting documentation must reach Prov at least 3 weeks before your desired testing date."}]},"apply":{"eyebrow":"Start Your Request","heading":"How to","heading_highlight":"apply.","body":"Download the printable forms, complete them by hand, and email the completed packet to us for the fastest processing. You may also return it by mail, but please allow additional time for delivery and processing.","print":{"items":["Four forms: A & B are required; C & D are optional.","Print, sign, and return by mail or email","Submit at least 3 weeks before your desired testing date"],"cta_primary":"View Printable Form","cta_secondary":"Download PDF","cta_secondary_loading":"Preparing PDF\u2026","download_error":"The PDF could not be prepared. Please try again, or use the print option above.","download_filename":"ada-accommodations-request.pdf"}},"process":{"eyebrow":"How It Works","heading":"What to expect,","heading_highlight":"step by step.","body":"From your first request to exam day, here's how the accommodations process flows.","steps":[{"title":"Submit Forms","desc":"Complete Form A and have your provider complete Form B. Submit at least 3 weeks before your exam."},{"title":"Review & Decision","desc":"Our ADA Accommodations Team reviews your request and documentation and lets you know which accommodations are approved \u2014 typically within three weeks."},{"title":"Get Confirmation","desc":"You'll receive an official decision letter by email outlining your approved accommodations."},{"title":"Schedule your exam","desc":"Once your accommodations are approved, contact us to schedule your exam. Accommodated testing appointments require additional coordination, so availability cannot be guaranteed for a specific date or testing location."},{"title":"Exam Day","desc":"Your accommodations are arranged at your testing center or for your remote exam. Good luck on exam day!"}]},"form":{"toolbar_label":"Printable Version","toolbar_title":"ADA Testing Accommodations Request \u2014 Forms A\u2013D","print_button":"Print Form","logo_alt":"Prov","org_name":"Prov, Inc.","org_address":"200 West Civic Center Dr., Suite 160, Sandy, UT 84070","org_contact":"Provexam.com  |  (866) 720-7768","doc_title":"Prov ADA Testing Accommodations Request","page_number":"Page :page of :total","policy":{"eyebrow":"Americans with Disabilities Act","title":"ADA Testing Accommodations Policy","intro":"Applicants who request testing accommodations pursuant to the Americans with Disabilities Act (ADA) must make the request on the ADA Accommodations Forms. Prov administers the examinations in a manner that does not discriminate on the basis of disability against a qualified Applicant. An Applicant who is otherwise eligible to take the Prov Examination may file a request for testing accommodations.","definitions_heading":"Definitions","definitions":["The Americans with Disabilities Act provides comprehensive civil rights protection for qualified individuals with disabilities. An individual with a disability is a person who: (1) has a physical impairment or a mental impairment that substantially limits a major life activity, (2) has a record of such an impairment, or (3) is regarded as having such an impairment.","A qualified individual with a disability means an Applicant with a disability who, with or without reasonable modification to Rules, Policies, or Practices; the removal of architectural, communication, or transportation barriers; or the provision of auxiliary aids and services, meets the essential eligibility requirements for licensure for the specific client being tested.","Major life activities include functions such as caring for oneself, performing manual tasks, walking, seeing, hearing, speaking, breathing, learning, and working. An individual who currently uses illegal drugs is not protected by the ADA when a decision not to provide accommodations is made based upon his\/her current illegal use of drugs.","Physical impairment means any physiological disorder or condition, cosmetic disfigurement, or anatomical loss affecting one or more of the following body systems: neurological, musculoskeletal, special sense organ, respiratory (including speech organs), cardiovascular, reproductive, digestive, genitourinary, hemic and lymphatic, skin and endocrine.","Mental impairment shall mean any mental or psychological disorder, such as mental retardation, organic brain syndrome, emotional or mental illness, and specific learning disabilities.","Reasonable accommodations mean an adjustment or modification of the standard testing conditions that ameliorates the impact of the Applicant\u2019s disability without doing any of the following: (1) fundamentally altering the nature of the examination such that the ability to determine through the examination whether the Applicant possesses the essential skills and aptitudes that the Board has determined are appropriate to require; (2) imposing an undue burden on the Board; (3) compromising the security of the Examination; or (4) compromising the integrity, the reliability, or the validity of the Examination."]},"procedure":{"heading":"Procedure","intro":"A request for testing accommodations shall be on forms prescribed by the Board and shall consist of all of the following. The required forms are included on the following pages \u2014 you may print and copy the forms as many times as necessary.","callout":"Even if you were approved for accommodations for a prior exam, you must submit Form A if you wish to receive accommodations for a subsequent exam.","forms":[{"label":"Form A","title":"Petition for Testing Accommodations","body":"Must be completed by the Applicant.","note":""},{"label":"Form B","title":"Certificate of Medical \/ Psychological Authority","body":"Must be completed by a physician, psychologist, or professional licensed to diagnose and treat your disability.","note":"NOTE: Your petition WILL NOT be considered if Form B is not completed by the authority and returned by the posted deadline. The reviewing consultant requires recent testing and\/or evaluations \u2014 typically within the past 5 years for attention\/learning\/psychological disabilities and within the past 1 year for physical\/visual\/hearing disabilities."},{"label":"Form C","title":"Certificate of Accommodations","body":"Must be completed by an official of your school, a national standardized examination (e.g., ACT, SAT, or LSAT) on which you received accommodations, or an employer who provided accommodations.","note":"NOTE: Copy and complete Form C as many times as necessary to send to each school, testing entity, or workplace."},{"label":"Form D","title":"Authorization for Release of Information","body":"For release of records from the Applicant\u2019s medical authorities or to determine whether the Applicant is a qualified individual with a disability.","note":"NOTE: Copy and complete Form D as many times as necessary to send to each provider."}],"deadline":"All required forms and associated documentation must be received by Prov at least 3 weeks prior to the desired testing date. Failure to provide all documentation by the deadline may result in your request not being considered.","send_label":"Mail or email all forms, documentation & correspondence to","send_name":"ADA Compliance  \u2014  Prov, Inc.","send_address":"200 West Civic Center Dr., Suite 160, Sandy, UT 84070","send_email":"ada@provexam.com","send_phone":"(866) 720-7768, Ext. 4","questions":"If you have any questions about Prov\u2019s Testing Accommodations Policy, contact ADA Compliance at the number above."},"a":{"eyebrow":"Form A  \u2022  Completed by the Applicant","eyebrow_continued":"Form A  \u2022  Continued","title":"Petition for Testing Accommodations","applicant_heading":"Applicant Information","first_name":"First Name","last_name":"Last Name","street_address":"Street Address","city":"City","state":"State","zip":"ZIP","telephone":"Telephone","exam_date":"Date of Exam Seeking Accommodations (MM\/DD\/YY)","q1":"Describe the physical or mental impairment that is the basis for your request for testing accommodations and explain the impact of this impairment on your ability to take the Prov Examination under standard testing conditions. Be as specific as possible.","q2":"Provide the date on which you became disabled.","q2_label":"Date Became Disabled","q3":"List the names, professional titles, addresses, and telephone numbers of the medical and psychological authorities with whom you have sought assessment and\/or treatment, including the dates for each. These should be the providers who will be providing a Certificate of Medical or Psychological Authority.","q3_col_name":"Name & Title","q3_col_address":"Address","q3_col_phone":"Phone","q3_col_dates":"Treatment Dates","q3_table_region_label":"Treatment provider table (scrolls horizontally)","q4":"Describe, in detail, any accommodations you have received for your physical or mental impairment in academic, testing, or employment settings. Provide a Certificate of Accommodations from each employer and\/or educational institution.","q5":"State the testing accommodations you request and explain how the accommodation relates to your physical or mental impairment (be as specific as possible). Accommodations will be considered for implementation within written exam conditions, unless otherwise specified by providers, such as for practical exams.","attest_heading":"To be completed by the Applicant","attest":"I swear or affirm that all information on this form is true and correct to the best of my knowledge, and I understand that it may be reviewed by a physician or other licensed professional.","sig_applicant":"Applicant Signature","sig_date":"Date"},"b":{"eyebrow":"Form B  \u2022  Completed by the Authority","eyebrow_continued":"Form B  \u2022  Continued","title":"Certificate of Medical \/ Psychological Authority","note":"To be completed by a physician, psychologist, or professional licensed to diagnose and treat the Applicant\u2019s impairment. Please type or legibly print.","callout":"NOTE TO APPLICANT: Your Petition for Accommodations WILL NOT be considered if Form B is not completed by a certified authority and returned to Prov by the posted deadline.","applicant_heading":"Applicant\u2019s Information","authority_heading":"Authority\u2019s Information","first_name":"First Name","last_name":"Last Name","optional_id":"Optional ID Number","street_address":"Street Address","city":"City","state":"State","zip":"ZIP","telephone":"Telephone","exam_date":"Date of Exam Seeking Accommodations (MM\/DD\/YY)","auth_title":"Title","institution":"Medical Institution \/ Company","email":"Email Address","q1":"Describe your professional qualifications (terminal degree, clinical specialty, licensure, etc.) that enable you to act in the capacity of medical or psychological authority on the Applicant\u2019s impairment.","q2":"State the date(s) on which you have examined the Applicant.","q3":"Describe the nature and severity of the Applicant\u2019s impairment and discuss its effect on the ability of the Applicant to complete the Examination under standard testing center procedures. The exam may be multiple hours. If accommodations are needed for practical\/skills testing, please specify.","q4":"List the complete ICD diagnosis of the physical impairment or the complete multi-axial DSM-5-TR diagnosis of mental impairment. Include all relevant severity and course specifics.","q5":"List the studies and\/or procedures used to diagnose the impairment and attach all pertinent medical or psychological records (laboratory studies, diagnostic tests, clinical procedures). For psychological and psycho-educational testing, attach all raw data and reports. Specify how findings provide specific evidence for a need for accommodation not provided in typical testing conditions.","q6":"State the testing accommodations you recommend for the Applicant and explain how they relate to the Applicant\u2019s impairment. If your recommendations include an extension of the customary examination time, describe your rationale for the amount of time recommended, a specific recommended time, and support for that requested time.","attest_heading":"To be completed by the Authority","attest":"I certify that all the information is true and correct to the best of my knowledge and belief.","sig_authority":"Authority Signature","sig_date":"Date"},"c":{"eyebrow":"Form C  \u2022  Completed by School, Employer, or Testing Official","eyebrow_continued":"Form C  \u2022  Continued","title":"Certificate of Previous Accommodations","note":"To be completed by the appropriate school, employment, or testing official regarding the Applicant named below. Please type or legibly print. Attach a copy of any documentation used in making a decision regarding accommodations for this Applicant.","callout":"NOTE TO APPLICANT: This form is optional. Your Petition for Accommodations CAN be considered without Form C.","applicant_heading":"Applicant\u2019s Information","authority_heading":"Authority\u2019s Information","first_name":"First Name","last_name":"Last Name","optional_id":"Optional ID","street_address":"Street Address","city":"City","state":"State","zip":"ZIP","auth_title":"Title","institution":"Educational Institution \/ Company","telephone":"Telephone","email":"Email Address","q1":"Name the course of study and the dates in which the Applicant was enrolled at your educational institution (or name the Applicant\u2019s position and dates of employment).","q2":"If the Applicant received accommodations, state the nature of the impairment that served as a basis for granting accommodations.","q3":"Specifically describe the accommodations granted to the Applicant.","attest_heading":"To be completed by the Authority","attest":"I certify that all the information is true and correct to the best of my knowledge and belief.","sig_authority":"Authority Signature","sig_date":"Date"},"d":{"eyebrow":"Form D  \u2022  Completed by the Applicant","title":"Authorization for Release of Information","note":"Please type or legibly print. You must copy and complete Form D as many times as necessary to send to each provider. This authorizes the release and exchange of information between the parties below.","party_one_label":"Party One","party_one_name":"ADA Compliance  \u2014  Prov, Inc.","party_one_address":"200 West Civic Center Dr., Suite 160, Sandy, UT 84070","party_one_contact":"ada@provexam.com  |  (866) 720-7768, Ext. 4","and":"And","party_two_label":"Party Two \u2014 Authority from Form B or Provider from Form C","regarding_label":"Regarding","name":"Name","street_address":"Street Address","city":"City","state":"State","zip":"ZIP","telephone":"Telephone","email_or_fax":"Email Address or Fax Number","first_name":"First Name","last_name":"Last Name","optional_id":"Optional ID","attest":"By my signature below, I authorize the above parties to release and exchange information for the sole purpose of determining testing accommodations. All necessary information may be released, including medical and psychological records, treatment plans, histories and progress notes, admission and discharge summaries, laboratory results, psychological and psychiatric reports, court reports and school records, employment records, and psychological, neurological and psycho-educational test data. This authorization will remain in effect for 90 days from the date of signature. I may withdraw this consent at any time upon written notice. Recipients of this information are forbidden to re-disclose it to parties not named above.","sig_applicant":"Applicant Signature","sig_witness":"Witness Signature","sig_date":"Date"}},"faq":{"eyebrow":"Frequently Asked","heading":"Common","heading_highlight":"questions.","body":"Answers to what candidates ask most about requesting testing accommodations.","items":[{"q":"Who is eligible for testing accommodations?","a":"Any applicant otherwise eligible to sit for a Prov examination who has a physical or mental impairment that substantially limits a major life activity. Major life activities include seeing, hearing, learning, reading, concentrating, thinking, walking, and others. You must submit Form A and have Form B completed by a qualified medical or psychological authority."},{"q":"How far in advance should I apply?","a":"All forms and supporting documentation must be received by Prov at least three weeks before your desired testing date. Late submissions may not be reviewed in time, so we recommend submitting as early as possible."},{"q":"Do I need to reapply for accommodations for each exam?","a":"No. Once your accommodations have been approved, you do not need to submit a new application for each subsequent exam. If your accommodation needs change, please contact our ADA Accommodations Team."},{"q":"What documentation do I need from my provider?","a":"Form B must be completed by a physician, psychologist, or other professional licensed to diagnose and treat your impairment. A recent IEP or 504 Plan may be submitted in place of Form B. Otherwise, recent evaluations are typically required \u2014 within the past five years for learning, attention, or psychological disabilities, and within the past year for physical, visual, or hearing disabilities. A copy of the provider's curriculum vitae (CV) must also be attached."},{"q":"How are my testing accommodations determined?","a":"Each accommodation request is reviewed individually based on your needs, supporting documentation, and the requirements of your testing program. Accommodations may vary by exam or licensing board, and in some cases, approval is provided by the applicable licensing board or regulatory agency rather than Prov."},{"q":"How long does the review process take?","a":"Complete requests are reviewed within three weeks of receipt. Incomplete submissions take longer \u2014 your reviewer may request additional records, so submitting everything together speeds the process."},{"q":"Will my disability information stay confidential?","a":"Yes. All information submitted in connection with an accommodation request is treated as confidential and used solely to evaluate eligibility. By signing Form D, you authorize Prov and your provider to exchange information, and recipients are forbidden from re-disclosing it."},{"q":"What if I'm denied?","a":"If your request is not approved, you'll receive a written explanation. You may submit additional documentation for reconsideration, or contact our ADA coordinator to discuss next steps. Decisions are made based on the documentation provided and ADA standards."}]},"contact":{"live_channel_sr":"Live assistance available during listed hours.","eyebrow":"Need a Hand?","heading":"Talk ment describing why you feel the question is in error. Comments are reviewed as part of the exam development process.","hand_score_q":"Hand Score Request","hand_score_text":"If you want your score reassessed, you can request a hand score by calling Prov at :phone. The form must be mailed to Prov within 90 days of your exam date with a copy of your score letter. The cost is $25.00 (includes tax); processing takes 7\u201310 business days.","payment_q":"Payment Methods","payment_text":"Accepted for Prov services (reviews, hand scores): money orders, cashier's checks, certified checks, and credit cards (American Express, Discover, MasterCard, Visa). Personal and company checks are not accepted.","ada_q":"ADA Accommodations","ada_text":"Prov complies with the Americans with Disabilities Act in providing special accommodations. Written documentation from a licensed physician or psychologist is required, and Prov will work directly with you to arrange approved accommodations. To learn more or request an accommodation, :link.","ada_link":"visit our ADA Accommodations page","ada_text_board":"Prov complies with the Americans with Disabilities Act in providing special accommodations to test takers. In order to receive testing accommodations, you will need to contact the Board as they will determine the accommodations to be provided. Once approved, the Board will notify Prov which will then work directly with you to arrange approved accommodations.","practice_q":"Practice Exams","practice_text":"Prov offers practice examinations for many exams. Order online at provexam.com\/bookstore or by phone at :phone."},"samples":{"tag":"Practice","title_pre":"Sample","title_accent":"Exam Questions","sub":"These reflect the format and style of actual exam questions. Correct answers are highlighted.","question_label":"Question :num","correct_sr":"Correct answer","more_title":"Want more practice?","more_text":"Prov offers full practice exams for many licensing exams. Order at provexam.com\/b quently Asked Questions","tag":"Common questions","title_pre":"Frequently Asked","title_accent":"Questions","q_which":"Which exam do I need to take?","a_which":"Prov is not authorized to determine which exam(s) you must take. If you are unsure of which examination(s) you should take, please contact the Board before you register and schedule.","a_where_sites":"You may take your exam at any of Prov's :count testing centers listed in the Locations section, or remotely via Prov's Examroom\u00ae service where available.","q_register":"How do I register for my exam?","q_where":"Where can I take my exam?","q_cost":"How much does it cost?","q_results":"When do I get my exam results?","q_study":"Are there any study aids?","q_content":"What is on the exam?","a_where":"You may take your exam at any one of Prov's testing centers. Locations and directions are provided in the Testing Locations section below.","a_study":"Yes, practice examinations are available in Prov's bookstore at provexam.com.","a_content":"Detailed exam content is provided in the exam listings above.","contact_board":"For Licensing Questions","contact_prov":"For Testing Questions \u2014 Prov, Inc.","contact_hours":"Office Hours"},"exam_descriptions":{"col_subject":"Subject Area","col_questions":"# Questions","references_heading":"Approved Reference Materials"},"locations":{"heading":"Testing Locations","intro":"Prov has :count testing centers in :state where you may take your examination.","cities_label":"These centers are located in:","link":"Find addresses and directions at provexam.com","remote_note":"Remote testing via Examroom.ai may also be available. Contact Prov for details.","tag":"Where to take your exam","title_accent":"Testing Locations","remote_title":"Remote testing available \u2014 Examroom\u00ae","remote_text":"Take your exam from home using Prov's Examroom\u00ae service. You need a recent computer, Chrome or Firefox, a webcam, a microphone, and at least 3 Mbps upload speed. Run a system check ur registration request will then be sent to the Board for review and approval. Once approved, you can return to Prov's website and schedule your exam at your convenience.","register_then_schedule":"Once you have entered your registration information, you can schedule your exam at your convenience.","passed_exam":"Candidates cannot retake an exam once they have passed unless required by their licensing authority.","retesting_varies":"Retesting rules vary by program \u2014 contact your licensing authority or Prov before scheduling a retake.","same_day_results":"Prov's scoring system grades your exam immediately upon completion and automatically forwards results to your licensing authority.","delayed_results":"Results are not provided at the testing site. Prov releases your score report within :period of your examination, emails it to the address on your registration, and forwards your results to your licensing authority.","no_wait":"There is no required waiting period between attempts; you may retest as soon as an appointment is available.","wait":"If you do not pass, you must wait :wait before retesting.","wait_after_attempt":"After your :ordinal failed attempt, you must wait :wait before each further attempt.","ordinal_third":"third","ordinal_sixth":"sixth","max_per_90_days":"You may take the exam no more than :times in any 90-day period.","max_per_year":"You may take the exam no more than :times per year.","unlimited_attempts":"There is no limit to the number of attempts allowed on a single approval.","unlimited_attempts_no_approval":"There is no limit to the number of testing attempts you may make.","approval_each_attempt":"A new approval from your licensing authority is required before each attempt.","attempts_per_approval":"You may attempt the examination up to :times on a single approval; after that you must reapply to your licensing authority.","max_attempts":"You may attempt the examination a maximum of :times.","approval_never_expires":"Once approved, no further approval is needed to retest.","approval_expires_on":"Your approval to take the exam expires on :date.","approval_valid_for":"Your approval to take the exam is valid for :period; if you have not taken it by then, you must reapply.","results_never_expire":"Passing results do not expire.","result_valid_for":"A passing result remains valid for :period.","no_breaks":"No breaks are permitted during the examination.","breaks_allowed":"You may take up to :breaks during your examination.","break_time_limit":"Break time is limited to :minutes in total.","break_restrictions":"Please note that when you take a break you will not be able to :restrictions.","break_restrictions_or":":first or :second","break_no_changes":"change any answers to questions you have previously seen","break_no_review":"review any prior answers to questions","all_other_examinations":"all other examinations","labelled":":label: :text","names_two":":first and :second","names_many":":list, and :last","units":{"day":":count day|:count days","week":":count week|:count weeks","month":":count month|:count months","year":":count year|:count years","break":":count break|:count breaks","minute":":count minute|:count minutes","time":":count time|:count times"}},"cost_description":{"mixed":"Fees paid to Prov at the time of registration are listed with each exam below. Exams showing no Prov fee are paid through your licensing authority instead \u2014 contact them for their current fee schedule.","authority_only":"There is no exam fee paid to Prov \u2014 examination fees are handled through your licensing authority. Contact them for their current fee schedule.","prov_only":"Exam fees are paid to Prov at the time of registration. Fees vary by exam and are listed with each exam below."}},"legal":{"privacy":{"meta":{"page_title":"Privacy Policy \u2014 Prov"},"eyebrow":"Legal","title":"Privacy Policy","updated":"Last updated: October 24, 2023","intro":["Prov, Inc. (\"we,\" \"us,\" or \"our\") is committed to protecting the privacy and security of the personal information of test takers and users of our testing services. This Privacy Policy outlines how we collect, use, disclose, and protect personal information. By using our services, you consent to the practices described in this Privacy Policy."],"sections":[{"heading":"Information We Collect","paragraphs":["We may collect the following types of personal information when you use our testing services:"],"items":[{"term":"Contact Information","desc":"This includes your name, email address, phone number, and mailing address."},{"term":"Test Performance Data","desc":"This includes any information related to the tests you take, your test scores, and other performance-related data."},{"term":"Payment Information","desc":"If you make a payment for our services, we collect information necessary to process your payment, such as credit card information or other payment details."},{"term":"Identity Verification Data","desc":"We may collect data to verify your identity, such as a photo, government-issued ID, or other documentation."},{"term":"Technical Information","desc":"We may collect information related to your use of our website or platform, including IP addresses, browser types, and device identifiers."}]},{"heading":"How We Use Your Information","paragraphs":["We use the personal information we collect for the following purposes:"],"items":[{"desc":"To provide our testing services and generate test reports."},{"desc":"To communicate with you about your tests and any updates or changes to our services."},{"desc":"To process payments for our services and manage your account."},{"desc":"To verify your identity and maintain the security of our services."},{"desc":"To improve our services and develop new features and offerings."}]},{"heading":"Disclosure of Your Information","paragraphs":["We may share your personal information in the following circumstances:"],"items":[{"desc":"With third-party service providers that assist us in providing our services. These providers are bound by confidentiality agreements and are not permitted to use the information for any other purpose."},{"desc":"With law enforcement, government agencies, or other third parties if we are required to do so by law or if we believe such disclosure is necessary to protect our rights, safety, or the rights and safety of others."},{"desc":"With test sponsors; organizations, public or private, that contract with Prov to deliver examinations on their behalf."},{"desc":"In connection with a merger, acquisition, or sale of all or a portion of our assets. In this case, we will notify you before your information is transferred and becomes subject to a different privacy policy."}]},{"heading":"Security","paragraphs":["We take the security of your personal information seriously and implement reasonable security measures to protect it. However, no method of data transmission or storage is completely secure, so we cannot guarantee absolute security."]},{"heading":"Your Choices","paragraphs":["You have the right to access, correct, update, or delete your personal information. If you wish to do so or have any questions about your information, please contact us using the information provided in the Contact Us section below."]},{"heading":"Contact Us","paragraphs":["If you have any questions or concerns about this Privacy Policy or the way we handle your personal information, please contact us at:"],"contact":{"name":"Henry Sorensen, Ph.D., President","email":"henrys@provexam.com"}},{"heading":"Changes to This Privacy Policy","paragraphs":["We may update this Privacy Policy from time to time to reflect changes in our practices or for other operational, legal, or regulatory reasons. We will post the updated Privacy Policy on our website, and the \"Last Updated\" date will reflect the date of the latest revisions.","By using our services, you agree to the terms of this Privacy Policy. Please review it periodically to stay informed about how we orate clients who have used Prov's system to deliver exams to their job candidates. Personal information and exam information are never disclosed to candidates or unauthorized third parties, unless required by law."]},{"heading":"Third Parties","paragraphs":["In regards to licensure testing candidates, licensee updates may be disclosed to licensing agencies, regulatory boards, state governments or professional associations for their files and records. Prov will only disclose information to entities or third parties that are authorized by Prov. However, in certain states, personal information, exam information, and licensure and licensee updates information are considered public information and can be accessed by third parties for a cost. Prov may also disclose personal and licensure\/licensee information under certain circumstances where Prov has reason to believe that disclosing such information is necessary to identify, contact, or bring legal action against anyone who may be causing injury to, or interfering with, Prov's rights or property, other site(s) users, or any others that could be harmed by such activities, or as otherwise required by law."]}]},{"heading":"Marketing","paragraphs":["Prov and its third party affiliates may communicate with registered users and customers through email and other methods periodically. Prov and its third party affiliates will use their best efforts to only communicate with persons who \"opt in\" to such communications or with persons whose information is already deemed public information by their licensing authorities, and will cease communicating with any customers who \"opt out\" of such communications."]}]}},"start_my_test":{"meta":{"page_title":"Start My Exam \u2014 Prov"},"hero":{"eyebrow":"Exam day is here!","heading_line_1":"Ready to","heading_line_2":"Start Your Exam?","subhead":"A few quick steps and you'll be on your way. You've got this.","cta_remote":"Start My Remote Exam","cta_remote_sub":"Take your exam from home","cta_center":"Testing Center Check-in","cta_center_sub":"I'm testing in person"},"get_ready":{"eyebrow":"Before you launch","heading":"Let's get you ready","subhead":"Complete the steps below to ensure a smooth check-in and testing experience.","steps":{"prepare_space":{"title":"Prepare Your Space","desc":"A clutter-free desk and quiet room help make check-in quick and stress-free."},"photo_id":{"title":"Have Your Photo ID Ready","desc":"A valid government-issued photo ID is required to complete check-in."},"candidate_id":{"title":"Find Your Candidate ID","desc":"Your Candidate ID is located in your exam confirmation email. You'll use your Candidate ID and email address to sign in before your exam."},"provlock":{"title":"Install ProvLock","desc":"ProvLock is a browser extension required for remote exams. You can disable or remove it after your exam."}},"note_strong":"Your security is our priority.","note_rest":"These steps help create a fair and secure testing environment for everyone."},"launch":{"eyebrow":"Testing from home?","heading":"Start your exam!","subhead":"You'll be redirected to Examroom.AI to complete check-in and begin your exam.","cta_start":"Start My Remote Exam","cta_system_check":"Run a System Check","cta_provlock":"Need ProvLock?","partner_logo_alt":"ExamRoom.AI","partner_text":"Our remote testing partner, Examroom.Ai, ensures your exam is delivered securely with live proctoring and advanced security measures."},"provlock":{"title":"ProvLock","title_lock":"Lock","image_alt":"Laptop showing the ProvLock extension listing in the Chrome Web Store","intro_pre":"The ProvLock browser extension is a ","intro_strong":"required","intro_post":" part of your testing setup. It helps create a secure, distraction-free environment during your exam by prohibiting the use of other tabs and programs.","features":["Installs in seconds","Runs quietly in the background during your exam","Blocks pop-ups, extra tabs, and distractions","Supports a fair, validated testing experience","You can disable or remove it right after the exam"],"outro":"Using ProvLock helps proctors quickly confirm your exam session, protect your results, and keep your licensing journey on track.","cta_download":"Download ProvLock"},"help":{"heading":"Need help?","subhead":"Whether you have questions about your exam or need technical assistance, we're here to help. Choose the type of support you need below.","cards":{"prov":{"title":"Contact Prov","desc":"Questions about your exam, scheduling, eligibility, accommodations, or general testing policies.","cta":"Contact Candidate Success"},"examroom":{"title":"Contact Examroom","desc":"Having trouble launching your exam or experiencing technical issues with your remote testing session?","cta":"Contact Technical Support"}}}},"why_prov":{"meta":{"page_title":"Why Prov \u2014 Prov"},"hero":{"eyebrow":"Why Prov","heading":"Your program deserves more than a testing vendor.","heading_highlight":"It deserves a partner.","body":"For more than 20 years, Prov has helped licensing organizations deliver secure, reliable, and candidate-friendly examination programs \u2014 pairing deep expertise with responsive service that makes your job easier."},"experience":{"eyebrow":"A better experience","heading_pre":"Built for","heading_highlight":"everyone","heading_post":"your program touches","sub":"From the board room to exam day, the details that matter most are the ones people actually feel.","items":[{"title":"Exceptional Candidate Support","tagline":"Real people. Fast answers. Friendly service.","desc":"Our U.S.-based Candidate Success Team helps candidates navigate registration, scheduling, accommodations, and exam day \u2014 with extended hours and industry-leading response times."},{"title":"Trusted Security","tagline":"Protecting exam integrity at every step.","desc":"Advanced identity verification, live remote proctoring, AI-assisted monitoring, secure item banking, and rigorous testing-center standards safeguard your examinations."},{"title":"Flexible Testing Options","tagline":"Meet candidates where they are.","desc":"Offer secure testing through our nationwide testing network, remotely with live online proctoring, or through a customized combination of both."},{"title":"A True Partnership","tagline":"We're invested in your success.","desc":"You work directly with experienced program managers who know your licensing program, answer the phone, and help solve challenges before they become problems."}]},"services":{"heading":"Everything you need.","heading_highlight":"One trusted partner.","sub":"Six connected services, run by one team that already knows your program.","items":[{"tag":"Development","title":"Exam Development","desc":"Create defensible examinations built using psychometric best practices."},{"tag":"In person","title":"Computer-Based Testing","desc":"Secure testing at Prov-operated and partner testing centers nationwide."},{"tag":"Remote","title":"Remote Testing","desc":"Live online proctoring that expands access without compromising security."},{"tag":"Preparation","title":"Practice Exams","desc":"Help candidates prepare while generating additional value for your program."},{"tag":"Psychometrics","title":"Psychometric Services","desc":"Validation studies, cut scores, standard setting, statistical analysis, and ongoing exam maintenance."},{"tag":"Candidates","title":"Candidate Communications","desc":"Registration, scheduling, score reporting, accommodations, and ongoing support \u2014 handled by our experienced team."}]},"service":{"eyebrow":"Built around service","heading":"Technology makes testing possible.","heading_highlight":"People make it successful.","body":"Great technology should be backed by even better people. At Prov, you'll work with professionals who understand licensing, communicate openly, and genuinely care about your program's success \u2014 responsive, transparent, and easy to work with, from implementation through daily operations.","points":["Dedicated Program Manager","Highly Rated U.S.-Based Candidate Success Team","Fast Response Times","Customized Program Solutions","Long-Term Client Relationships"],"image_alt":"Prov team members meeting with a licensing program client"},"stay":{"heading_pre":"The reason clients","heading_highlight":"stay","items":[{"tag":"Responsive by design","title":"You talk to people who know your program","desc":"When questions arise, you reach experienced staff who understand your licensing program \u2014 not a generic call center reading from a script."},{"tag":"Flexible solutions","title":"Your program, not a template","desc":"Every licensing program is different. We tailor our processes, technology, and communications to fit your requirements rather than forcing a one-size-fits-all system."},{"tag":"Continuous improvement","title":"We keep making the experience better","desc":"We actively seek feedback from candidates, staff, and clients to improve every aspect of the testing experience, year after year."}]},"cta":{"heading":"Ready to improve your testing program?","body":"Whether you're launching a new examination program, exploring remote testing, or looking for a more responsive partner, we'd love to learn about your goals.","contact":"Start the Conversation"}},"remote_testing":{"meta":{"page_title":"Remote Testing \u2014 Prov"},"hero":{"eyebrow":"Skip the trip to a testing center","heading":"Take your exam from the comfort of home","heading_prefix":"with","heading_highlight":"remote testing.","powered_by":"Powered by","partner_logo_alt":"Examroom.AI","image_alt":"A candidate taking a remote examination on a laptop at home."},"notice":{"lead":"Not every exam qualifies for remote testing.","body":"Before scheduling, check your Candidate Information Bulletin to confirm your examination is eligible. Prefer to take your exam in person? Prov has a network of","body_bold":"over 300 testing locations nationwide."},"intro":{"heading":"Interested in testing from home?","heading_highlight":"Here's what you need to know.","image_alt":"A clean desk with a keyboard and mouse, ready for a remote examination.","paragraph_1":"Eligible candidates have the option to take their examination remotely through Examroom.AI, allowing you to take your exam from the comfort of home instead of traveling to a testing center.","paragraph_2":"Just like an in-person examination, your testing experience begins with a one-on-one check-in. A member of Prov's Test Administration team will verify your identity, inspect your testing environment, review your permitted materials, and explain the examination rules. Once check-in is complete, you'll be transferred to a live proctor who will monitor your examination and be available if you need assistance.","paragraph_3_prefix":"To protect the integrity of your examination,","paragraph_3_bold":"all remote candidates must meet certain technology and testing environment requirements","paragraph_3_suffix":"before testing begins. These standards help ensure every candidate has a fair, secure, and consistent testing experience."},"requirements":{"eyebrow":"First thing's first","heading":"Technology Requirements","sub":"Before scheduling a remote examination, make sure your computer meets the following requirements:","items":{"computer":{"title":"Compatible Computer","segments":[{"text":"Use a computer ","bold":false},{"text":"less than five years old","bold":true},{"text":" with ","bold":false},{"text":"administrator privileges","bold":true},{"text":" to install required software.","bold":false}],"desc":"Tablets and mobile devices are not supported."},"browser":{"title":"Supported Browser","lead":"You'll need Google Chrome for testing.","desc":"Before exam day, make sure you're using the latest version of Google Chrome."},"internet":{"title":"Reliable Internet","lead":"Your internet connection must be strong and stable.","desc":"Your connection should remain reliable from check-in through the end of your examination."},"webcam":{"title":"Webcam & Microphone","lead":"Your webcam and microphone must be working.","desc":"Your webcam and microphone are used to verify your identity, complete check-in, and monitor your examination."},"provlock":{"title":"ProvLock Extension","lead":"You'll need to install ProvLock.","desc":"ProvLock is our secure browser extension for Chrome that helps protect the integrity of your examination.","cta":"Download ProvLock"},"screen_sharing":{"title":"Screen Sharing","lead":"Your computer must allow screen sharing.","desc":"If you're using a work-issued computer, make sure your security settings won't prevent screen sharing during your examination."}}},"system_check":{"heading":"Not sure if your computer is compatible?","body_prefix":"Run the free Examroom.AI System Check","body_bold":"before scheduling your remote exam.","body_suffix":"In under a minute it verifies your computer, internet connection, webcam, microphone, and browser \u2014 so there are no surprises when you sit down for your exam.","partner_logo_alt":"Examroom.AI","cta":"Run a System Check"},"space":{"eyebrow":"Set the scene","heading":"Prepare your testing space","sub":"Before your exam begins, your testing environment will be reviewed to ensure it meets the requirements below. If it does not, you may be denied the ability to take your exam remotely and rescheduled at one of our in-person testing locations.","image_alt":"A tidy home office with a desk, monitor, and chair set up for a remote examination.","items":{"desk":{"title":"Use a desk or table","desc":"A flat, clear surface \u2014 free of any non-permitted materials."},"id":{"title":"Have your ID ready","desc":"Keep your government-issued photo ID within reach for check-in."},"lighting":{"title":"Good lighting","desc":"Your face and workspace need to be clearly visible on camera."},"alone":{"title":"Take your exam alone","desc":"No other people may be present in the room during your examination."},"clear":{"title":"Clear the area","desc":"Remove loose papers, notebooks, sticky notes, books, and other unauthorized materials."},"electronics":{"title":"Disconnect extra electronics","desc":"Additional monitors and similar devices must be unplugged before you begin."},"windows":{"title":"Close window coverings","desc":"If you're near windows, close blinds or curtains to reduce distractions."}}},"kit":{"heading":"Remote Testing Kit","heading_highlight":"Required for select remote examinations","image_alt":"A Prov Remote Testing Kit laid out on a desk: a sealed pouch, security bag, whiteboard, marker, and webcam cover.","paragraph_1":"Some licensing boards require candidates testing from home to use a Remote Testing Kit. The kit is designed to help ensure a smooth testing experience, prevent unnecessary interruptions, and meet security requirements for remote testing.","paragraph_2":"If your exam requires a Remote Testing Kit, we'll automatically ship one to the address you provide as soon as you schedule your remote examination.","paragraph_3_prefix":"There's nothing you need to do with your kit before your appointment. Simply","paragraph_3_bold":"have it available on exam day","paragraph_3_suffix":", and your onboarding agent will guide you through how and when to use each item."},"help":{"heading":"Need help?","subhead":"Whether you have questions about your exam or need technical assistance, we're here to help. Choose the type of support you need below.","cards":{"prov":{"title":"Contact Prov","desc":"Questions about your exam, scheduling, eligibility, accommodations, or general testing policies.","cta":"Contact Candidate Success"},"examroom":{"title":"Contact Examroom","desc":"Having trouble launching your exam or experiencing technical issues with your remote testing session?","cta":"Contact Technical Support"}}}},"prepare":{"meta":{"page_title":"Prepare for Exam Day \u2014 Prov"},"hero":{"eyebrow":"Prepare for exam day","heading_line_1":"Everything you need before","heading_line_2":"your exam,","heading_highlight":"all in one place."},"intro":{"heading":"Let's get ready for exam day.","subhead":"From your Candidate Information Bulletin to practice exams, exam day expectations, and preparation videos, you'll find everything you need in one place. Follow the steps below to prepare with confidence before your scheduled exam."},"steps":{"step_aria":"Step :number of :total","bulletin":{"title":"Find Your Candidate Information Bulletin","lead":"Your Candidate Information Bulletin (CIB) is the","lead_strong":"single most important resource before your exam","body":"Every licensing program has different requirements, policies, and testing procedures. Use our search tool to locate the bulletin for your state and exam.","submit":"Find My Exam Info","image_alt":"A contractor holding a Prov business and law study guide outside a job site"},"practice":{"title":"Prepare with Practice Exams","body_1":"Build confidence before exam day with official practice exams designed to familiarize you with the testing experience.","body_2":"Visit our bookstore to see if a practice exam is available for your exam.","cta":"View Available Practice Exams","image_alt":"A candidate studying at a desk with a practice exam open on a computer"},"expect":{"title":"Learn What to Expect on Exam Day","body_1":"Tell us where you plan to take your exam, and we'll show you what to expect on exam day.","body_2":"Choose your testing method to learn about check-in, security procedures, what to bring, and how to prepare for a successful exam.","cta_remote":"I Plan to Take My Exam Remotely","cta_in_person":"I Plan to Take My Exam In-Person","image_alt":"Candidates completing a hands-on practical exam at a Prov testing center"}}},"in_person_testing":{"meta":{"page_title":"In-Person Testing Guide \u2014 Prov"},"hero":{"eyebrow":"In-person examinations","heading_line_1":"300+ testing locations.","heading_line_2":"One trusted process.","subhead":"Whether you're testing at one of Prov's owned testing centers or a partner testing location, you'll experience the same secure check-in process, professional administration, and trusted testing standards from start to finish.","cta_schedule":"Schedule an Exam","cta_find_center":"Find a Testing Center","image_alt":"A Prov exam administrator standing in a testing room lined with candidate desks"},"centers":{"eyebrow":"Two types of Prov testing centers","heading":"Know where you're testing","subhead":"Before exam day, it's helpful to know which type of testing center you'll be visiting. Prov administers in-person examinations at Prov-owned testing centers and partner testing centers across the country. Although each location is a little different, every candidate can expect a secure, professional, and consistent testing experience.","prov_owned":{"title":"Prov-Owned Testing Centers","body_1_prefix":"Our owned testing centers are designed specifically for","body_1_bold":"practical examinations","body_2":"These locations most frequently host practical examinations, but can also administer computer-based theory exams.","image_alt":"An open practical examination room at a Prov-owned testing center with height-adjustable work tables"},"partner":{"title":"Partner Testing Centers","body_1_prefix":"Many computer-based examinations are delivered through our network of","body_1_bold":"more than 300 partner testing locations nationwide","body_1_suffix":", including universities and professional testing centers.","body_2":"While these locations are operated by trusted testing partners, candidates can expect the same secure examination standards and standardized check-in process.","image_alt":"Candidates taking computer-based exams at partitioned workstations in a partner testing center"}},"arrival":{"heading":"Give yourself plenty of time.","lead":"The biggest difference between testing locations is usually parking and building access.","paragraph_1":"If you're testing at a Prov-owned testing center, parking is typically located right outside the entrance, and arriving 15 minutes before your scheduled exam will give you plenty of time for check-in.","paragraph_2":"If you're testing at a partner testing site, parking and building access may vary depending on the location. Be sure to review your Candidate Information Bulletin (CIB) for any location-specific instructions, or visit the university or testing center's website for parking and campus information. For exams scheduled at partner testing sites, we recommend arriving 20\u201330 minutes early to allow extra time to park, locate the building, and find your testing room before check-in begins.","image_alt":"A candidate walking across a parking lot toward a testing building with study materials under his arm"},"welcome":{"eyebrow":"Arrival and check-in","heading":"A Friendly Welcome on Exam Day","intro":"Whether you're testing at a Prov-owned testing center or one of our trusted partner locations, you'll be greeted by a member of our exam administration team when you arrive.","list_heading":"Your examiner will:","items":{"identity":"Verify your identity using your valid, government-issued photo ID","materials":"Check in any approved testing materials, if applicable","questions":"Answer any last-minute questions","station":"Guide you to your assigned testing station"},"closing":"Our goal is to make your check-in process smooth, professional, and stress-free so you can focus on your exam.","tip_label":"Exam Day Tip:","tip_body":"Avoid delays on exam day by leaving prohibited items at home. If you arrive with restricted items, your proctor will ask you to place them in a secure locker (if available) or return them to your vehicle before your exam begins.","image_alt":"A Prov staff member welcoming a candidate at a testing center front desk"},"cta":{"heading":"Interested in testing in-person?","button":"Find a Location Near You"}},"boards_contact":{"meta":{"page_title":"Client Support \u2014 Licensing Boards \u2014 Prov"},"hero":{"eyebrow":"Get in touch","heading":"L
