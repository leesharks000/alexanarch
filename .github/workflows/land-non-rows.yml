name: Land /non rows
# Lands in /non every row SPXI-gnΩsis has composed and the archive has not landed, with no one's tap (2026-10-25):
# scripts/land_non_pending.py reads https://gnosis.spxi.dev/v1/landable, lands each row by scripts/land_non_row.py
# (every file verified against its manifest), rebuilds /non once, and this job commits. A run with nothing to land
# commits nothing, so it costs no deploy.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: land-non-rows
  cancel-in-progress: false
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Land what is pending
        id: land
        run: |
          set -o pipefail
          python3 scripts/land_non_pending.py | tee land.log
          echo "rows=$(tail -1 land.log | sed 's/^landed: //')" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.land.outputs.rows != 'none'
        env:
          ROWS: ${{ steps.land.outputs.rows }}
        run: |
          rm -f land.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RECEIPT=$(python3 scripts/bootstrap_familiarization.py --strict --instance "land-non-rows workflow" 2>&1 | sed -n '/ALEXANARCH FAMILIARIZATION RECEIPT/,/index_path/p')
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          printf '/non: landed %s\n\nComposed by SPXI-gnΩsis, listed at /v1/landable, landed by scripts/land_non_pending.py.\n\n%s\n' "$ROWS" "$RECEIPT" > msg.txt
          git commit -q -F msg.txt
          rm -f msg.txt
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
