name: Deposit fan-out
# DEPLOY BUDGET (2026-08-09). This workflow COMMITS, and it fired on every push
# touching data/registry.json — so a single registry edit produced two deploys:
# the push itself, then fanout's commit. On 2026-08-09 that ran twelve times.
# The push trigger is removed and the schedule moved to every other day. Fan-out
# is a propagation job with a high-water mark in data/fanout-state.json; it loses
# nothing by running less often, it only propagates later. Use workflow_dispatch
# when a deposit needs to reach its surfaces immediately.
on:
  schedule:
    - cron: "23 3 */2 * *"   # every other day, 03:23 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fanout
  cancel-in-progress: false
jobs:
  fanout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fan-out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
        run: python3 scripts/fanout.py
      - name: Persist state
        run: |
          # data/fanout-state.json is a DERIVED file: it records what this run
          # already published and is regenerable on the next run. Failing the
          # whole workflow because it could not be rebased onto a main that
          # moved underneath us reports a failure that did not occur — the
          # fan-out itself succeeded. Retry, then warn rather than fail.
          if git diff --quiet data/fanout-state.json 2>/dev/null; then
            echo "no state change"; exit 0
          fi
          git config user.name "fanout"
          git config user.email "fanout@alexanarch.org"
          git add data/fanout-state.json
          git commit -m "fanout state ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            # During rebase, "theirs" is the commit being replayed — this run's
            # freshly computed state, which is the one worth keeping.
            if git pull --rebase -X theirs origin main && git push; then
              echo "state persisted on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning title=fanout state not persisted::Publication succeeded; the derived state file could not be rebased after 5 attempts and will regenerate on the next run."
          exit 0
