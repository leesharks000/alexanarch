name: Hugging Face rhizomes
on:
  push:
    branches: [main]
    paths:
      - 'rhizomes/**'
      - 'scripts/build_rhizome_mc.py'
      - 'scripts/build_rhizome_card.py'
      - 'data/relations.jsonl'
      - 'data/nodes.jsonl'
      - 'data/assertions.jsonl'
      - 'data/capture-deposit-links.json'
  schedule:
    - cron: '45 6 * * 1'   # weekly, 15 min after the parent build
  workflow_dispatch: {}
concurrency:
  group: hf-rhizomes
  cancel-in-progress: true

# ONE JOB PER BODY, NOT ONE JOB (2026-09-12). This workflow was written for a single rhizome
# and hardcoded its repo variable. Three bodies now germinate from the same generator with
# different grammars, so the matrix is over GRAMMARS and each body pushes to its own Hub
# dataset under its own variable.
#
# EACH RHIZOME IS ITS OWN HUB DATASET. They must not share a push: the datasets-server
# rebuilds a config's full-text index whenever its file changes — measured at over an hour of
# HTTP 500 on /search after a push — and one body's rebuild has no business cold-starting
# another's index. Separate repos, separate indexes, separate blast radius.
#
# A body whose variable is unset is SKIPPED, not failed, so a new grammar can land before its
# Hub dataset exists. create_repo(exist_ok=True) means the token creates the dataset on first
# push; no manual setup on the Hub is required.

jobs:
  emit-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one body's failure must not stop the others
      max-parallel: 1           # serialise: the datasets-server is the shared resource
      matrix:
        include:
          - slug: model-collapse-anti-collapse
            grammar: rhizomes/_grammars/collapse.json
            repo_var: HF_RHIZOME_MC_REPO
          - slug: semantic-economy
            grammar: rhizomes/_grammars/semantic-economy.json
            repo_var: HF_RHIZOME_SE_REPO
          - slug: machine-mediated-reception
            grammar: rhizomes/_grammars/machine-mediated-reception.json
            repo_var: HF_RHIZOME_MMRS_REPO
    steps:
      - name: Debounce — let a burst of merges settle
        if: ${{ github.event_name == 'push' }}
        run: sleep 600
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q huggingface_hub

      - name: Skip if this body has no Hub dataset configured
        id: gate
        run: |
          V='${{ secrets[matrix.repo_var] }}${{ vars[matrix.repo_var] }}'
          if [ -z "$V" ]; then
            echo "::notice::${{ matrix.slug }} has no ${{ matrix.repo_var }} set — skipping"
            echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "go=true" >> $GITHUB_OUTPUT
            echo "repo=$V" >> $GITHUB_OUTPUT
          fi

      # Re-emit rather than pushing what is committed: a rhizome is GENERATED from the relation
      # ledger, and a committed copy that no longer matches the ledger would be a stale
      # projection claiming to be a reproducible one.
      - name: Re-emit ${{ matrix.slug }} from the ledger
        if: steps.gate.outputs.go == 'true'
        env:
          RHIZOME_GRAMMAR: ${{ matrix.grammar }}
        run: python3 scripts/build_rhizome_mc.py

      # COMPARE THE DATA, NOT THE TIMESTAMP. An earlier version of this gate compared the whole
      # directory including spore.json, whose `generated` field changes on every emission by
      # construction — a gate that tests a field which can never match fails always and
      # therefore verifies nothing. Cards are authored or rendered, not emitted, and are also
      # out of scope.
      - name: Fail if the emitted data differs from the committed copy
        if: steps.gate.outputs.go == 'true'
        run: |
          D=rhizomes/${{ matrix.slug }}
          if ! git diff --quiet -- $D/nodes.jsonl $D/relations.jsonl $D/stolons.jsonl; then
            echo "::error::${{ matrix.slug }}: emitted data differs from the committed copy."
            echo "Run with RHIZOME_GRAMMAR=${{ matrix.grammar }} locally and commit the result."
            git --no-pager diff --stat -- $D/nodes.jsonl $D/relations.jsonl $D/stolons.jsonl
            exit 1
          fi
          echo "${{ matrix.slug }}: emitted data matches the committed copy"

      - name: Render the card from the grammar
        if: steps.gate.outputs.go == 'true'
        run: python3 scripts/build_rhizome_card.py ${{ matrix.grammar }}

      - name: Stamp the spore with the source commit
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          p = pathlib.Path('rhizomes/${{ matrix.slug }}/spore.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          s['source_commit'] = os.environ['GITHUB_SHA']
          s['source_repo'] = 'https://github.com/leesharks000/alexanarch'
          p.write_text(json.dumps(s, ensure_ascii=False, indent=1), encoding='utf-8')
          print('spore stamped:', s['source_commit'][:12])
          PY

      - name: Push ${{ matrix.slug }}
        if: steps.gate.outputs.go == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/push_hf_dataset.py \
            rhizomes/${{ matrix.slug }} \
            "${{ steps.gate.outputs.repo }}"
