rival:
  name: the received account of the relations
  statement: Where Revelation and another book of the New Testament agree, the other book or the tradition behind it is the source, or both draw
    on scripture and a common stock.
  on_each_family:
    epistle: 'the epistles precede Revelation; the seven letters organize a practice already in place. Status: the missing-ancestor test (#1735)
      is run against it; the inverse, an epistle compressed to a letter, has not been built as a procedure.'
    founding-or-saying: 'sayings of Jesus in fixed oral form reach the seer (Vos 1965, as reported); parables worn to sayings in exhortation (Bauckham
      1977). An older position ran the other way: prophets'' first-person sayings entered the tradition (Bultmann). Status: the inverse rule,
      parable to saying, has not been built or run.'
    matthew: 'Mark, a sayings source and special material. Status: the sayings source is not extant; the procedure here leaves Mark in place and
      has not been run from any other source of like length as a control.'
    layer: 'Philo and the New Testament share a milieu. Status: the free test of Philo against Matthew was run and could not tell Matthew from
      Mark; the clustering of Philo''s places by treatise has no control yet.'
  rule: a bar set for the relations is set for the rival (#1753 rule 9); a rival procedure that has never been run carries that as its status
litmus:
  what_must_survive: the fan; the standings and what each licenses; the failures; that no relation decides order; the layer rule
  forbidden_operation: 'promoting a relation above its standing: reporting rows read as derivations, or the reach as proof of priority'
  dependency_chain: place of Revelation, operation, place of the target, standing, pointer; and for a layer, layer, place of Revelation, target
